<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings - Rox INTEN STUDIO</title>
    <!-- AI Background Removal Library -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/selfie_segmentation.js" crossorigin="anonymous"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; }
        body { background: #0c0c14; color: #fff; padding: 15px; }

        .back-btn { background: #222235; color: #00e5ff; padding: 8px 15px; border-radius: 5px; text-decoration: none; font-size: 13px; display: inline-block; margin-bottom: 15px; border: 1px solid #00e5ff; }
        
        .setting-card { background: #1a1a2b; border: 1px solid #2e2e48; padding: 15px; border-radius: 10px; margin-bottom: 15px; }
        .setting-card h3 { color: #00e5ff; font-size: 14px; margin-bottom: 10px; text-transform: uppercase; }

        button, input { width: 100%; padding: 10px; margin-top: 6px; background: #25253b; color: #fff; border: 1px solid #3e3e5e; border-radius: 5px; font-size: 12px; cursor: pointer; }
        button:hover { background: #00e5ff; color: #000; font-weight: bold; }
        .btn-green { background: #00c853; border: none; font-weight: bold; color: #000; }
        .btn-pink { background: linear-gradient(90deg, #ff007f, #7f00ff); border: none; font-weight: bold; }
        .btn-red { background: #ff1744; border: none; font-weight: bold; }

        .preview-box { position: relative; width: 100%; max-width: 320px; aspect-ratio: 9/16; background: #111; border: 2px solid #00e5ff; border-radius: 10px; overflow: hidden; margin: 10px auto; }
        canvas { width: 100%; height: 100%; object-fit: contain; }
        video, img { display: none; }
        #statusText { position: absolute; top: 10px; left: 10px; font-size: 11px; background: rgba(0,0,0,0.8); padding: 4px 8px; border-radius: 4px; color: #00e5ff; }
    </style>
</head>
<body>

    <a href="index.html" class="back-btn">⬅ वापस Studio (Home) पर जाएं</a>
    <h2>⚙️ लाइव कैमरा व AI बैकग्राउंड सेटिंग्स</h2>
    <br>

    <!-- Camera Controls -->
    <div class="setting-card">
        <h3>📹 1. लाइव कैमरा कंट्रोल</h3>
        <button onclick="startLiveCamera()" class="btn-green">▶️ कैमरा ऑन करें</button>
        <button onclick="stopLiveCamera()" style="background:#333;">⏹️ कैमरा बंद करें</button>
    </div>

    <!-- Background Selection -->
    <div class="setting-card">
        <h3>🖼️ 2. लाइव बैकग्राउंड रिप्लेसर</h3>
        <label style="font-size:11px; color:#aaa;">नया बैकग्राउंड रंग चुनें:</label>
        <input type="color" id="bgColorPicker" value="#00e5ff">
        
        <label style="font-size:11px; color:#aaa; margin-top:8px; display:block;">या नया बैकग्राउंड फोटो बदलें:</label>
        <input type="file" id="bgImageUpload" accept="image/*">
    </div>

    <!-- Live Studio Display & Controls -->
    <div class="setting-card" style="text-align: center;">
        <h3>🔴 लाइव AI प्रीव्यू व कैप्चर</h3>
        <div class="preview-box">
            <canvas id="outputCanvas"></canvas>
            <div id="statusText">कैमरा चालू करें</div>
        </div>
        <video id="inputVideo" playsinline muted></video>
        <img id="bgImage" crossorigin="anonymous">

        <button onclick="capturePhoto()" class="btn-pink">📷 AI फोटो खींचें और डाउनलोड करें</button>
        <button id="recordBtn" onclick="toggleRecord()" class="btn-red" style="margin-top:8px;">🔴 वीडियो रिकॉर्डिंग शुरू करें</button>
    </div>

    <script>
        const inputVideo = document.getElementById('inputVideo');
        const bgImageUpload = document.getElementById('bgImageUpload');
        const bgImage = document.getElementById('bgImage');
        const canvas = document.getElementById('outputCanvas');
        const ctx = canvas.getContext('2d');
        const statusText = document.getElementById('statusText');

        let selfieSegmentation, camera, mediaRecorder;
        let recordedChunks = [], isRecording = false;

        canvas.width = 360; 
        canvas.height = 640;

        function initAI() {
            selfieSegmentation = new SelfieSegmentation({
                locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/${file}`
            });
            selfieSegmentation.setOptions({ modelSelection: 1 });
            selfieSegmentation.onResults(onAIResults);
        }

        function onAIResults(results) {
            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = canvas.width; 
            tempCanvas.height = canvas.height;
            const tempCtx = tempCanvas.getContext('2d');

            tempCtx.drawImage(results.segmentationMask, 0, 0, canvas.width, canvas.height);
            const maskData = tempCtx.getImageData(0, 0, canvas.width, canvas.height);

            tempCtx.drawImage(results.image, 0, 0, canvas.width, canvas.height);
            const imgData = tempCtx.getImageData(0, 0, canvas.width, canvas.height);

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            if (bgImage.src && bgImage.complete) {
                ctx.drawImage(bgImage, 0, 0, canvas.width, canvas.height);
            } else {
                ctx.fillStyle = document.getElementById('bgColorPicker').value;
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            }

            const bgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            for (let i = 0; i < maskData.data.length; i += 4) {
                if (maskData.data[i] / 255 > 0.3) {
                    bgData.data[i] = imgData.data[i];
                    bgData.data[i+1] = imgData.data[i+1];
                    bgData.data[i+2] = imgData.data[i+2];
                }
            }
            ctx.putImageData(bgData, 0, 0);
        }

        function startLiveCamera() {
            statusText.innerText = "कैमरा चालू हो रहा है...";
            camera = new Camera(inputVideo, {
                onFrame: async () => { await selfieSegmentation.send({ image: inputVideo }); },
                width: 360, height: 640
            });
            camera.start();
            statusText.innerText = "🔴 AI कैमरा एक्टिव";
        }

        function stopLiveCamera() {
            if (camera) camera.stop();
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            statusText.innerText = "कैमरा बंद है";
        }

        bgImageUpload.addEventListener('change', (e) => {
            if (e.target.files[0]) bgImage.src = URL.createObjectURL(e.target.files[0]);
        });

        function capturePhoto() {
            const link = document.createElement('a');
            link.download = "Rox_AI_Photo.png";
            link.href = canvas.toDataURL("image/png");
            link.click();
        }

        function toggleRecord() {
            const btn = document.getElementById('recordBtn');
            if (!isRecording) {
                recordedChunks = [];
                const stream = canvas.captureStream(30);
                mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm' });
                mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) recordedChunks.push(e.data); };
                mediaRecorder.onstop = () => {
                    const blob = new Blob(recordedChunks, { type: 'video/webm' });
                    const a = document.createElement('a');
                    a.href = URL.createObjectURL(blob);
                    a.download = 'Rox_AI_Video.webm';
                    a.click();
                };
                mediaRecorder.start();
                isRecording = true;
                btn.innerText = "⏹️ रिकॉर्डिंग रोकें और सेव करें";
                btn.style.background = "#ff9100";
            } else {
                mediaRecorder.stop();
                isRecording = false;
                btn.innerText = "🔴 वीडियो रिकॉर्डिंग शुरू करें";
                btn.style.background = "#ff1744";
            }
        }

        window.onload = initAI;
    </script>
</body>
</html>
