<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Magic Studio</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            background-color: #0f1015;
            color: #ffffff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
        }

        .mobile-frame {
            width: 100%;
            max-width: 380px;
            background: #15161e;
            border-radius: 25px;
            padding: 15px;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
            border: 2px solid #2d3142;
            box-sizing: border-box;
        }

        .canvas-container {
            position: relative;
            width: 100%;
            height: 230px;
            background: #000;
            border-radius: 15px;
            overflow: hidden;
            border: 2px solid #ff007f;
            margin-bottom: 15px;
        }

        /* 🎥 कैमरा वीडियो फ़िक्स */
        #webcam {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 5; /* कैमरे को हमेशा ऊपर रखेगा */
        }

        .cam-btn {
            background: linear-gradient(135deg, #ff007f, #7f00ff);
            color: white;
            border: none;
            padding: 10px;
            width: 100%;
            border-radius: 10px;
            font-weight: bold;
            margin-bottom: 10px;
            cursor: pointer;
        }

        .tool-block {
            background: #1f2232;
            border: 1px solid #2d3142;
            border-radius: 15px;
            padding: 12px;
            margin-bottom: 12px;
        }

        .age-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .age-btn {
            background: #2d3142;
            color: white;
            border: 1px solid #3a3f58;
            padding: 8px;
            border-radius: 8px;
            font-size: 12px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="mobile-frame">
        <!-- कैमरा ऑन करने का मैन्युअल बटन -->
        <button class="cam-btn" onclick="startCamera()"><i class="fa-solid fa-camera"></i> 📸 यहाँ क्लिक करके कैमरा स्टार्ट करें</button>

        <div id="main-canvas" class="canvas-container">
            <video id="webcam" autoplay playsinline muted></video>
        </div>

        <div class="tool-block">
            <h3 style="color: #78ffd6; font-size: 14px;">1. AI लुक बदलें (Age View)</h3>
            <div class="age-grid">
                <button class="age-btn" onclick="applyAge('5')">5 Years (बालक)</button>
                <button class="age-btn" onclick="applyAge('15')">15 Years (किशोरी)</button>
                <button class="age-btn" onclick="applyAge('25')">25 Years (युवा)</button>
                <button class="age-btn" onclick="applyAge('45')">45 Years (मैच्योर)</button>
                <button class="age-btn" onclick="applyAge('70')" style="grid-column: span 2;">70 Years (बुजुर्ग)</button>
            </div>
        </div>
    </div>

    <script>
        const webcam = document.getElementById('webcam');
        const mainCanvas = document.getElementById('main-canvas');

        // 🎥 कैमरा शुरू करने का फ़ंक्शन
        async function startCamera() {
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                alert("आपका ब्राउज़र कैमरे को सपोर्ट नहीं करता या HTTPS प्रोटोकॉल चालू नहीं है!");
                return;
            }

            try {
                const constraints = {
                    video: { facingMode: "user", width: { ideal: 640 }, height: { ideal: 480 } },
                    audio: false
                };
                const stream = await navigator.mediaDevices.getUserMedia(constraints);
                webcam.srcObject = stream;
                webcam.play();
                alert("कैमरा सफलतापूर्वक चालू हो गया है!");
            } catch (err) {
                alert("कैमरा एरर: ब्राउज़र सेटिंग में जाकर Camera Permission को 'Allow' (अनुमति) करें।");
                console.error(err);
            }
        }

        // ऑटोमैटिक कैमरा स्टार्ट की कोशिश करें
        window.addEventListener('DOMContentLoaded', () => {
            startCamera();
        });

        // 🧠 AGE FILTER FUNCTION
        function applyAge(age) {
            if (age === '5') {
                mainCanvas.style.filter = 'saturate(1.8) brightness(1.2) contrast(0.9)';
            } else if (age === '15') {
                mainCanvas.style.filter = 'saturate(1.3) brightness(1.08)';
            } else if (age === '25') {
                mainCanvas.style.filter = 'none';
            } else if (age === '45') {
                mainCanvas.style.filter = 'contrast(1.3) sepia(0.25) brightness(0.85)';
            } else if (age === '70') {
                mainCanvas.style.filter = 'grayscale(0.65) contrast(1.5) brightness(0.8)';
            }
        }
    </script>
</body>
</html>
