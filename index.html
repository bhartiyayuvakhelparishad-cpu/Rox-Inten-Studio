<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rox INTEN STUDIO - Perfect AI BG</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; }
        body { background: #0c0c14; color: #fff; min-height: 100vh; display: flex; flex-direction: column; }

        .top-navbar { background: #161625; padding: 10px 15px; border-bottom: 2px solid #28283d; }
        .nav-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .logo-area h1 { color: #00e5ff; font-size: 20px; display: inline-block; }
        .logo-area span { color: #ff007f; font-size: 10px; font-weight: bold; }

        .nav-links { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
        .nav-links a { color: #ccc; text-decoration: none; font-size: 12px; padding: 6px 12px; background: #222235; border-radius: 5px; white-space: nowrap; border: 1px solid #383852; }
        .nav-links a:hover, .nav-links a.active { background: #00e5ff; color: #000; font-weight: bold; }
        .nav-links a.setting-btn { background: linear-gradient(90deg, #ff007f, #7f00ff); color: #fff; border: none; font-weight: bold; }

        .studio-body { display: flex; flex-direction: column; flex: 1; }
        @media (min-width: 768px) { .studio-body { display: grid; grid-template-columns: 320px 1fr; } }

        .sidebar-tools { background: #12121c; padding: 12px; overflow-y: auto; }
        .tool-card { background: #1a1a2b; padding: 12px; border-radius: 8px; margin-bottom: 12px; border: 1px solid #2e2e48; }
        .tool-card h3 { font-size: 12px; color: #00e5ff; margin-bottom: 8px; text-transform: uppercase; }

        button, select, input { width: 100%; padding: 8px; margin-top: 5px; background: #25253b; color: #fff; border: 1px solid #3e3e5e; border-radius: 5px; font-size: 12px; cursor: pointer; }
        button:hover { background: #00e5ff; color: #000; font-weight: bold; }
        .btn-pink { background: linear-gradient(90deg, #ff007f, #7f00ff); border: none; font-weight: bold; }

        .preview-workspace { display: flex; flex-direction: column; background: #050508; align-items: center; padding: 10px; justify-content: center; }
        .stage-box { position: relative; width: 100%; max-width: 320px; aspect-ratio: 9/16; background: #111; border: 2px solid #00e5ff; border-radius: 10px; overflow: hidden; }
        canvas { width: 100%; height: 100%; object-fit: contain; }

        #statusText { position: absolute; top: 10px; left: 10px; font-size: 11px; background: rgba(0,0,0,0.85); padding: 5px 10px; border-radius: 4px; color: #00e5ff; z-index: 10; border: 1px solid #00e5ff; }
    </style>
</head>
<body>

    <div class="top-navbar">
        <div class="nav-header">
            <div class="logo-area">
                <h1>Rox</h1> <span>INTEN STUDIO</span>
            </div>
            <div><span style="font-size: 11px; color: #00e5ff;">⏳ HD AI Engine</span></div>
        </div>
        <div class="nav-links">
            <a href="index.html" class="active">Home</a>
            <a href="upload.html">Upload</a>
            <a href="ai-tools.html">AI Magic</a>
            <a href="projects.html">Projects</a>
            <a href="setting.html" class="setting-btn">⚙️ Setting (Live Camera)</a>
            <a href="result.html">Result</a>
        </div>
    </div>

    <div class="studio-body">
        <div class="sidebar-tools">
            
            <div class="tool-card">
                <h3>🔑 1. Remove.bg API Key डालें</h3>
                <input type="text" id="apiKeyInput" placeholder="यहाँ अपनी API Key पेस्ट करें...">
            </div>

            <div class="tool-card">
                <h3>📁 2. फोटो अपलोड करें</h3>
                <input type="file" id="mediaUpload" accept="image/*">
            </div>

            <div class="tool-card">
                <h3>🖼️ 3. नया बैकग्राउंड चुनें</h3>
                <label style="font-size:11px; color:#aaa;">नया बैकग्राउंड रंग:</label>
                <input type="color" id="bgColorPicker" value="#00e5ff">
                
                <label style="font-size:11px; color:#aaa; margin-top:8px; display:block;">या नया बैकग्राउंड फोटो बदलें:</label>
                <input type="file" id="bgImageUpload" accept="image/*">
                
                <button onclick="processPerfectAIBg()" class="btn-pink">⚡ HD AI बैकग्राउंड बदलें</button>
            </div>

            <div class="tool-card">
                <h3>🔊 AI वॉयस ओवर</h3>
                <input type="text" id="ttsInput" placeholder="यहाँ टेक्स्ट लिखें...">
                <button onclick="speakAIVoice()">AI आवाज बनाएं</button>
            </div>

        </div>

        <div class="preview-workspace">
            <div class="stage-box">
                <canvas id="outputCanvas"></canvas>
                <div id="statusText">फोटो अपलोड करें</div>
            </div>
            <img id="bgImage" crossorigin="anonymous" style="display:none;">
        </div>
    </div>

    <script>
        const mediaUpload = document.getElementById('mediaUpload');
        const bgImageUpload = document.getElementById('bgImageUpload');
        const bgImage = document.getElementById('bgImage');
        const canvas = document.getElementById('outputCanvas');
        const ctx = canvas.getContext('2d');
        const statusText = document.getElementById('statusText');

        let rawSelectedFile = null;
        let transparentPersonImg = null;

        canvas.width = 360;
        canvas.height = 640;

        // 1. File Upload Handler
        mediaUpload.addEventListener('change', function(e) {
            rawSelectedFile = e.target.files[0];
            if (!rawSelectedFile) return;

            const img = new Image();
            img.src = URL.createObjectURL(rawSelectedFile);
            img.onload = () => {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                statusText.innerText = "फोटो लोड हो गई, 'HD AI बैकग्राउंड बदलें' दबाएं";
            };
        });

        // 2. Background Image Handler
        bgImageUpload.addEventListener('change', function(e) {
            if (e.target.files[0]) {
                bgImage.src = URL.createObjectURL(e.target.files[0]);
            }
        });

        // 3. Perfect API HD BG Removal
        async function processPerfectAIBg() {
            const apiKey = document.getElementById('apiKeyInput').value.trim();
            if (!apiKey) {
                alert("कृपया पहले अपनी Remove.bg API Key डालें!");
                return;
            }
            if (!rawSelectedFile) {
                alert("कृपया पहले फोटो अपलोड करें!");
                return;
            }

            statusText.innerText = "⏳ HD AI बैकग्राउंड रिमूव हो रहा है...";

            const formData = new FormData();
            formData.append('image_file', rawSelectedFile);
            formData.append('size', 'auto');

            try {
                const response = await fetch('https://api.remove.bg/v1.0/removebg', {
                    method: 'POST',
                    headers: { 'X-Api-Key': apiKey },
                    body: formData
                });

                if (!response.ok) throw new Error("API एरर - Key चेक करें!");

                const blob = await response.blob();
                transparentPersonImg = new Image();
                transparentPersonImg.src = URL.createObjectURL(blob);

                transparentPersonImg.onload = () => {
                    renderFinalCanvas();
                    statusText.innerText = "✅ HD बैकग्राउंड सफलतापूर्वक बदल गया!";
                };

            } catch (err) {
                alert("एरर: " + err.message);
                statusText.innerText = "प्रोसेस फेल हो गया";
            }
        }

        // 4. Render Final Composite Canvas
        function renderFinalCanvas() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw Selected Background (Image or Color)
            if (bgImage.src && bgImage.complete) {
                ctx.drawImage(bgImage, 0, 0, canvas.width, canvas.height);
            } else {
                ctx.fillStyle = document.getElementById('bgColorPicker').value;
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            }

            // Draw Transparent Person Image on Top
            if (transparentPersonImg) {
                ctx.drawImage(transparentPersonImg, 0, 0, canvas.width, canvas.height);
            }
        }

        function speakAIVoice() {
            const text = document.getElementById('ttsInput').value;
            if (!text) { alert('कृपया कुछ लिखें!'); return; }
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'hi-IN';
            window.speechSynthesis.speak(utterance);
        }
    </script>
</body>
</html>
