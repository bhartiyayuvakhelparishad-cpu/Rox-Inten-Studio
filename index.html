<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rox Inten Studio</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            background-color: #0f1015;
            color: #ffffff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .mobile-frame {
            width: 100%;
            max-width: 380px;
            background: #15161e;
            border-radius: 25px;
            padding: 15px;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
            border: 2px solid #2d3142;
            box-sizing: border-box;
            position: relative;
        }

        .header { text-align: center; margin-bottom: 15px; }
        .header h1 { margin: 5px 0; color: #ff007f; }

        #main-menu-container { display: block; }
        .setting-panel { display: none; flex-direction: column; gap: 15px; }

        .menu-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 15px;
        }

        .dark-btn, .neon-btn {
            background: #1f2232;
            color: #fff;
            padding: 12px;
            text-align: center;
            border-radius: 10px;
            text-decoration: none;
            font-size: 14px;
            border: 1px solid #2d3142;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .pro-btn {
            background: linear-gradient(135deg, #ff007f, #7f00ff);
            color: white;
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: 10px;
            font-weight: bold;
            margin-top: 15px;
            cursor: pointer;
        }

        /* 📺 AD SCREEN POPUP (ऐड देखने वाली स्क्रीन) */
        .ad-modal {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            border-radius: 25px;
            z-index: 10;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }

        .ad-box {
            border: 2px dashed #ff007f;
            padding: 20px;
            border-radius: 15px;
            background: #1f2232;
            width: 80%;
        }

        .back-btn {
            background: #1f2232;
            color: #ff007f;
            border: 1px solid #2d3142;
            padding: 8px 15px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="mobile-frame">
        <div class="header">
            <h1>Rox</h1>
            <h5>INTEN STUDIO</h5>
            <h4 id="statusMsg" style="color: #ff4757; margin-top: 5px;">Status: Locked</h4>
            <p id="adCounterText" style="color: #78ffd6; font-size: 12px;">Ads Completed: 0/3</p>
        </div>

        <!-- MAIN MENU -->
        <div id="main-menu-container">
            <div class="menu-grid">
                <a href="upload.html" class="dark-btn"><i class="fa-solid fa-upload"></i> Upload</a>
                <a href="ai-tools.html" class="dark-btn"><i class="fa-solid fa-wand-magic-sparkles"></i> AI Magic</a>
                <a href="#" id="setting-btn-trigger" class="dark-btn"><i class="fa-solid fa-gear"></i> Setting</a>
                <a href="support.html" class="dark-btn"><i class="fa-solid fa-headset"></i> Support</a>
            </div>

            <div class="unlock-area">
                <button onclick="openAdScreen()" class="pro-btn">
                    <i class="fa-solid fa-crown"></i> Unlock Pro (Watch Ad)
                </button>
            </div>
        </div>

        <!-- SETTING PANEL -->
        <div id="setting-panel" class="setting-panel">
            <button id="back-to-menu" class="back-btn"><i class="fa-solid fa-arrow-left"></i> Back</button>
            <h3 style="color:#78ffd6;">⚙️ Pro Settings Unlocked!</h3>
            <p>यहाँ आपके एआई टूल्स उपलब्ध हैं।</p>
        </div>

        <!-- 📺 AD POPUP SCREEN -->
        <div id="ad-modal" class="ad-modal">
            <div class="ad-box">
                <i class="fa-solid fa-rectangle-ad" style="font-size: 40px; color: #ffcc00; margin-bottom: 10px;"></i>
                <h3 style="margin: 5px 0;">Sponsor Ad Playing...</h3>
                <p style="font-size: 12px; color: #a0a5b5;">कृपया एड पूरा होने का इंतज़ार करें</p>
                <h2 id="ad-timer" style="color: #ff007f;">5</h2>
            </div>
        </div>

    </div>

    <script>
        let adCount = localStorage.getItem("ad_count") || 0;
        let unlockTime = localStorage.getItem("unlock_time");
        
        const statusMsg = document.getElementById("statusMsg");
        const adCounterText = document.getElementById("adCounterText");
        const adModal = document.getElementById("ad-modal");
        const adTimer = document.getElementById("ad-timer");

        function updateUI() {
            adCounterText.innerText = "Ads Completed: " + adCount + "/3";
            if (unlockTime && new Date().getTime() < unlockTime) {
                statusMsg.innerText = "Status: Pro Access Active!";
                statusMsg.style.color = "#78ffd6";
            }
        }
        updateUI();

        // 1. Ad Screen खोलना और 5 सेकंड का टाइमर चलाना
        function openAdScreen() {
            if (adCount >= 3) {
                alert("आप पहले ही 3 Ads देख चुके हैं! Pro अनलॉक है।");
                return;
            }

            adModal.style.display = "flex";
            let timeLeft = 5;
            adTimer.innerText = timeLeft;

            let countdown = setInterval(() => {
                timeLeft--;
                adTimer.innerText = timeLeft;

                if (timeLeft <= 0) {
                    clearInterval(countdown);
                    adModal.style.display = "none"; // Ad स्क्रीन बंद करें
                    
                    adCount = parseInt(adCount) + 1;
                    localStorage.setItem("ad_count", adCount);
                    
                    if (adCount >= 3) {
                        let expiry = new Date().getTime() + (72 * 60 * 60 * 1000); // 72 घंटे
                        localStorage.setItem("unlock_time", expiry);
                        alert("बधाई हो! 3 Ads पूरे हो गए। Pro अनलॉक हो गया है!");
                    } else {
                        alert("Ad पूरा देखा गया! आपको " + (3 - adCount) + " Ad और देखने हैं।");
                    }
                    updateUI();
                }
            }, 1000);
        }

        // 2. Setting बटन लॉजिक
        document.getElementById('setting-btn-trigger').addEventListener('click', (e) => {
            e.preventDefault();
            let isPro = localStorage.getItem("unlock_time") && new Date().getTime() < localStorage.getItem("unlock_time");

            if (isPro || adCount >= 3) {
                document.getElementById('main-menu-container').style.display = 'none';
                document.getElementById('setting-panel').style.display = 'flex';
            } else {
                alert("एक्सेस डिनाइड! पहले 'Unlock Pro' बटन दबाकर 3 Ads देखें। (अभी तक: " + adCount + "/3)");
            }
        });

        // 3. Back बटन
        document.getElementById('back-to-menu').addEventListener('click', () => {
            document.getElementById('setting-panel').style.display = 'none';
            document.getElementById('main-menu-container').style.display = 'block';
        });
    </script>
</body>
</html>
