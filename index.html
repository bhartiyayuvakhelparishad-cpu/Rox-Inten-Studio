<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Magic Studio</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            background-color: #0f1015;
            color: #ffffff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
        }

        .mobile-frame {
            width: 100%;
            max-width: 380px;
            background: #15161e;
            border-radius: 25px;
            padding: 15px;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
            border: 2px solid #2d3142;
            box-sizing: border-box;
        }

        .header-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .back-btn {
            color: #ff007f;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
        }

        .timer-box {
            background: #1f2232;
            border: 1px solid #2d3142;
            border-radius: 10px;
            padding: 8px;
            text-align: center;
            color: #ffcc00;
            font-weight: bold;
            margin-bottom: 15px;
            font-size: 14px;
        }

        /* 📸 फ़्रेम जहाँ फ़िल्टर दिखेगा */
        .canvas-container {
            position: relative;
            width: 100%;
            height: 220px;
            background: #000;
            border-radius: 15px;
            overflow: hidden;
            border: 2px solid #ff007f;
            margin-bottom: 15px;
            transition: filter 0.3s ease; /* पूरे कंटेनर पर फिल्टर लगेगा */
        }

        #webcam {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* 🖼️ अपलोड की गई फोटो लेयर */
        #bg-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            background-size: cover;
            background-position: center;
            display: none; /* डिफ़ॉल्ट रूप से छुपी रहेगी जब तक अपलोड न हो */
        }

        /* 🎭 एज मास्क लेयर */
        #age-mask {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 3;
            pointer-events: none;
        }

        .tool-block {
            background: #1f2232;
            border: 1px solid #2d3142;
            border-radius: 15px;
            padding: 12px;
            margin-bottom: 12px;
        }

        .tool-block h3 {
            margin: 0 0 10px 0;
            font-size: 14px;
            color: #78ffd6;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .age-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .age-btn {
            background: #2d3142;
            color: white;
            border: 1px solid #3a3f58;
            padding: 8px;
            border-radius: 8px;
            font-size: 12px;
            cursor: pointer;
            text-align: center;
        }

        .age-btn:active, .age-btn.active {
            background: #ff007f;
            border-color: #ff007f;
        }

        input[type="file"], input[type="text"] {
            width: 100%;
            background: #15161e;
            color: white;
            border: 1px solid #2d3142;
            padding: 8px;
            border-radius: 8px;
            box-sizing: border-box;
        }
    </style>
</head>
<body>

    <div class="mobile-frame">
        <div class="header-nav">
            <a href="#" class="back-btn"><i class="fa-solid fa-arrow-left"></i> Back</a>
            <h3 style="margin: 0; font-size: 16px;"><i class="fa-solid fa-wand-magic-sparkles" style="color: #ffcc00;"></i> AI Magic Studio</h3>
        </div>

        <div class="timer-box">
            ⏳ AI Access Timer: <span id="timer">03:37</span>
        </div>

        <!-- 📸 कैमरा + अपलोड इमेज कंटेनर -->
        <div id="main-canvas" class="canvas-container">
            <video id="webcam" autoplay playsinline></video>
            <div id="bg-overlay"></div>
            <div id="age-mask"></div>
        </div>

        <!-- 1. AGE LOOK TOOL -->
        <div class="tool-block">
            <h3><i class="fa-solid fa-face-smile"></i> 1. AI लुक बदलें (Age View)</h3>
            <div class="age-grid">
                <button class="age-btn" onclick="applyAge('5', this)">5 Years (बालक)</button>
                <button class="age-btn" onclick="applyAge('15', this)">15 Years (किशोरी)</button>
                <button class="age-btn" onclick="applyAge('25', this)">25 Years (युवा)</button>
                <button class="age-btn" onclick="applyAge('45', this)">45 Years (मैच्योर)</button>
                <button class="age-btn" onclick="applyAge('70', this)" style="grid-column: span 2;">70 Years (बुजुर्ग)</button>
            </div>
        </div>

        <!-- 2. BACKGROUND TEMPLATE -->
        <div class="tool-block">
            <h3><i class="fa-solid fa-image"></i> 2. चेंज बैकग्राउंड टेंपलेट</h3>
            <input type="file" id="bg-file" accept="image/*" onchange="changeBG(event)">
        </div>

        <!-- 3. TEXT & STICKERS -->
        <div class="tool-block">
            <h3><i class="fa-solid fa-font"></i> 3. टेक्स्ट डिज़ाइन (10 Styles) & स्टिकर्स</h3>
            <input type="text" placeholder="यहाँ अपना टेक्स्ट लिखें...">
        </div>
    </div>

    <script>
        const webcam = document.getElementById('webcam');
        const bgOverlay = document.getElementById('bg-overlay');
        const ageMask = document.getElementById('age-mask');
        const mainCanvas = document.getElementById('main-canvas');

        // 🎥 लाइव कैमरा ऑन करें
        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" }, audio: false });
                webcam.srcObject = stream;
            } catch (err) {
                console.log("Camera Permision Required:", err);
            }
        }
        startCamera();

        // 🧠 AGE CHANGE FUNCTION (अब यह पूरे कैनवास/फोटो पर काम करेगा!)
        function applyAge(age, btn) {
            document.querySelectorAll('.age-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');

            // सीधे मुख्य लेआउट (कंटेनर) पर फिल्टर लगाना
            if (age === '5') {
                mainCanvas.style.filter = 'saturate(1.8) brightness(1.2) contrast(0.9)';
                ageMask.style.background = 'radial-gradient(circle, rgba(255, 192, 203, 0.3) 0%, transparent 70%)';
            } else if (age === '15') {
                mainCanvas.style.filter = 'saturate(1.3) brightness(1.08) contrast(1.0)';
                ageMask.style.background = 'none';
            } else if (age === '25') {
                mainCanvas.style.filter = 'none';
                ageMask.style.background = 'none';
            } else if (age === '45') {
                mainCanvas.style.filter = 'contrast(1.3) sepia(0.25) brightness(0.85)';
                ageMask.style.background = 'radial-gradient(circle, transparent 30%, rgba(80, 40, 0, 0.3) 100%)';
            } else if (age === '70') {
                mainCanvas.style.filter = 'grayscale(0.65) contrast(1.5) brightness(0.8)';
                ageMask.style.background = 'repeating-linear-gradient(45deg, transparent, transparent 8px, rgba(0,0,0,0.15) 8px, rgba(0,0,0,0.15) 10px)';
            }
        }

        // 🖼️ अपलोड की गई इमेज पर फोटो चेंज करना
        function changeBG(event) {
            const file = event.target.files[0];
            if (file) {
                const url = URL.createObjectURL(file);
                bgOverlay.style.backgroundImage = `url('${url}')`;
                bgOverlay.style.display = "block"; // अपलोड होते ही इमेज ऊपर दिखना चालू हो जाएगी
            }
        }
    </script>
</body>
</html>
