<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rox Inten Studio - AI Talking Cartoon Generator</title>
    <!-- MediaPipe Selfie Segmentation for AI Background Removal -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils"></script>
    <style>
        body {
            background-color: #0f172a;
            color: #ffffff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 10px;
            box-sizing: border-box;
        }
        .rox-main-container {
            max-width: 650px;
            margin: 10px auto;
            background: #1e293b;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.6);
        }
        .rox-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #334155;
            padding-bottom: 10px;
            margin-bottom: 12px;
        }
        .rox-logo h1 {
            margin: 0;
            font-size: 20px;
            color: #38bdf8;
        }
        .rox-logo span {
            font-size: 10px;
            background: #0ea5e9;
            padding: 2px 5px;
            border-radius: 4px;
            color: #fff;
        }
        .ai-engine-status {
            font-size: 11px;
            color: #facc15;
            font-weight: bold;
        }
        .nav-tabs {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            margin-bottom: 15px;
        }
        .nav-tabs a {
            text-decoration: none;
            background: #334155;
            color: #fff;
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 12px;
            transition: 0.3s;
        }
        .nav-tabs a.active, .nav-tabs a:hover {
            background: #0ea5e9;
        }
        .section-box {
            background: #0f172a;
            border: 1px solid #334155;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 12px;
        }
        .section-box h3 {
            margin-top: 0;
            font-size: 15px;
            color: #38bdf8;
            margin-bottom: 10px;
        }
        label {
            display: block;
            margin-bottom: 4px;
            font-size: 12px;
            font-weight: bold;
            color: #cbd5e1;
        }
        input[type="text"], textarea, select, input[type="file"] {
            width: 100%;
            padding: 8px;
            background: #1e293b;
            border: 1px solid #475569;
            color: #fff;
            border-radius: 6px;
            box-sizing: border-box;
            margin-bottom: 10px;
            font-size: 13px;
        }
        textarea {
            height: 65px;
            resize: vertical;
        }
        .rox-btn {
            width: 100%;
            background: linear-gradient(90deg, #9333ea, #3b82f6);
            color: white;
            padding: 10px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.3s;
            margin-top: 5px;
        }
        .rox-btn:hover {
            opacity: 0.9;
        }
        .rox-btn-secondary {
            background: linear-gradient(90deg, #059669, #10b981);
            color: white;
            padding: 10px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 8px;
        }
        .rox-btn-danger {
            background: linear-gradient(90deg, #dc2626, #ef4444);
            padding: 6px 12px;
            font-size: 12px;
            border-radius: 5px;
            border: none;
            color: #fff;
            cursor: pointer;
            font-weight: bold;
        }
        #outputResult {
            margin-top: 15px;
            background: #1e293b;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #38bdf8;
            display: none;
            text-align: center;
        }
        /* Stage Screen */
        .cartoon-video-box {
            position: relative;
            width: 100%;
            max-width: 280px;
            height: 360px;
            margin: 0 auto;
            background: radial-gradient(circle, #334155 0%, #0f172a 100%);
            border-radius: 10px;
            overflow: hidden;
            border: 2px solid #38bdf8;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .cartoon-video-box canvas {
            width: 100%;
            height: 100%;
            object-fit: contain;
            filter: drop-shadow(0px 10px 20px rgba(56, 189, 248, 0.4));
        }
        .cartoon-badge {
            position: absolute;
            top: 10px;
            left: 10px;
            background: #0ea5e9;
            color: #fff;
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 10px;
            font-weight: bold;
            z-index: 10;
        }
        .cartoon-footer-text {
            position: absolute;
            bottom: 8px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(15, 23, 42, 0.9);
            color: #38bdf8;
            padding: 4px 10px;
            border-radius: 5px;
            font-size: 11px;
            font-weight: bold;
            width: 90%;
            text-align: center;
            border: 1px solid #334155;
            z-index: 10;
        }
        audio {
            width: 100%;
            margin-top: 10px;
        }
        #hiddenVideo {
            display: none;
        }
    </style>
</head>
<body>

    <div class="rox-main-container">
        <!-- Header -->
        <div class="rox-header">
            <div class="rox-logo">
                <h1>Rox <span>INTEN STUDIO</span></h1>
            </div>
            <div class="ai-engine-status">⏳ AI Engine: Active</div>
        </div>

        <!-- Navigation Tabs -->
        <div class="nav-tabs">
            <a href="index.html">Home</a>
            <a href="upload.html" class="active">Upload</a>
            <a href="ai-tools.html">AI Magic</a>
            <a href="explore.html">Explore</a>
            <a href="projects.html">Projects</a>
            <a href="mixing.html">Mixing</a>
            <a href="support.html">Support</a>
            <a href="cutter.html">Cutter</a>
            <a href="setting.html">⚙️ Setting</a>
            <a href="result.html">Result</a>
            <a href="register.html">Register</a>
        </div>

        <!-- Main Studio Control Box -->
        <div class="section-box">
            <h3>🎬 AI Dancing Girl - Background Remover Studio</h3>
            
            <label for="charName">1. Character ka Naam:</label>
            <input type="text" id="charName" placeholder="Jaise: Soni...">

            <label for="songAudio">2. Background Song / Audio Track:</label>
            <input type="file" id="songAudio" accept="audio/*">

            <label for="storyText">3. Lyrics / Dialogue:</label>
            <textarea id="storyText" placeholder="Yahan lyrics likhein..."></textarea>

            <button class="rox-btn" id="generateBtn" onclick="runStudio()">✨ AI Studio Start Karein</button>

            <!-- Result Box -->
            <div id="outputResult"></div>
        </div>
    </div>

    <video id="hiddenVideo" loop playsinline crossorigin="anonymous"></video>

    <script>
        let selfieSegmentation;
        let animationFrameId;
        let bgImageObj = null;
        let mediaRecorder;
        let recordedChunks = [];

        // Initialize MediaPipe AI Model
        function initAIModel() {
            selfieSegmentation = new SelfieSegmentation({
                locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/${file}`
            });
            selfieSegmentation.setOptions({ modelSelection: 1 });
            selfieSegmentation.onResults(onResults);
        }

        window.onload = initAIModel;

        function runStudio() {
            const charName = document.getElementById('charName').value.trim() || "Soni";
            const storyText = document.getElementById('storyText').value.trim() || "Live Dance";
            const songAudioInput = document.getElementById('songAudio');
            const outputResult = document.getElementById('outputResult');

            outputResult.style.display = "block";

            let audioTagHTML = "";
            if (songAudioInput.files && songAudioInput.files[0]) {
                const audioUrl = URL.createObjectURL(songAudioInput.files[0]);
                audioTagHTML = `<audio id="mainAudio" controls autoplay src="${audioUrl}"></audio>`;
            } else {
                audioTagHTML = `<p style="font-size:11px; color:#facc15;">🎵 Background Song Track</p>`;
            }

            let html = `<h4 style="color:#38bdf8; margin-top:0;">🎉 AI Background Remover Stage Ready!</h4>`;
            html += `<div class="cartoon-video-box">`;
            html += `<div class="cartoon-badge">✨ AI CUTOUT</div>`;
            html += `<canvas id="outputCanvas" width="280" height="360"></canvas>`;
            html += `<div class="cartoon-footer-text">🗣️ ${charName} Live Dance</div>`;
            html += `</div>`;

            html += `<div style="margin-top: 12px; font-size: 12px; text-align: left; background: #0f172a; padding: 10px; border-radius: 6px; border: 1px solid #475569;">`;
            html += `<b style="color:#38bdf8;">⚡ Live Video Controls:</b><br><br>`;
            
            html += `<label>Dance Karti Ladki Ka Video Select Karein:</label>`;
            html += `<input type="file" accept="video/*" onchange="loadUserVideo(event)" style="margin-bottom:8px;">`;

            // New Background Change Option
            html += `<label>Naya Background Image Select Karein:</label>`;
            html += `<input type="file" accept="image/*" onchange="loadCustomBackground(event)" style="margin-bottom:8px;">`;
            
            html += `<div style="display:flex; justify-content:space-between; align-items:center; background:#1e293b; padding:8px; border-radius:5px; margin-bottom:8px;">`;
            html += `<span><b>🔊 Added Video Sound:</b></span>`;
            html += `<button class="rox-btn-danger" id="muteBtn" onclick="toggleVideoMute()">🔇 Mute Video Sound</button>`;
            html += `</div>`;

            // Video Recording & Download Controls
            html += `<button class="rox-btn-secondary" onclick="startRecording()">🔴 Video Record Karein</button>`;
            html += `<button class="rox-btn" style="background:linear-gradient(90deg, #d97706, #f59e0b); display:none;" id="downloadBtn" onclick="downloadVideo()">⬇️ Video Download Karein</button>`;
            html += `</div>`;

            html += audioTagHTML;
            outputResult.innerHTML = html;
        }

        function loadUserVideo(event) {
            const file = event.target.files[0];
            if (!file) return;

            const hiddenVideo = document.getElementById('hiddenVideo');
            hiddenVideo.src = URL.createObjectURL(file);
            hiddenVideo.muted = true; 
            hiddenVideo.play();

            const canvas = document.getElementById('outputCanvas');
            const ctx = canvas.getContext('2d');

            async function processFrame() {
                if (!hiddenVideo.paused && !hiddenVideo.ended) {
                    await selfieSegmentation.send({ image: hiddenVideo });
                }
                animationFrameId = requestAnimationFrame(processFrame);
            }

            hiddenVideo.onloadeddata = () => {
                if (animationFrameId) cancelAnimationFrame(animationFrameId);
                processFrame();
            };
        }

        // Custom Background Image Loader
        function loadCustomBackground(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    bgImageObj = img;
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        // MediaPipe AI result renderer (Background Change & Cutout)
        function onResults(results) {
            const canvas = document.getElementById('outputCanvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');

            ctx.save();
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Agar user ne background image select ki hai toh pehle use draw karein, warna transparent/default
            if (bgImageObj) {
                ctx.drawImage(bgImageObj, 0, 0, canvas.width, canvas.height);
            }

            // Draw segment mask (AI detects person)
            ctx.save();
            ctx.globalCompositeOperation = 'destination-atop';
            // Agar background image nahi hai toh mask ke peeche default gradient/transparent rahega
            ctx.drawImage(results.segmentationMask, 0, 0, canvas.width, canvas.height);
            ctx.restore();

            // Draw the actual person over the background
            ctx.globalCompositeOperation = 'source-in';
            ctx.drawImage(results.image, 0, 0, canvas.width, canvas.height);

            ctx.restore();
        }

        // Mute / Unmute added video sound
        function toggleVideoMute() {
            const hiddenVideo = document.getElementById('hiddenVideo');
            const muteBtn = document.getElementById('muteBtn');

            if (hiddenVideo.muted) {
                hiddenVideo.muted = false;
                muteBtn.innerText = "🔊 Unmute Video Sound";
                muteBtn.style.background = "linear-gradient(90deg, #2563eb, #3b82f6)";
            } else {
                hiddenVideo.muted = true;
                muteBtn.innerText = "🔇 Mute Video Sound";
                muteBtn.style.background = "linear-gradient(90deg, #dc2626, #ef4444)";
            }
        }

        // Canvas Video Recording Function
        function startRecording() {
            const canvas = document.getElementById('outputCanvas');
            const stream = canvas.captureStream(30); // 30 FPS
            recordedChunks = [];

            try {
                mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm; codecs=vp9' });
            } catch (e) {
                mediaRecorder = new MediaRecorder(stream);
            }

            mediaRecorder.ondataavailable = function(event) {
                if (event.data.size > 0) {
                    recordedChunks.push(event.data);
                }
            };

            mediaRecorder.onstop = function() {
                const blob = new Blob(recordedChunks, { type: 'video/webm' });
                const videoUrl = URL.createObjectURL(blob);
                const downloadBtn = document.getElementById('downloadBtn');
                downloadBtn.style.display = "block";
                downloadBtn.onclick = function() {
                    const a = document.createElement('a');
                    a.style.display = 'none';
                    a.href = videoUrl;
                    a.download = 'rox-ai-dance-video.webm';
                    document.body.appendChild(a);
                    a.click();
                    setTimeout(() => {
                        document.body.removeChild(a);
                        window.URL.revokeObjectURL(videoUrl);
                    }, 100);
                };
                alert("Recording complete! Ab aap 'Video Download Karein' button par click karke video save kar sakte hain.");
            };

            mediaRecorder.start();
            alert("Recording shuru ho chuki hai! Video play hone dein, phir jab poori ho jaye toh dobara Studio controls ya kuch seconds baad rok sakte hain (auto record ke liye video ke end hone ka wait karein ya custom stop logic use karein).");
        }
    </script>
</body>
</html>
