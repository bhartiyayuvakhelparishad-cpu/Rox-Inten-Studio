<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rox Inten Studio - AI Voice Cloning & Studio</title>
    <style>
        body {
            background-color: #0f172a;
            color: #ffffff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 10px;
        }
        .rox-main-container {
            max-width: 700px;
            margin: 10px auto;
            background: #1e293b;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        .rox-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #334155;
            padding-bottom: 10px;
            margin-bottom: 15px;
        }
        .rox-logo h1 {
            margin: 0;
            font-size: 22px;
            color: #38bdf8;
        }
        .rox-logo span {
            font-size: 11px;
            background: #0ea5e9;
            padding: 2px 6px;
            border-radius: 4px;
        }
        .ai-engine-status {
            font-size: 12px;
            color: #facc15;
            font-weight: bold;
        }
        .nav-tabs {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 20px;
        }
        .nav-tabs a {
            text-decoration: none;
            background: #334155;
            color: #fff;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 13px;
            transition: 0.3s;
        }
        .nav-tabs a.active, .nav-tabs a:hover {
            background: #0ea5e9;
        }
        .section-box {
            background: #0f172a;
            border: 1px solid #334155;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
        }
        .section-box h3 {
            margin-top: 0;
            font-size: 16px;
            color: #38bdf8;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-size: 13px;
            font-weight: bold;
        }
        input[type="text"], textarea, select, input[type="file"] {
            width: 100%;
            padding: 8px;
            background: #1e293b;
            border: 1px solid #475569;
            color: #fff;
            border-radius: 6px;
            box-sizing: border-box;
            margin-bottom: 10px;
            font-size: 13px;
        }
        textarea {
            height: 70px;
            resize: vertical;
        }
        .rox-btn {
            width: 100%;
            background: linear-gradient(90deg, #9333ea, #3b82f6);
            color: white;
            padding: 10px;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.3s;
        }
        .rox-btn:hover {
            opacity: 0.9;
        }
        .rox-btn:disabled {
            background: #64748b;
            cursor: not-allowed;
        }
        #outputResult {
            margin-top: 15px;
            background: #1e293b;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #38bdf8;
            display: none;
            font-size: 13px;
            line-height: 1.4;
        }
        .preview-card {
            background: #0f172a;
            border: 1px solid #0ea5e9;
            border-radius: 8px;
            padding: 12px;
            margin-top: 10px;
            text-align: center;
        }
        .preview-card img {
            width: 100px;
            height: 100px;
            object-fit: cover;
            border-radius: 50%;
            border: 2px solid #38bdf8;
            margin-bottom: 8px;
        }
        audio {
            width: 100%;
            margin-top: 8px;
        }
        .hidden-field {
            display: none;
        }
    </style>
</head>
<body>

    <div class="rox-main-container">
        <!-- Header & Status -->
        <div class="rox-header">
            <div class="rox-logo">
                <h1>Rox <span>INTEN STUDIO</span></h1>
            </div>
            <div class="ai-engine-status">⏳ AI Voice & Video Engine: Active</div>
        </div>

        <!-- Navigation Tabs -->
        <div class="nav-tabs">
            <a href="index.html">Home</a>
            <a href="upload.html" class="active">Upload</a>
            <a href="ai-tools.html">AI Magic</a>
            <a href="projects.html">Projects</a>
            <a href="mixing.html">Mixing</a>
            <a href="support.html">Support</a>
            <a href="cutter.html">Cutter</a>
            <a href="setting.html">⚙️ Setting</a>
            <a href="result.html">Result</a>
        </div>

        <!-- 1. फोटो अपलोड करें Section -->
        <div class="section-box">
            <h3>📁 1. Character Photo Upload Karein</h3>
            <label for="charPhoto">Character Image:</label>
            <input type="file" id="charPhoto" accept="image/*">
        </div>

        <!-- 2. AI Voice Cloning & Singing Setup Section -->
        <div class="section-box">
            <h3>🎙️ 2. AI Voice Clone & Singing Style</h3>
            
            <label for="voiceCloneType">Awaaz (Voice) kiski honi chahiye?:</label>
            <select id="voiceCloneType" onchange="toggleVoiceSource()">
                <option value="preset">Famous Singer / AI Preset Voice</option>
                <option value="custom">Apni / Kisi ki Awaaz ki Sample File Upload Karein (Clone)</option>
            </select>

            <div id="customVoiceGroup" class="hidden-field">
                <label for="voiceSampleFile">🎵 Voice Sample File Upload Karein (10-30 sec audio):</label>
                <input type="file" id="voiceSampleFile" accept="audio/*">
            </div>

            <label for="charName">Character ka Naam:</label>
            <input type="text" id="charName" placeholder="Jaise: Soni, Rahul...">

            <label for="songAudio">🎵 Background Song / Music Track (Optional):</label>
            <input type="file" id="songAudio" accept="audio/*">

            <label for="voiceText">Gaane ke Bol (Lyrics) ya Story Dialogue:</label>
            <textarea id="voiceText" placeholder="Yahan wo lyrics ya kahani likhein jise AI us chuni hui awaaz me gayega ya bolega..."></textarea>

            <button class="rox-btn" id="generateBtn" onclick="runRoxVoiceAI()">✨ AI Voice Clone & Video Banayein</button>

            <!-- Result Box -->
            <div id="outputResult"></div>
        </div>
    </div>

    <script>
        function toggleVoiceSource() {
            const voiceType = document.getElementById('voiceCloneType').value;
            const customGroup = document.getElementById('customVoiceGroup');
            if (voiceType === 'custom') {
                customGroup.style.display = 'block';
            } else {
                customGroup.style.display = 'none';
            }
        }

        function runRoxVoiceAI() {
            const voiceType = document.getElementById('voiceCloneType').value;
            const charName = document.getElementById('charName').value.trim();
            const voiceText = document.getElementById('voiceText').value.trim();
            const charPhotoInput = document.getElementById('charPhoto');
            const voiceSampleInput = document.getElementById('voiceSampleFile');
            const songAudioInput = document.getElementById('songAudio');
            const outputResult = document.getElementById('outputResult');
            const btn = document.getElementById('generateBtn');

            if (!charName || !voiceText) {
                alert('Kripya Character ka naam aur Lyrics/Dialogue zaroor bharein!');
                return;
            }

            if (voiceType === 'custom' && (!voiceSampleInput.files || !voiceSampleInput.files[0])) {
                alert('Kripya Voice Cloning ke liye audio sample file upload karein!');
                return;
            }

            btn.innerText = "AI Voice Cloning & Singing Processing...";
            btn.disabled = true;
            outputResult.style.display = "block";
            outputResult.innerHTML = `⏳ AI Neural Engine active hai... <b>${charName}</b> ke liye voice clone karke gaana aur lip-sync animation taiyar kiya ja raha hai...`;

            setTimeout(() => {
                let photoUrl = "";
                if (charPhotoInput.files && charPhotoInput.files[0]) {
                    photoUrl = URL.createObjectURL(charPhotoInput.files[0]);
                }

                let customVoiceName = "AI Preset Melodic Voice";
                if (voiceType === 'custom' && voiceSampleInput.files[0]) {
                    customVoiceName = "Cloned from: " + voiceSampleInput.files[0].name;
                }

                let resultHTML = `🎉 <b>Rox Studio Voice Clone & AI Video Ready!</b><br>`;
                resultHTML += `<div class="preview-card">`;
                
                if (photoUrl) {
                    resultHTML += `<img src="${photoUrl}" alt="Character"><br>`;
                } else {
                    resultHTML += `<div style="font-size:40px; margin-bottom:5px;">🎤</div>`;
                }

                resultHTML += `<b>Character:</b> ${charName}<br>`;
                resultHTML += `<b>Voice Profile:</b> ${customVoiceName}<br>`;
                resultHTML += `<b>Lyrics / Script:</b> "${voiceText}"<br><br>`;

                resultHTML += `🎵 <b>Generated AI Singing & Dialogue Audio:</b><br>`;
                // Simulated audio player tag
                resultHTML += `<audio controls src="https://www.w3schools.com/html/horse.mp3"></audio><br>`;
                resultHTML += `<p style="color: #38bdf8; font-size: 12px; margin: 5px 0;">✨ Success! Voice cloned, tuned to musical scale, and mapped with character dance video.</p>`;

                resultHTML += `</div>`;

                outputResult.innerHTML = resultHTML;
                btn.innerText = "✨ AI Voice Clone & Video Banayein";
                btn.disabled = false;
            }, 2500);
        }
    </script>

</body>
</html>
