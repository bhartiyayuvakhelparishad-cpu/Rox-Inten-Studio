<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rox Inten Studio - AI Video & Studio</title>
    <style>
        body {
            background-color: #0f172a;
            color: #ffffff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 10px;
        }
        .rox-main-container {
            max-width: 700px;
            margin: 10px auto;
            background: #1e293b;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        .rox-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #334155;
            padding-bottom: 10px;
            margin-bottom: 15px;
        }
        .rox-logo h1 {
            margin: 0;
            font-size: 22px;
            color: #38bdf8;
        }
        .rox-logo span {
            font-size: 11px;
            background: #0ea5e9;
            padding: 2px 6px;
            border-radius: 4px;
        }
        .ai-engine-status {
            font-size: 12px;
            color: #facc15;
            font-weight: bold;
        }
        .nav-tabs {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 20px;
        }
        .nav-tabs a {
            text-decoration: none;
            background: #334155;
            color: #fff;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 13px;
            transition: 0.3s;
        }
        .nav-tabs a.active, .nav-tabs a:hover {
            background: #0ea5e9;
        }
        .section-box {
            background: #0f172a;
            border: 1px solid #334155;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
        }
        .section-box h3 {
            margin-top: 0;
            font-size: 16px;
            color: #38bdf8;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-size: 13px;
            font-weight: bold;
        }
        input[type="text"], textarea, select, input[type="file"] {
            width: 100%;
            padding: 8px;
            background: #1e293b;
            border: 1px solid #475569;
            color: #fff;
            border-radius: 6px;
            box-sizing: border-box;
            margin-bottom: 10px;
            font-size: 13px;
        }
        textarea {
            height: 70px;
            resize: vertical;
        }
        .rox-btn {
            width: 100%;
            background: linear-gradient(90deg, #9333ea, #3b82f6);
            color: white;
            padding: 10px;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.3s;
        }
        .rox-btn:hover {
            opacity: 0.9;
        }
        .rox-btn:disabled {
            background: #64748b;
            cursor: not-allowed;
        }
        #outputResult {
            margin-top: 15px;
            background: #1e293b;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #38bdf8;
            display: none;
            white-space: pre-wrap;
            font-size: 13px;
            line-height: 1.4;
        }
        .hidden-field {
            display: none;
        }
    </style>
</head>
<body>

    <div class="rox-main-container">
        <!-- Header & Status -->
        <div class="rox-header">
            <div class="rox-logo">
                <h1>Rox <span>INTEN STUDIO</span></h1>
            </div>
            <div class="ai-engine-status">⏳ AI Engine: Active</div>
        </div>

        <!-- Navigation Tabs (Screenshot ke anusaar sabhi buttons) -->
        <div class="nav-tabs">
            <a href="index.html">Home</a>
            <a href="upload.html" class="active">Upload</a>
            <a href="ai-tools.html">AI Magic</a>
            <a href="projects.html">Projects</a>
            <a href="mixing.html">Mixing</a>
            <a href="support.html">Support</a>
            <a href="cutter.html">Cutter</a>
            <a href="setting.html">⚙️ Setting</a>
            <a href="result.html">Result</a>
        </div>

        <!-- 1. फोटो अपलोड करें Section -->
        <div class="section-box">
            <h3>📁 1. फोटो अपलोड करें (Character Photo)</h3>
            <label for="charPhoto">Character Image Select Karein:</label>
            <input type="file" id="charPhoto" accept="image/*">
        </div>

        <!-- 2. बैकग्राउंड बदलें Section -->
        <div class="section-box">
            <h3>🖼️ 2. बैकग्राउंड बदलें & AI Style</h3>
            <label>नया रंग (Background Color):</label>
            <input type="text" id="bgColorInput" placeholder="Jaise: Blue, #123456...">
            <label>या नया फोटो लगाएं (Background Image):</label>
            <input type="file" id="bgImageFile" accept="image/*">
        </div>

        <!-- 3. AI वॉयस ओवर & सॉन्ग / डांस जनरेटर Section -->
        <div class="section-box">
            <h3>🔊 3. AI वॉयस ओवर, सॉन्ग और डांस जनरेटर</h3>
            
            <label for="creationMode">Mode Chunein:</label>
            <select id="creationMode" onchange="toggleMode()">
                <option value="text">Option 1: Custom Text Story / Dialogue</option>
                <option value="dance">Option 2: Song / Music Upload karke Dance Video</option>
            </select>

            <label for="charName">Character ka Naam:</label>
            <input type="text" id="charName" placeholder="Jaise: Rahul, Priya...">

            <div id="audioUploadGroup" class="hidden-field">
                <label for="songAudio">🎵 Song / Audio File Upload Karein:</label>
                <input type="file" id="songAudio" accept="audio/*">
            </div>

            <label for="voiceText">यहाँ टेक्स्ट, लिरिक्स या डांस स्टाइल लिखें:</label>
            <textarea id="voiceText" placeholder="AI voice over ke liye text ya gaane ke bol yahan likhein..."></textarea>

            <button class="rox-btn" id="generateBtn" onclick="runRoxStudioAI()">✨ AI Video / Dance / Voice Banayein</button>

            <!-- Result Box -->
            <div id="outputResult"></div>
        </div>
    </div>

    <script>
        // Mode switch karne ke liye function
        function toggleMode() {
            const mode = document.getElementById('creationMode').value;
            const audioGroup = document.getElementById('audioUploadGroup');
            if (mode === 'dance') {
                audioGroup.style.display = 'block';
            } else {
                audioGroup.style.display = 'none';
            }
        }

        // Main processing function jo sabhi buttons aur inputs ko handle karega
        function runRoxStudioAI() {
            const mode = document.getElementById('creationMode').value;
            const charName = document.getElementById('charName').value.trim();
            const voiceText = document.getElementById('voiceText').value.trim();
            const charPhoto = document.getElementById('charPhoto').files[0];
            const songAudio = document.getElementById('songAudio').files[0];
            const outputResult = document.getElementById('outputResult');
            const btn = document.getElementById('generateBtn');

            // Validation
            if (!charName || !voiceText) {
                alert('Kripya Character ka naam aur Text/Lyrics zaroor bharein!');
                return;
            }

            // UI Loading state
            btn.innerText = "AI Process Ho Raha Hai...";
            btn.disabled = true;
            outputResult.style.display = "block";
            outputResult.innerHTML = `⏳ AI Engine active hai... <b>${charName}</b> ke liye voiceover, background aur animation sync kiya ja raha hai...`;

            setTimeout(() => {
                let resultHTML = `<b>🎉 Rox Studio AI Processing Successful!</b><br><br>`;
                resultHTML += `👤 <b>Character:</b> ${charName}<br>`;
                resultHTML += `📝 <b>Input Text/Lyrics:</b> "${voiceText}"<br>`;

                if (charPhoto) {
                    const photoUrl = URL.createObjectURL(charPhoto);
                    resultHTML += `<br>🖼️ <b>Character Photo Loaded:</b><br><img src="${photoUrl}" style="max-width:100px; border-radius:5px; margin-top:5px;"><br>`;
                }

                if (mode === 'dance' && songAudio) {
                    resultHTML += `🎵 <b>Uploaded Song:</b> ${songAudio.name} (Beats Synced with Dance Animation)<br>`;
                    resultHTML += `✨ <i>Status: Gaane ki beat par character ka dancing video aur lip-syncing frames tayar kar diye gaye hain!</i>`;
                } else {
                    resultHTML += `🗣️ <b>Voiceover & Storyboard:</b> AI voice generated and synced successfully with cinematic scenes!`;
                }

                outputResult.innerHTML = resultHTML;
                btn.innerText = "✨ AI Video / Dance / Voice Banayein";
                btn.disabled = false;
            }, 2500);
        }
    </script>

</body>
</html>
