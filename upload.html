<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rox Inten Studio - AI Talking Cartoon Generator</title>
    <style>
        body {
            background-color: #0f172a;
            color: #ffffff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 10px;
            box-sizing: border-box;
        }
        .rox-main-container {
            max-width: 650px;
            margin: 10px auto;
            background: #1e293b;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.6);
        }
        .rox-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #334155;
            padding-bottom: 10px;
            margin-bottom: 12px;
        }
        .rox-logo h1 {
            margin: 0;
            font-size: 20px;
            color: #38bdf8;
        }
        .rox-logo span {
            font-size: 10px;
            background: #0ea5e9;
            padding: 2px 5px;
            border-radius: 4px;
            color: #fff;
        }
        .ai-engine-status {
            font-size: 11px;
            color: #facc15;
            font-weight: bold;
        }
        .nav-tabs {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            margin-bottom: 15px;
        }
        .nav-tabs a {
            text-decoration: none;
            background: #334155;
            color: #fff;
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 12px;
            transition: 0.3s;
        }
        .nav-tabs a.active, .nav-tabs a:hover {
            background: #0ea5e9;
        }
        .section-box {
            background: #0f172a;
            border: 1px solid #334155;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 12px;
        }
        .section-box h3 {
            margin-top: 0;
            font-size: 15px;
            color: #38bdf8;
            margin-bottom: 10px;
        }
        label {
            display: block;
            margin-bottom: 4px;
            font-size: 12px;
            font-weight: bold;
            color: #cbd5e1;
        }
        input[type="text"], textarea, select, input[type="file"] {
            width: 100%;
            padding: 8px;
            background: #1e293b;
            border: 1px solid #475569;
            color: #fff;
            border-radius: 6px;
            box-sizing: border-box;
            margin-bottom: 10px;
            font-size: 13px;
        }
        textarea {
            height: 65px;
            resize: vertical;
        }
        .rox-btn {
            width: 100%;
            background: linear-gradient(90deg, #9333ea, #3b82f6);
            color: white;
            padding: 10px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.3s;
            margin-top: 5px;
        }
        .rox-btn:hover {
            opacity: 0.9;
        }
        .rox-btn-secondary {
            background: linear-gradient(90deg, #059669, #10b981);
        }
        #outputResult {
            margin-top: 15px;
            background: #1e293b;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #38bdf8;
            display: none;
            text-align: center;
        }
        /* Stage Screen */
        .cartoon-video-box {
            position: relative;
            width: 100%;
            max-width: 280px;
            height: 360px;
            margin: 0 auto;
            background: radial-gradient(circle, #334155 0%, #0f172a 100%);
            border-radius: 10px;
            overflow: hidden;
            border: 2px solid #38bdf8;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .cartoon-video-box canvas {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            filter: drop-shadow(0px 10px 20px rgba(56, 189, 248, 0.4));
            animation: cartoonTalkingPulse 0.4s infinite alternate ease-in-out;
        }
        @keyframes cartoonTalkingPulse {
            0% { transform: scale(1); }
            100% { transform: scale(1.02); }
        }
        .cartoon-badge {
            position: absolute;
            top: 10px;
            left: 10px;
            background: #0ea5e9;
            color: #fff;
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 10px;
            font-weight: bold;
            z-index: 10;
        }
        .cartoon-footer-text {
            position: absolute;
            bottom: 8px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(15, 23, 42, 0.9);
            color: #38bdf8;
            padding: 4px 10px;
            border-radius: 5px;
            font-size: 11px;
            font-weight: bold;
            width: 90%;
            text-align: center;
            border: 1px solid #334155;
            z-index: 10;
        }
        audio {
            width: 100%;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="rox-main-container">
        <!-- Header -->
        <div class="rox-header">
            <div class="rox-logo">
                <h1>Rox <span>INTEN STUDIO</span></h1>
            </div>
            <div class="ai-engine-status">⏳ Engine: Active</div>
        </div>

        <!-- Navigation Tabs -->
        <div class="nav-tabs">
            <a href="index.html">Home</a>
            <a href="upload.html" class="active">Upload</a>
            <a href="ai-tools.html">AI Magic</a>
            <a href="explore.html">Explore</a>
            <a href="projects.html">Projects</a>
            <a href="mixing.html">Mixing</a>
            <a href="support.html">Support</a>
            <a href="cutter.html">Cutter</a>
            <a href="setting.html">⚙️ Setting</a>
            <a href="result.html">Result</a>
            <a href="register.html">Register</a>
        </div>

        <!-- Main Studio Control Box -->
        <div class="section-box">
            <h3>🎬 AI Photo Background Remover Studio</h3>
            
            <label for="charName">1. Character ka Naam:</label>
            <input type="text" id="charName" placeholder="Jaise: Soni...">

            <label for="charPhoto">2. Ladki ki Photo Upload Karein:</label>
            <input type="file" id="charPhoto" accept="image/*">

            <label for="songAudio">3. Song / Audio Track Upload Karein:</label>
            <input type="file" id="songAudio" accept="audio/*">

            <label for="storyText">4. Gaane ke Bol (Lyrics) ya Dialogue:</label>
            <textarea id="storyText" placeholder="Yahan lyrics likhein..."></textarea>

            <button class="rox-btn" id="generateBtn" onclick="runPhotoStudio()">✨ Background Hata Kar Video Banayein</button>

            <!-- Result Box -->
            <div id="outputResult"></div>
        </div>
    </div>

    <!-- Hidden Canvas for Image Processing -->
    <canvas id="hiddenCanvas" style="display:none;"></canvas>

    <script>
        function runPhotoStudio() {
            const charName = document.getElementById('charName').value.trim() || "Soni";
            const storyText = document.getElementById('storyText').value.trim() || "Live Song";
            const charPhotoInput = document.getElementById('charPhoto');
            const songAudioInput = document.getElementById('songAudio');
            const outputResult = document.getElementById('outputResult');
            const btn = document.getElementById('generateBtn');

            outputResult.style.display = "block";
            btn.innerText = "Background Removing...";
            btn.disabled = true;

            setTimeout(() => {
                let defaultImgUrl = "https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=500&auto=format&fit=crop&q=60";

                let audioTagHTML = "";
                if (songAudioInput.files && songAudioInput.files[0]) {
                    const audioUrl = URL.createObjectURL(songAudioInput.files[0]);
                    audioTagHTML = `<audio controls autoplay src="${audioUrl}"></audio>`;
                } else {
                    audioTagHTML = `<p style="font-size:11px; color:#facc15;">🎵 Default Audio Track Loaded</p>`;
                }

                let html = `<h4 style="color:#38bdf8; margin-top:0;">🎉 Background Successfully Removed!</h4>`;
                html += `<div class="cartoon-video-box">`;
                html += `<div class="cartoon-badge">✨ CLEAN CUTOUT</div>`;
                html += `<canvas id="displayCanvas" width="280" height="360"></canvas>`;
                html += `<div class="cartoon-footer-text">🗣️ ${charName} Live Performance</div>`;
                html += `</div>`;

                html += `<div style="margin-top: 10px; font-size: 12px; text-align: left; background: #0f172a; padding: 8px; border-radius: 5px; border: 1px solid #475569;">`;
                html += `<b>Character:</b> ${charName}<br>`;
                html += `<b>Status:</b> Background Removed & Stage Ready`;
                html += `</div>`;

                html += audioTagHTML;
                html += `<button class="rox-btn rox-btn-secondary" onclick="alert('Download started!')">📥 Download Final Image/Video</button>`;

                outputResult.innerHTML = html;

                // Load image and remove background
                const imgObj = new Image();
                imgObj.crossOrigin = "anonymous";
                
                if (charPhotoInput.files && charPhotoInput.files[0]) {
                    imgObj.src = URL.createObjectURL(charPhotoInput.files[0]);
                } else {
                    imgObj.src = defaultImgUrl;
                }

                imgObj.onload = function() {
                    removeImageBackground(imgObj);
                };

                btn.innerText = "✨ Background Hata Kar Video Banayein";
                btn.disabled = false;
            }, 1000);
        }

        function removeImageBackground(img) {
            const canvas = document.getElementById('displayCanvas');
            const ctx = canvas.getContext('2d', { willReadFrequently: true });

            canvas.width = 280;
            canvas.height = 360;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Draw image on canvas
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

            const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const data = imgData.data;

            // Sample background color from top-left corner
            const bgR = data[0];
            const bgG = data[1];
            const bgB = data[2];

            for (let i = 0; i < data.length; i += 4) {
                const r = data[i];
                const g = data[i + 1];
                const b = data[i + 2];

                // Calculate color difference
                const distance = Math.sqrt((r - bgR)**2 + (g - bgG)**2 + (b - bgB)**2);

                // If background color matches corner or is very light/white, make it transparent
                if (distance < 55 || (r > 235 && g > 235 && b > 235)) {
                    data[i + 3] = 0; // Alpha 0 (Transparent)
                }
            }

            ctx.putImageData(imgData, 0, 0);
        }
    </script>
</body>
</html>
