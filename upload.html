<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rox Inten Studio - AI Talking Cartoon Generator</title>
    <style>
        body {
            background-color: #0f172a;
            color: #ffffff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 10px;
            box-sizing: border-box;
        }
        .rox-main-container {
            max-width: 650px;
            margin: 10px auto;
            background: #1e293b;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.6);
        }
        .rox-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #334155;
            padding-bottom: 10px;
            margin-bottom: 12px;
        }
        .rox-logo h1 {
            margin: 0;
            font-size: 20px;
            color: #38bdf8;
        }
        .rox-logo span {
            font-size: 10px;
            background: #0ea5e9;
            padding: 2px 5px;
            border-radius: 4px;
            color: #fff;
        }
        .ai-engine-status {
            font-size: 11px;
            color: #facc15;
            font-weight: bold;
        }
        .nav-tabs {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            margin-bottom: 15px;
        }
        .nav-tabs a {
            text-decoration: none;
            background: #334155;
            color: #fff;
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 12px;
            transition: 0.3s;
        }
        .nav-tabs a.active, .nav-tabs a:hover {
            background: #0ea5e9;
        }
        .section-box {
            background: #0f172a;
            border: 1px solid #334155;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 12px;
        }
        .section-box h3 {
            margin-top: 0;
            font-size: 15px;
            color: #38bdf8;
            margin-bottom: 10px;
        }
        label {
            display: block;
            margin-bottom: 4px;
            font-size: 12px;
            font-weight: bold;
            color: #cbd5e1;
        }
        input[type="text"], textarea, select, input[type="file"] {
            width: 100%;
            padding: 8px;
            background: #1e293b;
            border: 1px solid #475569;
            color: #fff;
            border-radius: 6px;
            box-sizing: border-box;
            margin-bottom: 10px;
            font-size: 13px;
        }
        textarea {
            height: 65px;
            resize: vertical;
        }
        .rox-btn {
            width: 100%;
            background: linear-gradient(90deg, #9333ea, #3b82f6);
            color: white;
            padding: 10px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.3s;
            margin-top: 5px;
        }
        .rox-btn:hover {
            opacity: 0.9;
        }
        .rox-btn-secondary {
            background: linear-gradient(90deg, #059669, #10b981);
        }
        #outputResult {
            margin-top: 15px;
            background: #1e293b;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #38bdf8;
            display: none;
            text-align: center;
        }
        /* Video Container with Stage Background */
        .cartoon-video-box {
            position: relative;
            width: 100%;
            max-width: 280px;
            height: 360px;
            margin: 0 auto;
            background: radial-gradient(circle, #1e293b 0%, #020617 100%);
            border-radius: 10px;
            overflow: hidden;
            border: 2px solid #38bdf8;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        /* Object Cutout Display */
        .cartoon-video-box img, .cartoon-video-box video {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            filter: drop-shadow(0px 10px 15px rgba(0,255,255,0.3));
            animation: cartoonTalkingPulse 0.4s infinite alternate ease-in-out;
        }
        @keyframes cartoonTalkingPulse {
            0% { transform: scale(1); }
            100% { transform: scale(1.03); }
        }
        .cartoon-badge {
            position: absolute;
            top: 10px;
            left: 10px;
            background: #0ea5e9;
            color: #fff;
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 10px;
            font-weight: bold;
            z-index: 10;
        }
        .cartoon-footer-text {
            position: absolute;
            bottom: 8px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(15, 23, 42, 0.85);
            color: #38bdf8;
            padding: 4px 10px;
            border-radius: 5px;
            font-size: 11px;
            font-weight: bold;
            width: 90%;
            text-align: center;
            border: 1px solid #334155;
            z-index: 10;
        }
        audio {
            width: 100%;
            margin-top: 10px;
        }
        canvas {
            display: none;
        }
    </style>
</head>
<body>

    <div class="rox-main-container">
        <!-- Header & Status -->
        <div class="rox-header">
            <div class="rox-logo">
                <h1>Rox <span>INTEN STUDIO</span></h1>
            </div>
            <div class="ai-engine-status">⏳ Engine: Active</div>
        </div>

        <!-- Navigation Tabs -->
        <div class="nav-tabs">
            <a href="index.html">Home</a>
            <a href="upload.html" class="active">Upload</a>
            <a href="ai-tools.html">AI Magic</a>
            <a href="explore.html">Explore</a>
            <a href="projects.html">Projects</a>
            <a href="mixing.html">Mixing</a>
            <a href="support.html">Support</a>
            <a href="cutter.html">Cutter</a>
            <a href="setting.html">⚙️ Setting</a>
            <a href="result.html">Result</a>
            <a href="register.html">Register</a>
        </div>

        <!-- Main Studio Control Box -->
        <div class="section-box">
            <h3>🎬 AI Talking & Dancing Cartoon Studio</h3>
            
            <label for="charName">1. Character ka Naam:</label>
            <input type="text" id="charName" placeholder="Jaise: Soni, Rahul...">

            <label for="charPhoto">2. Photo/Image Upload Karein (Optional):</label>
            <input type="file" id="charPhoto" accept="image/*">

            <label for="songAudio">3. Song / Audio File Upload Karein:</label>
            <input type="file" id="songAudio" accept="audio/*">

            <label for="storyText">4. Gaane ke Bol (Lyrics) ya Dialogue:</label>
            <textarea id="storyText" placeholder="Yahan likhein lyrics ya dialogue..."></textarea>

            <button class="rox-btn" id="generateBtn" onclick="runCartoonStudio()">✨ AI Talking Cartoon Video Banayein</button>

            <!-- Result Box -->
            <div id="outputResult"></div>
        </div>
    </div>

    <!-- Hidden Canvas for Background Removal Processing -->
    <canvas id="bgProcessCanvas"></canvas>

    <script>
        function runCartoonStudio() {
            const charName = document.getElementById('charName').value.trim();
            const storyText = document.getElementById('storyText').value.trim();
            const charPhotoInput = document.getElementById('charPhoto');
            const songAudioInput = document.getElementById('songAudio');
            const outputResult = document.getElementById('outputResult');
            const btn = document.getElementById('generateBtn');

            if (!charName || !storyText) {
                alert('Kripya Character ka naam aur Lyrics/Dialogue zaroor bharein!');
                return;
            }

            btn.innerText = "AI Cartoon Rendering...";
            btn.disabled = true;
            outputResult.style.display = "block";
            outputResult.innerHTML = `⏳ <b>${charName}</b> ke liye AI video rendering aur background cut-out chal raha hai...`;

            setTimeout(() => {
                let defaultImg = "https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=500&auto=format&fit=crop&q=60"; 

                let audioTagHTML = "";
                let audioName = "Default Audio Track";

                if (songAudioInput.files && songAudioInput.files[0]) {
                    const realAudioUrl = URL.createObjectURL(songAudioInput.files[0]);
                    audioName = songAudioInput.files[0].name;
                    audioTagHTML = `<audio id="playerAudio" controls autoplay src="${realAudioUrl}"></audio>`;
                } else {
                    audioTagHTML = `<p style="font-size:11px; color:#facc15; margin-top:5px;">🎵 Default Voice Track Loaded</p>`;
                }

                let resultHTML = `<h4 style="color:#38bdf8; margin-top:0;">🎉 AI Talking/Dancing Cartoon Taiyar Hai!</h4>`;
                resultHTML += `<div class="cartoon-video-box" id="videoBox">`;
                resultHTML += `<div class="cartoon-badge">✨ TRANSPARENT OBJECT</div>`;
                resultHTML += `<img id="runningCartoonImg" src="${defaultImg}" alt="AI Talking Object">`;
                resultHTML += `<div class="cartoon-footer-text">🗣️ ${charName} Live Performance</div>`;
                resultHTML += `</div>`;
                
                // Live Object Swap Box (Aapke new video/image object ke liye)
                resultHTML += `<div style="margin-top: 10px; font-size: 12px; text-align: left; background: #0f172a; padding: 10px; border-radius: 5px; border: 1px solid #475569;">`;
                resultHTML += `<b style="color:#38bdf8;">⚡ Live Object Replacement (Background Auto-Remove):</b><br>`;
                resultHTML += `<label style="margin-top:6px; font-size:11px;">Chalte Video me Naya Dance/Singer Object (Image/Video) Dalein:</label>`;
                resultHTML += `<input type="file" id="liveSwapInput" accept="image/*,video/*" onchange="processAndSwapObject(event)" style="margin-bottom:5px;">`;
                resultHTML += `<span style="font-size:10px; color:#94a3b8;">* Naye object ka background automatically cut/delete ho jayega.</span><br><br>`;
                resultHTML += `<b>Character Name:</b> ${charName}<br>`;
                resultHTML += `<b>Audio Track:</b> ${audioName}<br>`;
                resultHTML += `</div>`;
                
                resultHTML += audioTagHTML;
                resultHTML += `<button class="rox-btn rox-btn-secondary" onclick="downloadVideo()">📥 Export & Download Final Video</button>`;

                outputResult.innerHTML = resultHTML;

                if (charPhotoInput.files && charPhotoInput.files[0]) {
                    removeBgFromImage(charPhotoInput.files[0]);
                }

                btn.innerText = "✨ AI Talking Cartoon Video Banayein";
                btn.disabled = false;
            }, 1500);
        }

        // Running Video mein naye Object ka background remove karne ka handler
        function processAndSwapObject(event) {
            const file = event.target.files[0];
            if (!file) return;

            if (file.type.startsWith('image/')) {
                removeBgFromImage(file);
            } else if (file.type.startsWith('video/')) {
                swapVideoObject(file);
            }
        }

        // Automatic Background Remover Function (Chrome-key / Color-threshold approach)
        function removeBgFromImage(file) {
            const img = new Image();
            img.src = URL.createObjectURL(file);
            img.onload = function () {
                const canvas = document.getElementById('bgProcessCanvas');
                const ctx = canvas.getContext('2d');
                canvas.width = img.width;
                canvas.height = img.height;
                
                ctx.drawImage(img, 0, 0);
                const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                const data = imageData.data;

                // Corner pixel color detection for background deletion
                const bgR = data[0];
                const bgG = data[1];
                const bgB = data[2];

                for (let i = 0; i < data.length; i += 4) {
                    const r = data[i];
                    const g = data[i + 1];
                    const b = data[i + 2];

                    // Agar pixel corner background color se milta julta hai ya light/white hai to hide (transparent) kar do
                    const distance = Math.sqrt((r - bgR)**2 + (g - bgG)**2 + (b - bgB)**2);
                    if (distance < 60 || (r > 240 && g > 240 && b > 240)) {
                        data[i + 3] = 0; // Alpha transparent
                    }
                }

                ctx.putImageData(imageData, 0, 0);
                const transparentUrl = canvas.toDataURL('image/png');
                
                const targetImg = document.getElementById('runningCartoonImg');
                if (targetImg) {
                    targetImg.src = transparentUrl;
                    alert("✅ Background successfully delete ho gaya! Sirf main Object screen par dikh raha hai.");
                }
            };
        }

        // Video Object Replacement Handler
        function swapVideoObject(file) {
            const videoUrl = URL.createObjectURL(file);
            const videoBox = document.getElementById('videoBox');
            
            videoBox.innerHTML = `
                <div class="cartoon-badge">✨ LIVE DANCING VIDEO OBJECT</div>
                <video id="runningVideoObj" src="${videoUrl}" autoplay loop muted style="mix-blend-mode: screen; width:100%; height:100%; object-fit:contain;"></video>
                <div class="cartoon-footer-text">🗣️ Dancing/Singing Object Live</div>
            `;
            alert("✅ Naya Video Object add ho gaya aur uska background screen blending mode ke dwara transparent ho gaya hai!");
        }

        function downloadVideo() {
            alert("📥 Video background cut-out ke sath download ke liye compile ho raha hai!");
        }
    </script>

</body>
</html>
