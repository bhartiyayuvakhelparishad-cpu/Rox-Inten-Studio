<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rox Inten Studio - AI Video & Dance Studio</title>
    <style>
        .rox-ai-container {
            max-width: 650px;
            margin: 20px auto;
            background: #1e293b;
            color: #ffffff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
            font-family: Arial, sans-serif;
            box-sizing: border-box;
        }
        .rox-ai-container h2 {
            text-align: center;
            color: #38bdf8;
            margin-bottom: 20px;
        }
        .rox-form-group {
            margin-bottom: 15px;
        }
        .rox-form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
            font-size: 14px;
        }
        .rox-form-group select, 
        .rox-form-group input[type="text"], 
        .rox-form-group textarea, 
        .rox-form-group input[type="file"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #475569;
            background: #0f172a;
            color: #fff;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
        }
        .rox-form-group textarea {
            resize: vertical;
            height: 80px;
        }
        .rox-btn {
            width: 100%;
            background-color: #0ea5e9;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }
        .rox-btn:hover {
            background-color: #0284c7;
        }
        .rox-btn:disabled {
            background-color: #64748b;
            cursor: not-allowed;
        }
        #roxOutputBox {
            margin-top: 20px;
            background: #0f172a;
            border: 1px solid #334155;
            padding: 15px;
            border-radius: 6px;
            white-space: pre-wrap;
            display: none;
            max-height: 380px;
            overflow-y: auto;
            font-size: 14px;
            line-height: 1.5;
        }
        .hidden-field {
            display: none;
        }
    </style>
</head>
<body>

    <div class="rox-ai-container">
        <h2>🎬 Rox Studio - AI Video & Dance Creator</h2>
        
        <!-- Step 1: Mode Selection -->
        <div class="rox-form-group">
            <label for="roxMode">Creation Type Chunein:</label>
            <select id="roxMode" onchange="handleRoxModeChange()">
                <option value="text">Option 1: Custom Text / Kahani se Video Story</option>
                <option value="image">Option 2: Photo Upload karke Cartoon / Dancing Video</option>
            </select>
        </div>

        <!-- Step 2: Character Name -->
        <div class="rox-form-group">
            <label for="roxCharName">Character ka Naam (Girl / Boy):</label>
            <input type="text" id="roxCharName" placeholder="Jaise: Priya, Rahul, Dancer Boy...">
        </div>

        <!-- Step 3: Image Upload Box (Only for Option 2) -->
        <div class="rox-form-group hidden-field" id="roxImageBox">
            <label for="roxImageFile">Character ki Photo Upload Karein:</label>
            <input type="file" id="roxImageFile" accept="image/*">
        </div>

        <!-- Step 4: Song / Audio Upload Box (For Dance & Song Synchronization) -->
        <div class="rox-form-group">
            <label for="roxAudioFile">🎵 Song / Audio Upload Karein (Local ya Singer ka Song):</label>
            <input type="file" id="roxAudioFile" accept="audio/*">
        </div>

        <!-- Step 5: Story / Lyrics / Dance Style Input -->
            <label for="roxStoryInput">Kahani, Song Lyrics ya Dance Style:</label>
            <textarea id="roxStoryInput" placeholder="Yahan gaane ke bol, lyrics ya batayein ki kis tarah ka dance/action hona chahiye..."></textarea>
        </div>

        <!-- Step 6: Main Action Button -->
        <button id="roxGenerateBtn" class="rox-btn" onclick="executeRoxAIGeneration()">AI Dance & Video Generate Karein</button>

        <!-- Step 7: Result Output Box -->
        <div id="roxOutputBox"></div>
    </div>

    <script>
        // Mode change hone par image upload section ko show/hide karne ke liye
        function handleRoxModeChange() {
            const selectedMode = document.getElementById('roxMode').value;
            const imageBox = document.getElementById('roxImageBox');
            
            if (selectedMode === 'image') {
                imageBox.classList.remove('hidden-field');
            } else {
                imageBox.classList.add('hidden-field');
            }
        }

        // Main execution function jab user button click karega
        function executeRoxAIGeneration() {
            const mode = document.getElementById('roxMode').value;
            const charName = document.getElementById('roxCharName').value.trim();
            const story = document.getElementById('roxStoryInput').value.trim();
            const imageFile = document.getElementById('roxImageFile').files[0];
            const audioFile = document.getElementById('roxAudioFile').files[0];
            const outputBox = document.getElementById('roxOutputBox');
            const btn = document.getElementById('roxGenerateBtn');

            // 1. Validation Check
            if (!charName || !story) {
                alert('Kripya Character ka naam aur Lyrics/Dance details zaroor bharein!');
                return;
            }

            if (mode === 'image' && !imageFile) {
                alert('Kripya Option 2 ke liye character ki photo upload karein!');
                return;
            }

            // 2. UI Loading State Active Karein
            btn.innerText = "AI Audio & Dance Sync Ho Raha Hai...";
            btn.disabled = true;
            outputBox.style.display = "block";
            outputBox.innerHTML = `⏳ AI Engine active hai... <b>${charName}</b> ke liye uploaded song ki beats ko analyze karke dancing animation frames aur lip-sync setup kiya ja raha hai...`;

            // 3. Client-side Simulated Processing Pipeline with Audio & Dance Features
            setTimeout(() => {
                let htmlResult = `<b>🎉 AI Dance Video Generation Successful!</b><br><br>`;
                htmlResult += `🔹 <b>Mode:</b> ${mode === 'image' ? 'Photo-to-Cartoon Dancing Avatar' : 'Text-to-Video Dance Story'}<br>`;
                htmlResult += `🔹 <b>Character Name:</b> ${charName}<br>`;
                htmlResult += `🔹 <b>Input Lyrics / Style:</b> "${story}"<br>`;

                // Audio File Details
                if (audioFile) {
                    htmlResult += `🔹 <b>Attached Song File:</b> 🎵 ${audioFile.name} (Successfully Synced with Beats)<br>`;
                } else {
                    htmlResult += `🔹 <b>Audio:</b> Default AI rhythmic beat track assigned.<br>`;
                }
                
                htmlResult += `<br>`;

                if (mode === 'image' && imageFile) {
                    const localImgUrl = URL.createObjectURL(imageFile);
                    htmlResult += `<b>Uploaded Character Photo:</b><br>`;
                    htmlResult += `<img src="${localImgUrl}" style="max-width: 140px; margin-top: 8px; border-radius: 6px; border: 1px solid #38bdf8;"><br><br>`;
                    htmlResult += `✨ <i>Status: Aapki di gayi photo ko 3D/Cartoon dancing model me convert kar diya gaya hai jo upload kiye gaye song ki har beat par dance aur lips move karega!</i>`;
                } else {
                    htmlResult += `✨ <b>Generated Dance Choreography Board:</b><br>`;
                    htmlResult += `1. <u>Beat Drop 1:</u> ${charName} ka energetic dance step start hoga.<br>`;
                    htmlResult += `2. <u>Chorus Section:</u> Gaane ke lyrics ke mutabiq expressions aur body movement sync ki gayi hai.<br>`;
                    htmlResult += `3. <u>Final Outro:</u> Grand dance finish aur closing frame render ho chuka hai.`;
                }

                outputBox.innerHTML = htmlResult;
                btn.innerText = "AI Dance & Video Generate Karein";
                btn.disabled = false;
            }, 3000);
        }
    </script>

</body>
</html>
