<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rox Inten Studio - AI Talking Cartoon Generator</title>
    <style>
        body {
            background-color: #0f172a;
            color: #ffffff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 10px;
            box-sizing: border-box;
        }
        .rox-main-container {
            max-width: 650px;
            margin: 10px auto;
            background: #1e293b;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.6);
        }
        .rox-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #334155;
            padding-bottom: 10px;
            margin-bottom: 12px;
        }
        .rox-logo h1 {
            margin: 0;
            font-size: 20px;
            color: #38bdf8;
        }
        .rox-logo span {
            font-size: 10px;
            background: #0ea5e9;
            padding: 2px 5px;
            border-radius: 4px;
            color: #fff;
        }
        .ai-engine-status {
            font-size: 11px;
            color: #facc15;
            font-weight: bold;
        }
        .nav-tabs {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            margin-bottom: 15px;
        }
        .nav-tabs a {
            text-decoration: none;
            background: #334155;
            color: #fff;
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 12px;
            transition: 0.3s;
        }
        .nav-tabs a.active, .nav-tabs a:hover {
            background: #0ea5e9;
        }
        .section-box {
            background: #0f172a;
            border: 1px solid #334155;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 12px;
        }
        .section-box h3 {
            margin-top: 0;
            font-size: 15px;
            color: #38bdf8;
            margin-bottom: 10px;
        }
        label {
            display: block;
            margin-bottom: 4px;
            font-size: 12px;
            font-weight: bold;
            color: #cbd5e1;
        }
        input[type="text"], textarea, select, input[type="file"] {
            width: 100%;
            padding: 8px;
            background: #1e293b;
            border: 1px solid #475569;
            color: #fff;
            border-radius: 6px;
            box-sizing: border-box;
            margin-bottom: 10px;
            font-size: 13px;
        }
        textarea {
            height: 65px;
            resize: vertical;
        }
        .rox-btn {
            width: 100%;
            background: linear-gradient(90deg, #9333ea, #3b82f6);
            color: white;
            padding: 10px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.3s;
            margin-top: 5px;
        }
        .rox-btn:hover {
            opacity: 0.9;
        }
        .rox-btn:disabled {
            background: #64748b;
            cursor: not-allowed;
        }
        .rox-btn-secondary {
            background: linear-gradient(90deg, #059669, #10b981);
        }
        #outputResult {
            margin-top: 15px;
            background: #1e293b;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #38bdf8;
            display: none;
            text-align: center;
        }
        .cartoon-video-box {
            position: relative;
            width: 100%;
            max-width: 280px;
            height: 360px;
            margin: 0 auto;
            background: #000;
            border-radius: 10px;
            overflow: hidden;
            border: 2px solid #38bdf8;
        }
        .cartoon-video-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            animation: cartoonTalkingPulse 0.4s infinite alternate ease-in-out;
        }
        @keyframes cartoonTalkingPulse {
            0% { transform: scale(1); filter: brightness(1); }
            100% { transform: scale(1.02); filter: brightness(1.08); }
        }
        .cartoon-badge {
            position: absolute;
            top: 10px;
            left: 10px;
            background: #0ea5e9;
            color: #fff;
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 10px;
            font-weight: bold;
        }
        .cartoon-footer-text {
            position: absolute;
            bottom: 8px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(15, 23, 42, 0.85);
            color: #38bdf8;
            padding: 4px 10px;
            border-radius: 5px;
            font-size: 11px;
            font-weight: bold;
            width: 90%;
            text-align: center;
            border: 1px solid #334155;
        }
        audio {
            width: 100%;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="rox-main-container">
        <!-- Header & Status -->
        <div class="rox-header">
            <div class="rox-logo">
                <h1>Rox <span>INTEN STUDIO</span></h1>
            </div>
            <div class="ai-engine-status" id="engineStatus">⏳ Engine: Active</div>
        </div>

        <!-- Navigation Tabs -->
        <div class="nav-tabs">
            <a href="index.html">Home</a>
            <a href="upload.html" class="active">Upload</a>
            <a href="ai-tools.html">AI Magic</a>
            <a href="explore.html">Explore</a>
            <a href="projects.html">Projects</a>
            <a href="mixing.html">Mixing</a>
            <a href="support.html">Support</a>
            <a href="cutter.html">Cutter</a>
            <a href="setting.html">⚙️ Setting</a>
            <a href="result.html">Result</a>
            <a href="register.html">Register</a>
        </div>

        <!-- Main Studio Control Box -->
        <div class="section-box">
            <h3>🎬 AI Talking Cartoon & Song Generator</h3>
            
            <label for="charName">1. Character ka Naam:</label>
            <input type="text" id="charName" placeholder="Jaise: Soni, Rahul...">

            <label for="charPhoto">2. Photo Upload Karein (Optional):</label>
            <input type="file" id="charPhoto" accept="image/*">

            <label for="songAudio">3. Song / Audio File Upload Karein:</label>
            <input type="file" id="songAudio" accept="audio/*">

            <label for="storyText">4. Gaane ke Bol (Lyrics) ya Dialogue:</label>
            <textarea id="storyText" placeholder="Yahan likhein lyrics ya dialogue..."></textarea>

            <button class="rox-btn" id="generateBtn" onclick="runCartoonStudio()">✨ AI Talking Cartoon Video Banayein</button>

            <!-- Result Box -->
            <div id="outputResult"></div>
        </div>
    </div>

    <script>
        let currentStreamUrl = "";
        let mediaRecorder;
        let recordedChunks = [];

        function runCartoonStudio() {
            const charName = document.getElementById('charName').value.trim();
            const storyText = document.getElementById('storyText').value.trim();
            const charPhotoInput = document.getElementById('charPhoto');
            const songAudioInput = document.getElementById('songAudio');
            const outputResult = document.getElementById('outputResult');
            const btn = document.getElementById('generateBtn');

            if (!charName || !storyText) {
                alert('Kripya Character ka naam aur Lyrics/Dialogue zaroor bharein!');
                return;
            }

            btn.innerText = "AI Cartoon Rendering...";
            btn.disabled = true;
            outputResult.style.display = "block";
            outputResult.innerHTML = `⏳ <b>${charName}</b> ke liye AI talking cartoon video taiyar kiya ja raha hai...`;

            setTimeout(() => {
                let finalImgSrc = "";
                if (charPhotoInput.files && charPhotoInput.files[0]) {
                    finalImgSrc = URL.createObjectURL(charPhotoInput.files[0]);
                } else {
                    finalImgSrc = "https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=500&auto=format&fit=crop&q=60"; 
                }

                currentImgSrc = finalImgSrc;

                let audioTagHTML = "";
                let audioName = "Default Audio Track";

                if (songAudioInput.files && songAudioInput.files[0]) {
                    const realAudioUrl = URL.createObjectURL(songAudioInput.files[0]);
                    audioName = songAudioInput.files[0].name;
                    audioTagHTML = `<audio id="playerAudio" controls autoplay src="${realAudioUrl}"></audio>`;
                } else {
                    audioTagHTML = `<p style="font-size:11px; color:#facc15; margin-top:5px;">🎵 Default Voice Track Loaded</p>`;
                }

                let resultHTML = `<h4 style="color:#38bdf8; margin-top:0;">🎉 AI Talking Cartoon Taiyar Hai!</h4>`;
                resultHTML += `<div class="cartoon-video-box" id="videoBox">`;
                resultHTML += `<div class="cartoon-badge">✨ LIVE AI</div>`;
                resultHTML += `<img id="runningCartoonImg" src="${finalImgSrc}" alt="AI Talking Cartoon">`;
                resultHTML += `<div class="cartoon-footer-text" id="runningFooterText">🗣️ ${charName} Speaking Live</div>`;
                resultHTML += `</div>`;
                
                // Live Running Edit Panel (Running video me character/photo turant badalne ke liye)
                resultHTML += `<div style="margin-top: 10px; font-size: 12px; text-align: left; background: #0f172a; padding: 10px; border-radius: 5px; border: 1px solid #475569;">`;
                resultHTML += `<b>⚡ Live Video Editing Panel:</b><br>`;
                resultHTML += `<label style="margin-top:6px; font-size:11px;">Chalte Hue Video Mein Dusri Photo/Character Dalein:</label>`;
                resultHTML += `<input type="file" id="liveSwapInput" accept="image/*" onchange="swapRunningCharacter(event)" style="margin-bottom:5px;">`;
                resultHTML += `<b>Character:</b> <span id="displayName">${charName}</span><br>`;
                resultHTML += `<b>Audio:</b> ${audioName}<br>`;
                resultHTML += `</div>`;
                
                resultHTML += audioTagHTML;

                // Download & Record options
                resultHTML += `<button class="rox-btn rox-btn-secondary" onclick="downloadCartoonVideo()">📥 Download Video (.webm)</button>`;

                outputResult.innerHTML = resultHTML;
                btn.innerText = "✨ AI Talking Cartoon Video Banayein";
                btn.disabled = false;
            }, 2000);
        }

        // Running video/image ko live badalne ka function
        function swapRunningCharacter(event) {
            const file = event.target.files[0];
            if (file) {
                const newImgUrl = URL.createObjectURL(file);
                const runningImg = document.getElementById('runningCartoonImg');
                if (runningImg) {
                    runningImg.src = newImgUrl;
                    alert("✨ Running video mein character successfully update/edit ho gaya!");
                }
            }
        }

        // Video recording aur download simulation/handler
        function downloadCartoonVideo() {
            const videoBox = document.getElementById('videoBox');
            if (!videoBox) return;

            alert("📥 Aapka video compile ho raha hai. Download shuru ho raha hai...");
            
            // Canvas/Blob simulation ya simple anchor download mock for webm element
            const canvas = document.createElement('canvas');
            canvas.width = 280;
            canvas.height = 360;
            const ctx = canvas.getContext('2d');
            const img = document.getElementById('runningCartoonImg');

            img.crossOrigin = "anonymous";
            img.onload = function() {
                ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                canvas.toBlob(function(blob) {
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = 'RoxIntenStudio_TalkingCartoon.png'; // Fallback snapshot/video wrapper
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                }, 'image/png');
            };

            // Force load if already loaded
            if(img.complete) {
                img.onload();
            }
        }
    </script>

</body>
</html>
