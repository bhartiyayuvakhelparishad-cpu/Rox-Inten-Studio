<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rox Inten Studio - AI Talking Cartoon Generator</title>
    <style>
        body {
            background-color: #0f172a;
            color: #ffffff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 10px;
            box-sizing: border-box;
        }
        .rox-main-container {
            max-width: 650px;
            margin: 10px auto;
            background: #1e293b;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.6);
        }
        .rox-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #334155;
            padding-bottom: 10px;
            margin-bottom: 12px;
        }
        .rox-logo h1 {
            margin: 0;
            font-size: 20px;
            color: #38bdf8;
        }
        .rox-logo span {
            font-size: 10px;
            background: #0ea5e9;
            padding: 2px 5px;
            border-radius: 4px;
            color: #fff;
        }
        .ai-engine-status {
            font-size: 11px;
            color: #facc15;
            font-weight: bold;
        }
        .nav-tabs {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            margin-bottom: 15px;
        }
        .nav-tabs a {
            text-decoration: none;
            background: #334155;
            color: #fff;
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 12px;
            transition: 0.3s;
        }
        .nav-tabs a.active, .nav-tabs a:hover {
            background: #0ea5e9;
        }
        .section-box {
            background: #0f172a;
            border: 1px solid #334155;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 12px;
        }
        .section-box h3 {
            margin-top: 0;
            font-size: 15px;
            color: #38bdf8;
            margin-bottom: 10px;
        }
        label {
            display: block;
            margin-bottom: 4px;
            font-size: 12px;
            font-weight: bold;
            color: #cbd5e1;
        }
        input[type="text"], textarea, select, input[type="file"] {
            width: 100%;
            padding: 8px;
            background: #1e293b;
            border: 1px solid #475569;
            color: #fff;
            border-radius: 6px;
            box-sizing: border-box;
            margin-bottom: 10px;
            font-size: 13px;
        }
        textarea {
            height: 65px;
            resize: vertical;
        }
        .rox-btn {
            width: 100%;
            background: linear-gradient(90deg, #9333ea, #3b82f6);
            color: white;
            padding: 10px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.3s;
            margin-top: 5px;
        }
        .rox-btn:hover {
            opacity: 0.9;
        }
        .rox-btn-secondary {
            background: linear-gradient(90deg, #059669, #10b981);
        }
        .rox-btn-danger {
            background: linear-gradient(90deg, #dc2626, #ef4444);
            padding: 5px 10px;
            font-size: 11px;
            width: auto;
            margin-top: 0;
        }
        #outputResult {
            margin-top: 15px;
            background: #1e293b;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #38bdf8;
            display: none;
            text-align: center;
        }
        /* Video Container Stage */
        .cartoon-video-box {
            position: relative;
            width: 100%;
            max-width: 280px;
            height: 360px;
            margin: 0 auto;
            background: radial-gradient(circle, #334155 0%, #0f172a 100%);
            border-radius: 10px;
            overflow: hidden;
            border: 2px solid #38bdf8;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .cartoon-video-box canvas {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            filter: drop-shadow(0px 10px 20px rgba(56, 189, 248, 0.4));
            animation: cartoonTalkingPulse 0.4s infinite alternate ease-in-out;
        }
        @keyframes cartoonTalkingPulse {
            0% { transform: scale(1); }
            100% { transform: scale(1.02); }
        }
        .cartoon-badge {
            position: absolute;
            top: 10px;
            left: 10px;
            background: #0ea5e9;
            color: #fff;
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 10px;
            font-weight: bold;
            z-index: 10;
        }
        .cartoon-footer-text {
            position: absolute;
            bottom: 8px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(15, 23, 42, 0.9);
            color: #38bdf8;
            padding: 4px 10px;
            border-radius: 5px;
            font-size: 11px;
            font-weight: bold;
            width: 90%;
            text-align: center;
            border: 1px solid #334155;
            z-index: 10;
        }
        audio {
            width: 100%;
            margin-top: 10px;
        }
        #hiddenSourceVideo {
            display: none;
        }
    </style>
</head>
<body>

    <div class="rox-main-container">
        <!-- Header & Status -->
        <div class="rox-header">
            <div class="rox-logo">
                <h1>Rox <span>INTEN STUDIO</span></h1>
            </div>
            <div class="ai-engine-status">⏳ Engine: Active</div>
        </div>

        <!-- Navigation Tabs -->
        <div class="nav-tabs">
            <a href="index.html">Home</a>
            <a href="upload.html" class="active">Upload</a>
            <a href="ai-tools.html">AI Magic</a>
            <a href="explore.html">Explore</a>
            <a href="projects.html">Projects</a>
            <a href="mixing.html">Mixing</a>
            <a href="support.html">Support</a>
            <a href="cutter.html">Cutter</a>
            <a href="setting.html">⚙️ Setting</a>
            <a href="result.html">Result</a>
            <a href="register.html">Register</a>
        </div>

        <!-- Main Studio Control Box -->
        <div class="section-box">
            <h3>🎬 AI Talking & Dancing Cartoon Studio</h3>
            
            <label for="charName">1. Character ka Naam:</label>
            <input type="text" id="charName" placeholder="Jaise: Soni, Rahul...">

            <label for="charPhoto">2. Ladki/Character ki Photo Upload Karein:</label>
            <input type="file" id="charPhoto" accept="image/*">

            <label for="songAudio">3. Song / Audio Track Upload Karein:</label>
            <input type="file" id="songAudio" accept="audio/*">

            <label for="storyText">4. Gaane ke Bol (Lyrics) ya Dialogue:</label>
            <textarea id="storyText" placeholder="Yahan likhein lyrics ya dialogue..."></textarea>

            <button class="rox-btn" id="generateBtn" onclick="runCartoonStudio()">✨ AI Talking Cartoon Video Banayein</button>

            <!-- Result Box -->
            <div id="outputResult"></div>
        </div>
    </div>

    <!-- Hidden Video & Canvas Processors -->
    <video id="hiddenSourceVideo" autoplay loop muted playsinline></video>
    <canvas id="bgProcessCanvas" style="display:none;"></canvas>

    <script>
        let renderAnimationId;

        function runCartoonStudio() {
            const charName = document.getElementById('charName').value.trim();
            const storyText = document.getElementById('storyText').value.trim();
            const charPhotoInput = document.getElementById('charPhoto');
            const songAudioInput = document.getElementById('songAudio');
            const outputResult = document.getElementById('outputResult');
            const btn = document.getElementById('generateBtn');

            if (!charName || !storyText) {
                alert('Kripya Character ka naam aur Lyrics/Dialogue zaroor bharein!');
                return;
            }

            btn.innerText = "AI Processing & BG Removal...";
            btn.disabled = true;
            outputResult.style.display = "block";
            outputResult.innerHTML = `⏳ <b>${charName}</b> ke background ko erase karke stage taiyar kiya ja raha hai...`;

            setTimeout(() => {
                // Default cute character image if none uploaded
                let defaultImg = "https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=500&auto=format&fit=crop&q=60"; 

                let audioTagHTML = "";
                let audioName = "Default Studio Track";

                if (songAudioInput.files && songAudioInput.files[0]) {
                    const realAudioUrl = URL.createObjectURL(songAudioInput.files[0]);
                    audioName = songAudioInput.files[0].name;
                    audioTagHTML = `<audio id="playerAudio" controls autoplay src="${realAudioUrl}"></audio>`;
                } else {
                    audioTagHTML = `<p style="font-size:11px; color:#facc15; margin-top:5px;">🎵 Default Voice Track Loaded</p>`;
                }

                let resultHTML = `<h4 style="color:#38bdf8; margin-top:0;">🎉 Background Removed & Stage Ready!</h4>`;
                resultHTML += `<div class="cartoon-video-box">`;
                resultHTML += `<div class="cartoon-badge">✨ CLEAN CUTOUT</div>`;
                resultHTML += `<canvas id="liveDisplayCanvas" width="280" height="360"></canvas>`;
                resultHTML += `<div class="cartoon-footer-text">🗣️ ${charName} Live Performance</div>`;
                resultHTML += `</div>`;
                
                // Live Switcher Box for Running Video/Image changes
                resultHTML += `<div style="margin-top: 12px; font-size: 12px; text-align: left; background: #0f172a; padding: 10px; border-radius: 6px; border: 1px solid #475569;">`;
                resultHTML += `<b style="color:#38bdf8;">⚡ Live Media Changer (Auto-BG Remover):</b><br>`;
                resultHTML += `<label style="margin-top:6px; font-size:11px;">Chalte Video/Photo me Naya Object Dalein:</label>`;
                resultHTML += `<input type="file" id="liveSwapInput" accept="image/*,video/*" onchange="processAndSwapMedia(event)" style="margin-bottom:8px;">`;
                
                // Audio Mute option for uploaded video
                resultHTML += `<div id="videoAudioControls" style="display:none; background:#1e293b; padding:8px; border-radius:5px; margin-bottom:8px;">`;
                resultHTML += `<div style="display:flex; justify-content:space-between; align-items:center;">`;
                resultHTML += `<span><b>🔊 Video Audio:</b></span>`;
                resultHTML += `<button class="rox-btn rox-btn-danger" id="muteToggleBtn" onclick="toggleAddedVideoAudio()">🔇 Mute Sound</button>`;
                resultHTML += `</div>`;
                resultHTML += `</div>`;

                resultHTML += `<b>Character:</b> ${charName}<br>`;
                resultHTML += `<b>Main Audio:</b> ${audioName}<br>`;
                resultHTML += `</div>`;
                
                resultHTML += audioTagHTML;
                resultHTML += `<button class="rox-btn rox-btn-secondary" onclick="downloadVideo()">📥 Export & Download Final Video</button>";

                outputResult.innerHTML = resultHTML;

                // Load initial image and remove background
                const targetFile = (charPhotoInput.files && charPhotoInput.files[0]) ? charPhotoInput.files[0] : null;
                if (targetFile) {
                    processImageFile(targetFile);
                } else {
                    const img = new Image();
                    img.crossOrigin = "anonymous";
                    img.src = defaultImg;
                    img.onload = () => drawImageWithoutBackground(img);
                }

                btn.innerText = "✨ AI Talking Cartoon Video Banayein";
                btn.disabled = false;
            }, 1000);
        }

        // Handle live swapping of image or video
        function processAndSwapMedia(event) {
            const file = event.target.files[0];
            if (!file) return;

            if (renderAnimationId) cancelAnimationFrame(renderAnimationId);

            if (file.type.startsWith('video/')) {
                document.getElementById('videoAudioControls').style.display = "block";
                setupVideoBackgroundRemoval(file);
            } else if (file.type.startsWith('image/')) {
                document.getElementById('videoAudioControls').style.display = "none";
                document.getElementById('hiddenSourceVideo').pause();
                processImageFile(file);
            }
        }

        // Background Removal for Images (Corners/White/Solid colors erase)
        function processImageFile(file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.src = e.target.result;
                img.onload = function() {
                    drawImageWithoutBackground(img);
                    alert("✅ Background successfully remove ho gaya! Sirf ladki screen par dikh rahi hai.");
                }
            }
            reader.readAsDataURL(file);
        }

        function drawImageWithoutBackground(img) {
            const canvas = document.getElementById('liveDisplayCanvas');
            const ctx = canvas.getContext('2d', { willReadFrequently: true });
            
            canvas.width = 280;
            canvas.height = 360;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Draw image scaled to fit nicely
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const data = imageData.data;

            // Detect background color from top-left corner pixel
            const bgR = data[0];
            const bgG = data[1];
            const bgB = data[2];

            for (let i = 0; i < data.length; i += 4) {
                const r = data[i];
                const g = data[i + 1];
                const b = data[i + 2];

                const distance = Math.sqrt((r - bgR)**2 + (g - bgG)**2 + (b - bgB)**2);
                
                // Erase background matching corner color or light white/sky backgrounds
                if (distance < 55 || (r > 235 && g > 235 && b > 235)) {
                    data[i + 3] = 0; // Make transparent
                }
            }
            ctx.putImageData(imageData, 0, 0);
        }

        // Real-time Video Background Removal
        function setupVideoBackgroundRemoval(file) {
            const sourceVideo = document.getElementById('hiddenSourceVideo');
            sourceVideo.src = URL.createObjectURL(file);
            sourceVideo.muted = true;
            sourceVideo.play();

            const canvas = document.getElementById('liveDisplayCanvas');
            const ctx = canvas.getContext('2d', { willReadFrequently: true });

            function renderFrame() {
                if (!sourceVideo.paused && !sourceVideo.ended) {
                    ctx.drawImage(sourceVideo, 0, 0, canvas.width, canvas.height);
                    
                    const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                    const data = imageData.data;
                    const bgR = data[0], bgG = data[1], bgB = data[2];

                    for (let i = 0; i < data.length; i += 4) {
                        const r = data[i], g = data[i + 1], b = data[i + 2];
                        const dist = Math.sqrt((r - bgR)**2 + (g - bgG)**2 + (b - bgB)**2);
                        if (dist < 60 || (r > 240 && g > 240 && b > 240) || (g > 120 && r < 100 && b < 100)) {
                            data[i + 3] = 0;
                        }
                    }
                    ctx.putImageData(imageData, 0, 0);
                }
                renderAnimationId = requestAnimationFrame(renderFrame);
            }

            sourceVideo.onloadedmetadata = function() {
                renderFrame();
                alert("✅ Naya video add ho gaya hai aur piche ka background live remove ho raha hai!");
            };
        }

        // Toggle Audio of added video
        function toggleAddedVideoAudio() {
            const sourceVideo = document.getElementById('hiddenSourceVideo');
            const btn = document.getElementById('muteToggleBtn');

            if (sourceVideo.muted) {
                sourceVideo.muted = false;
                btn.innerText = "🔊 Unmute Sound";
                btn.style.background = "linear-gradient(90deg, #2563eb, #3b82f6)";
            } else {
                sourceVideo.muted = true;
                btn.innerText = "🔇 Mute Sound";
                btn.style.background = "linear-gradient(90deg, #dc2626, #ef4444)";
            }
        }

        function downloadVideo() {
            alert("📥 Background-removed video compile ho raha hai!");
        }
    </script>

</body>
</html>
