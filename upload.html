<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rox Inten Studio - Upload & AI Dance Studio</title>
    <!-- Common external stylesheet link -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="rox-main-container">
        <!-- Header & Status -->
        <div class="rox-header">
            <div class="rox-logo">
                <h1>Rox <span>INTEN STUDIO</span></h1>
            </div>
            <div class="ai-engine-status">⏳ AI Engine: Active</div>
        </div>

        <!-- Navigation Tabs (Linking all your repository files) -->
        <div class="nav-tabs">
            <a href="index.html">Home</a>
            <a href="upload.html" class="active">Upload</a>
            <a href="ai-tools.html">AI Magic</a>
            <a href="explore.html">Explore</a>
            <a href="projects.html">Projects</a>
            <a href="mixing.html">Mixing</a>
            <a href="support.html">Support</a>
            <a href="cutter.html">Cutter</a>
            <a href="setting.html">⚙️ Setting</a>
            <a href="result.html">Result</a>
            <a href="register.html">Register</a>
        </div>

        <!-- Main Studio Upload & Generator Box -->
        <div class="section-box">
            <h3>🎬 Live AI Talking, Singing & Dancing Video Creator</h3>
            
            <label for="charName">1. Character ka Naam:</label>
            <input type="text" id="charName" placeholder="Jaise: Soni, Rahul...">

            <label for="charPhoto">2. Photo Upload Karein (Optional - Khali chhodne par AI 3D Cartoon banayega):</label>
            <input type="file" id="charPhoto" accept="image/*">

            <label for="songAudio">3. Song / Music Upload Karein (Dance & Singing Sync ke liye):</label>
            <input type="file" id="songAudio" accept="audio/*">

            <label for="storyText">4. Gaane ke Bol (Lyrics) ya Story Dialogue:</label>
            <textarea id="storyText" placeholder="Yahan likhein lyrics ya dialogue jo character gate/bolte hue dikhega..."></textarea>

            <button class="rox-btn" id="generateBtn" onclick="runLiveStudio()">✨ Live AI Dance & Song Video Banayein</button>

            <!-- Result Box -->
            <div id="outputResult"></div>
        </div>
    </div>

    <script>
        function runLiveStudio() {
            const charName = document.getElementById('charName').value.trim();
            const storyText = document.getElementById('storyText').value.trim();
            const charPhotoInput = document.getElementById('charPhoto');
            const songAudioInput = document.getElementById('songAudio');
            const outputResult = document.getElementById('outputResult');
            const btn = document.getElementById('generateBtn');

            if (!charName || !storyText) {
                alert('Kripya Character ka naam aur Lyrics/Dialogue zaroor bharein!');
                return;
            }

            btn.innerText = "AI Processing & Syncing...";
            btn.disabled = true;
            outputResult.style.display = "block";
            outputResult.innerHTML = `⏳ AI Neural Engine active hai... <b>${charName}</b> ke liye live dance beats aur audio sync kiya ja raha hai...`;

            setTimeout(() => {
                let finalImgSrc = "";
                if (charPhotoInput.files && charPhotoInput.files[0]) {
                    finalImgSrc = URL.createObjectURL(charPhotoInput.files[0]);
                } else {
                    finalImgSrc = "https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=500&auto=format&fit=crop&q=60"; 
                }

                let audioTagHTML = "";
                let audioName = "Default Rhythmic Beat Track";

                if (songAudioInput.files && songAudioInput.files[0]) {
                    const realAudioUrl = URL.createObjectURL(songAudioInput.files[0]);
                    audioName = songAudioInput.files[0].name;
                    audioTagHTML = `<audio controls autoplay src="${realAudioUrl}"></audio>`;
                } else {
                    audioTagHTML = `<p style="font-size:12px; color:#facc15; margin-top:5px;">🎵 AI Default Music Track Loaded</p>`;
                }

                let resultHTML = `<h4 style="color:#38bdf8; margin-top:0;">🎉 Live AI Singing & Dancing Video Ready!</h4>`;
                resultHTML += `<div class="video-preview-box">`;
                resultHTML += `<div class="overlay-badge">🔴 LIVE AI SYNC</div>`;
                resultHTML += `<img src="${finalImgSrc}" alt="Live AI Dance Avatar">`;
                resultHTML += `<div class="overlay-text">🎶 ${charName} - Singing & Dancing Live</div>`;
                resultHTML += `</div>`;
                
                resultHTML += `<div style="margin-top: 12px; font-size: 13px; text-align: left; background: #1e293b; padding: 10px; border-radius: 6px;">`;
                resultHTML += `<b>Character:</b> ${charName}<br>`;
                resultHTML += `<b>Audio File:</b> ${audioName}<br>`;
                resultHTML += `<b>Active Script:</b> "${storyText}"`;
                resultHTML += `</div>`;
                
                resultHTML += audioTagHTML;

                outputResult.innerHTML = resultHTML;
                btn.innerText = "✨ Live AI Dance & Song Video Banayein";
                btn.disabled = false;
            }, 2000);
        }
    </script>

</body>
</html>
