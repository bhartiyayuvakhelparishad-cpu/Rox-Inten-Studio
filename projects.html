<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rox Advanced Projects</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* Advanced Rox Theme Styles */
        .panel { background: #161625; border: 1px solid #333; border-radius: 15px; padding: 15px; margin-bottom: 15px; }
        .rox-input { background: #0f0f1a; border: 1px solid #444; color: white; padding: 10px; border-radius: 8px; width: 100%; margin-bottom: 8px; box-sizing: border-box; }
        .rox-input-half { width: 48%; display: inline-block; }
        .reel-board { width: 100%; height: 260px; background: #000; border: 2px solid #00e5ff; border-radius: 12px; position: relative; overflow: hidden; background-size: cover; background-position: center; touch-action: none; margin-bottom: 10px; }
        .draggable { position: absolute; cursor: move; color: white; font-size: 22px; font-weight: bold; text-shadow: 0 0 8px #000, 2px 2px 4px #000; padding: 5px; user-select: none; touch-action: none; }
        
        /* Advanced Animations */
        .anim-orbit { animation: orbit 3s linear infinite; }
        .anim-bubble { animation: bubble 2s ease-in-out infinite; }
        .anim-shake-emoji { animation: shake 0.2s infinite; }
        .anim-zoom { animation: zoomFx 1.5s infinite alternate; }

        @keyframes orbit { from { transform: rotate(0deg) translateX(40px) rotate(0deg); } to { transform: rotate(360deg) translateX(40px) rotate(-360deg); } }
        @keyframes bubble { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-25px) scale(1.1); } }
        @keyframes shake { 0% { transform: translate(2px, 2px); } 50% { transform: translate(-2px, -2px); } 100% { transform: translate(2px, 2px); } }
        @keyframes zoomFx { 0% { transform: scale(1); } 100% { transform: scale(1.2); } }
    </style>
</head>
<body>

<div class="mobile-frame">
    <div class="notch"></div>
    <div class="app-content">
        <div class="header">
            <div class="camera-icon-glow">
                <i class="fa-solid fa-camera-retro"></i>
            </div>
            <h1>Rox</h1>
            <h5>PROJECTS STUDIO</h5>
        </div>
        
        <!-- 1. Media & Background Panel -->
        <div class="panel">
            <h4 style="color:#00e5ff; margin-top:0;"><i class="fa-solid fa-image"></i> 1. Background Photo</h4>
            <input type="file" id="bgPhotoInput" class="rox-input" accept="image/*" onchange="loadBgPhoto(this)">
            
            <div id="reelBoard" class="reel-board"></div>
        </div>

        <!-- 2. Advanced Audio Cut & Mixer Panel -->
        <div class="panel">
            <h4 style="color:#00e5ff; margin-top:0;"><i class="fa-solid fa-music"></i> 2. Audio Cut & Mixer</h4>
            
            <label style="color:#aaa; font-size:12px;">Track 1 (File + Cut Sec):</label>
            <input type="file" id="audio1" class="rox-input" accept="audio/*">
            <div>
                <input type="number" id="start1" placeholder="Start (sec)" class="rox-input rox-input-half">
                <input type="number" id="end1" placeholder="End (sec)" class="rox-input rox-input-half">
            </div>

            <label style="color:#aaa; font-size:12px; margin-top:5px; display:block;">Track 2 (File + Cut Sec):</label>
            <input type="file" id="audio2" class="rox-input" accept="audio/*">
            <div>
                <input type="number" id="start2" placeholder="Start (sec)" class="rox-input rox-input-half">
                <input type="number" id="end2" placeholder="End (sec)" class="rox-input rox-input-half">
            </div>

            <button class="neon-btn" onclick="processAndMixAudio()" style="width:100%; margin-top:8px;">🎚️ Cut, Mix & Play Audio</button>
        </div>

        <!-- 3. Lyrics, FX & Speed Panel -->
        <div class="panel">
            <h4 style="color:#00e5ff; margin-top:0;"><i class="fa-solid fa-wand-magic-sparkles"></i> 3. Lyrics & Effects</h4>
            <input type="text" id="txt" placeholder="लिरिक्स यहाँ लिखें..." class="rox-input">
            <button class="dark-btn" onclick="addText()" style="width:100%; margin-bottom:10px;">➕ Add Lyrics Text</button>
            
            <label style="color:#aaa; font-size:12px;">⚡ Effect Speed (Slow to Fast):</label>
            <input type="range" id="animSpeed" min="0.2" max="3" step="0.2" value="1" style="width:100%; margin-bottom:10px;" onchange="updateSpeed()">

            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:8px;">
                <button class="dark-btn" onclick="setFX('anim-orbit')">🌀 Orbit (Round)</button>
                <button class="dark-btn" onclick="setFX('anim-bubble')">🫧 Bubble</button>
                <button class="dark-btn" onclick="setFX('anim-shake-emoji')">🤡 Emoji Shake</button>
                <button class="dark-btn" onclick="setFX('anim-zoom')">🔍 Zoom FX</button>
            </div>

            <button class="dark-btn" onclick="resetAll()" style="background:#ff4757; width:100%; margin-top:10px;">❌ Reset All</button>
        </div>
    </div>
</div>

<script>
    // 1. Background Photo Logic
    function loadBgPhoto(input) {
        if (input.files && input.files[0]) {
            const reader = new FileReader();
            reader.onload = function(e) {
                document.getElementById('reelBoard').style.backgroundImage = `url('${e.target.result}')`;
            }
            reader.readAsDataURL(input.files[0]);
        }
    }

    // 2. Audio Cut & Mix Processing (Web Audio API)
    let audioCtx = null;
    let currentSource1 = null;
    let currentSource2 = null;

    async function processAndMixAudio() {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        // Stop previous audio
        if (currentSource1) try { currentSource1.stop(); } catch(e){}
        if (currentSource2) try { currentSource2.stop(); } catch(e){}

        const file1 = document.getElementById('audio1').files[0];
        const file2 = document.getElementById('audio2').files[0];

        if (!file1 && !file2) return alert("कम से कम एक ऑडियो फ़ाइल चुनें!");

        // Track 1 Play
        if (file1) {
            const buf1 = await file1.arrayBuffer().then(b => audioCtx.decodeAudioData(b));
            const s1 = parseFloat(document.getElementById('start1').value) || 0;
            const e1 = parseFloat(document.getElementById('end1').value) || buf1.duration;
            const duration1 = Math.max(0, e1 - s1);
            
            currentSource1 = audioCtx.createBufferSource();
            currentSource1.buffer = buf1;
            currentSource1.connect(audioCtx.destination);
            currentSource1.start(0, s1, duration1);
        }

        // Track 2 Play (Mix together)
        if (file2) {
            const buf2 = await file2.arrayBuffer().then(b => audioCtx.decodeAudioData(b));
            const s2 = parseFloat(document.getElementById('start2').value) || 0;
            const e2 = parseFloat(document.getElementById('end2').value) || buf2.duration;
            const duration2 = Math.max(0, e2 - s2);
            
            currentSource2 = audioCtx.createBufferSource();
            currentSource2.buffer = buf2;
            currentSource2.connect(audioCtx.destination);
            currentSource2.start(0, s2, duration2);
        }
    }

    // 3. Add Draggable Lyrics Text
    function addText() {
        let text = document.getElementById('txt').value || "Rox Studio";
        const board = document.getElementById('reelBoard');
        const el = document.createElement('div');
        el.className = 'draggable';
        el.innerText = text;
        el.style.left = '30px';
        el.style.top = '30px';
        
        // Touch / Mouse Drag Engine
        el.onpointerdown = (e) => {
            el.setPointerCapture(e.pointerId);
            let shiftX = e.clientX - el.getBoundingClientRect().left;
            let shiftY = e.clientY - el.getBoundingClientRect().top;

            el.onpointermove = (ev) => {
                const boardRect = board.getBoundingClientRect();
                el.style.left = (ev.clientX - boardRect.left - shiftX) + 'px';
                el.style.top = (ev.clientY - boardRect.top - shiftY) + 'px';
            };
            el.onpointerup = () => { el.onpointermove = null; };
        };

        el.ondblclick = () => el.remove();
        board.appendChild(el);
        document.getElementById('txt').value = '';
    }

    // 4. Apply Animation FX & Emoji
    let currentFX = '';
    function setFX(fxClass) {
        currentFX = fxClass;
        document.querySelectorAll('.draggable').forEach(el => {
            // Remove previous anims
            el.classList.remove('anim-orbit', 'anim-bubble', 'anim-shake-emoji', 'anim-zoom');
            el.classList.add(fxClass);
            
            // Emoji Shake Special
            if(fxClass === 'anim-shake-emoji' && !el.innerText.includes('🤡')) {
                el.innerText = '🤡 ' + el.innerText + ' 🤡';
            }
        });
        updateSpeed();
    }

    // 5. Update FX Speed
    function updateSpeed() {
        const speedVal = document.getElementById('animSpeed').value;
        document.querySelectorAll('.draggable').forEach(el => {
            el.style.animationDuration = (2 / speedVal) + 's';
        });
    }

    // 6. Reset All
    function resetAll() {
        if (currentSource1) try { currentSource1.stop(); } catch(e){}
        if (currentSource2) try { currentSource2.stop(); } catch(e){}
        document.getElementById('reelBoard').innerHTML = '';
        document.getElementById('reelBoard').style.backgroundImage = 'none';
        document.getElementById('bgPhotoInput').value = '';
    }
</script>
</body>
</html>
