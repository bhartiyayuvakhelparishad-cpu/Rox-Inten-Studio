<script>
    const canvas = document.getElementById('studioCanvas');
    const ctx = canvas.getContext('2d');

    let bgImage = null;
    let rainActive = false;
    let rainStyle = 'slant'; 
    let drops = [];
    let elements = [];
    let customStickers = [];
    let textElements = [];
    let textDirection = 'up'; 
    let globalSpeedMultiplier = 1.0;

    let waterLevel = 560; 
    let ripples = [];
    let transparentWater = false;
    let solidWater = false;

    let galleryItems = [];
    let activeOverlays = [];
    let draggedOverlay = null;
    let isResizing = false;
    let resizeHandleSize = 20;
    let dragOffsetX = 0;
    let dragOffsetY = 0;

    function loadBgPhoto(event) {
        const file = event.target.files[0];
        if (file) {
            const img = new Image();
            img.onload = function() { bgImage = img; };
            img.src = URL.createObjectURL(file);
        }
    }

    function changeSpeed(val) {
        globalSpeedMultiplier = parseFloat(val);
        document.getElementById('speedVal').innerText = globalSpeedMultiplier.toFixed(1) + 'x';
    }

    function setRainStyle(style) {
        rainStyle = style;
        rainActive = true;
        document.getElementById('btnRainStraight').classList.remove('selected');
        document.getElementById('btnRainSlant').classList.remove('selected');
        document.getElementById('btnRainHeavy').classList.remove('selected');
        
        if(style === 'straight') document.getElementById('btnRainStraight').classList.add('selected');
        if(style === 'slant') document.getElementById('btnRainSlant').classList.add('selected');
        if(style === 'heavy') document.getElementById('btnRainHeavy').classList.add('selected');
        initRainDrops();
    }

    function setTextDirection(dir) {
        textDirection = dir;
        document.getElementById('txtDirUp').classList.remove('selected');
        document.getElementById('txtDirDown').classList.remove('selected');
        if(dir === 'up') document.getElementById('txtDirUp').classList.add('selected');
        if(dir === 'down') document.getElementById('txtDirDown').classList.add('selected');
    }

    function initRainDrops() {
        drops = [];
        let count = (rainStyle === 'heavy') ? 400 : 200;
        let len = (rainStyle === 'heavy') ? 35 : 20;
        for (let i = 0; i < count; i++) {
            drops.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                length: Math.random() * len + 10,
                baseSpeed: Math.random() * 12 + 8
            });
        }
    }

    function toggleTransparentWater() {
        transparentWater = !transparentWater;
        solidWater = false; 
    }

    function toggleSolidWater() {
        solidWater = !solidWater;
        transparentWater = false; 
    }

    function addCustomSticker() {
        const fileInput = document.getElementById('stickerInput');
        const file = fileInput.files[0];
        if (file) {
            const img = new Image();
            img.onload = function() {
                customStickers.push({
                    img: img,
                    x: Math.random() * (canvas.width - 120),
                    y: Math.random() * (waterLevel - 150),
                    w: 90,
                    h: 90,
                    dx: (Math.random() - 0.5) * 4,
                    dy: (Math.random() - 0.5) * 4
                });
            };
            img.src = URL.createObjectURL(file);
        }
    }

    function addToGallery(event) {
        const files = event.target.files;
        for (let i = 0; i < files.length; i++) {
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    galleryItems.push({ id: Date.now() + Math.random(), img: img, active: false });
                    renderGallery();
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(files[i]);
        }
    }

    function renderGallery() {
        const grid = document.getElementById('galleryGrid');
        grid.innerHTML = '';
        galleryItems.forEach((item, index) => {
            const div = document.createElement('div');
            div.style.position = 'relative';
            div.style.border = item.active ? '2px solid #00e5ff' : '1px solid #28283d';
            div.style.borderRadius = '6px';
            div.style.overflow = 'hidden';
            div.style.cursor = 'pointer';
            div.innerHTML = `
                <img src="${item.img.src}" style="width:100%; height:55px; object-fit:cover; display:block;">
                <div style="position:absolute; top:2px; right:2px; background:${item.active ? '#00e5ff' : 'rgba(0,0,0,0.6)'}; color:${item.active ? '#000' : '#fff'}; font-size:10px; padding:1px 4px; border-radius:3px;">${item.active ? 'ON' : 'OFF'}</div>
            `;
            div.onclick = () => toggleGalleryOverlay(index);
            grid.appendChild(div);
        });
    }

    function toggleGalleryOverlay(index) {
        let item = galleryItems[index];
        item.active = !item.active;
        if (item.active) {
            activeOverlays.push({ id: item.id, img: item.img, x: 80, y: 120, w: 140, h: 140 });
        } else {
            activeOverlays = activeOverlays.filter(o => o.id !== item.id);
        }
        renderGallery();
    }

    function getCanvasCoordinates(e) {
        const rect = canvas.getBoundingClientRect();
        const clientX = e.clientX || (e.touches && e.touches[0].clientX);
        const clientY = e.clientY || (e.touches && e.touches[0].clientY);
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;
        return { x: (clientX - rect.left) * scaleX, y: (clientY - rect.top) * scaleY };
    }

    canvas.addEventListener('mousedown', startDrag);
    canvas.addEventListener('touchstart', startDrag, { passive: false });
    canvas.addEventListener('mousemove', dragMove);
    canvas.addEventListener('touchmove', dragMove, { passive: false });
    canvas.addEventListener('mouseup', endDrag);
    canvas.addEventListener('touchend', endDrag);

    function startDrag(e) {
        const coords = getCanvasCoordinates(e);
        for (let i = activeOverlays.length - 1; i >= 0; i--) {
            let ov = activeOverlays[i];
            if (coords.x >= ov.x + ov.w - resizeHandleSize && coords.x <= ov.x + ov.w &&
                coords.y >= ov.y + ov.h - resizeHandleSize && coords.y <= ov.y + ov.h) {
                draggedOverlay = ov;
                isResizing = true;
                if(e.cancelable) e.preventDefault();
                return;
            }
        }
        for (let i = activeOverlays.length - 1; i >= 0; i--) {
            let ov = activeOverlays[i];
            if (coords.x >= ov.x && coords.x <= ov.x + ov.w && coords.y >= ov.y && coords.y <= ov.y + ov.h) {
                draggedOverlay = ov;
                isResizing = false;
                dragOffsetX = coords.x - ov.x;
                dragOffsetY = coords.y - ov.y;
                if(e.cancelable) e.preventDefault();
                break;
            }
        }
    }

    function dragMove(e) {
        if (!draggedOverlay) return;
        const coords = getCanvasCoordinates(e);
        if (isResizing) {
            draggedOverlay.w = Math.max(30, coords.x - draggedOverlay.x);
            draggedOverlay.h = Math.max(30, coords.y - draggedOverlay.y);
        } else {
            draggedOverlay.x = coords.x - dragOffsetX;
            draggedOverlay.y = coords.y - dragOffsetY;
        }
        if(e.cancelable) e.preventDefault();
    }

    function endDrag() {
        draggedOverlay = null;
        isResizing = false;
    }

    function addText() {
        const txtInput = document.getElementById('txt');
        let rawText = txtInput.value.trim();
        if (!rawText) rawText = "Rox Studio";

        let lines = rawText.split('\n').filter(line => line.trim() !== "");
        let spacing = 50;

        lines.forEach((lineText, index) => {
            let initialY = (textDirection === 'up') ? (750 + (index * spacing)) : (-50 - (index * spacing));
            textElements.push({
                text: lineText,
                x: canvas.width / 2,
                y: initialY,
                direction: textDirection
            });
        });

        txtInput.value = "";
    }

    function addBird() {
        elements.push({ type: 'bird', text: '🕊️', x: -50, y: 100 + Math.random() * 200, baseSpeed: 2, size: 30 });
    }

    function addFlower(color) {
        elements.push({ type: 'flower', color: color, x: Math.random() * (canvas.width - 40), y: -40, baseSpeed: 2.5, size: 28 });
    }

    function drawPondAndWaterEffects(x, y, w, h) {
        if (!transparentWater && !solidWater) return;
        ctx.save();
        let pY = y + h - 140; 
        if (transparentWater) {
            ctx.fillStyle = "rgba(0, 150, 255, 0.3)"; 
        } else if (solidWater) {
            ctx.fillStyle = "rgba(0, 80, 180, 1.0)";  
        }
        ctx.fillRect(x, pY, w, (y + h) - pY);
        ctx.strokeStyle = "rgba(0, 229, 255, 0.6)";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(x, pY);
        ctx.lineTo(x + w, pY);
        ctx.stroke();

        ctx.strokeStyle = "rgba(255, 255, 255, 0.5)";
        ctx.lineWidth = 1.2;
        ripples.forEach((r, index) => {
            ctx.beginPath();
            ctx.ellipse(r.x, r.y, r.radius, r.radius * 0.4, 0, 0, Math.PI * 2);
            ctx.stroke();
            r.radius += 0.8 * globalSpeedMultiplier;
            if (r.radius > 35) ripples.splice(index, 1);
        });

        if (Math.random() > 0.90) {
            ripples.push({ x: x + Math.random() * w, y: pY + Math.random() * 40, radius: 2 });
        }
        ctx.restore();
    }

    function renderLoop() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        let w = canvas.width;
        let h = canvas.height;
        let x = 0;
        let y = 0;

        if (bgImage) {
            const hRatio = canvas.width / bgImage.width;
            const vRatio = canvas.height / bgImage.height;
            const ratio = Math.min(hRatio, vRatio);
            w = bgImage.width * ratio;
            h = bgImage.height * ratio;
            x = (canvas.width - w) / 2;
            y = (canvas.height - h) / 2;
            ctx.drawImage(bgImage, 0, 0, bgImage.width, bgImage.height, x, y, w, h);
        } else {
            ctx.fillStyle = '#111';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        ctx.save();
        ctx.beginPath();
        ctx.rect(x, y, w, h);
        ctx.clip();

        activeOverlays.forEach(ov => {
            ctx.drawImage(ov.img, ov.x, ov.y, ov.w, ov.h);
            ctx.strokeStyle = "#00e5ff";
            ctx.lineWidth = 1.5;
            ctx.strokeRect(ov.x, ov.y, ov.w, ov.h);
            ctx.fillStyle = "#ff007f";
            ctx.fillRect(ov.x + ov.w - resizeHandleSize, ov.y + ov.h - resizeHandleSize, resizeHandleSize, resizeHandleSize);
        });

        customStickers.forEach(stk => {
            stk.x += stk.dx * globalSpeedMultiplier;
            stk.y += stk.dy * globalSpeedMultiplier;
            if (stk.x <= x || stk.x + stk.w >= x + w) stk.dx *= -1;
            if (stk.y <= y || stk.y + stk.h >= y + h) stk.dy *= -1;
            ctx.drawImage(stk.img, stk.x, stk.y, stk.w, stk.h);
        });

        if (rainActive) {
            if (drops.length === 0) initRainDrops();
            ctx.strokeStyle = (rainStyle === 'heavy') ? 'rgba(230, 230, 255, 0.7)' : 'rgba(200, 200, 255, 0.45)';
            ctx.lineWidth = (rainStyle === 'heavy') ? 1.8 : 1.1;
            ctx.beginPath();
            drops.forEach(drop => {
                let xOffset = (rainStyle === 'slant' || rainStyle === 'heavy') ? 5 : 0;
                ctx.moveTo(drop.x, drop.y);
                ctx.lineTo(drop.x + xOffset, drop.y + drop.length);
                let fallMultiplier = (rainStyle === 'heavy') ? 2.5 : 1.5;
                drop.y += drop.baseSpeed * globalSpeedMultiplier * fallMultiplier;
                if (xOffset > 0) drop.x += 1.5 * globalSpeedMultiplier;
                if (drop.y > y + h) {
                    drop.y = y;
                    drop.x = x + Math.random() * w;
                }
            });
            ctx.stroke();
        }

        elements.forEach(el => {
            let currentSpeed = el.baseSpeed * globalSpeedMultiplier;
            if (el.type === 'bird') {
                ctx.font = `${el.size}px sans-serif`;
                ctx.fillText(el.text, el.x, el.y);
                el.x += currentSpeed;
                if (el.x > x + w + 40) el.x = x - 40;
            } else if (el.type === 'flower') {
                ctx.save();
                ctx.font = `${el.size}px sans-serif`;
                ctx.shadowBlur = 6;
                if (el.color === 'blue') ctx.shadowColor = '#00e5ff';
                else if (el.color === 'pink') ctx.shadowColor = '#ff007f';
                else if (el.color === 'red') ctx.shadowColor = '#ff4757';
                else if (el.color === 'yellow') ctx.shadowColor = '#ffa502';

                let flowerEmoji = (el.color === 'blue') ? '🔷' : (el.color === 'pink') ? '🌸' : (el.color === 'red') ? '🌺' : '🌼';
                ctx.fillText(flowerEmoji, el.x, el.y);
                ctx.restore();

                el.y += currentSpeed;
                if (el.y > y + h + 40) {
                    el.y = y - 40;
                    el.x = x + Math.random() * (w - 40);
                }
            }
        });

        textElements.forEach(tEl => {
            if (tEl.direction === 'up') {
                tEl.y -= 1.8 * globalSpeedMultiplier;
                if (tEl.y < -50) tEl.y = 750 + Math.random() * 50; 
            } else {
                tEl.y += 1.8 * globalSpeedMultiplier;
                if (tEl.y > 750) tEl.y = -50 - Math.random() * 50; 
            }

            ctx.font = 'bold 22px Segoe UI';
            ctx.fillStyle = '#ffffff';
            ctx.textAlign = 'center';
            ctx.shadowColor = '#000';
            ctx.shadowBlur = 10;
            ctx.fillText(tEl.text, tEl.x, tEl.y);
            ctx.shadowBlur = 0;
        });

        drawPondAndWaterEffects(x, y, w, h);
        ctx.restore();
        requestAnimationFrame(renderLoop);
    }
    renderLoop();

    let audioCtx = null;
    let audioDestinationNode = null;
    let currentSource1 = null;
    let currentSource2 = null;
    let isPlaying = false;
    let mediaRecorder = null;
    let isRecording = false;

    function initAudioContext() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            audioDestinationNode = audioCtx.createMediaStreamDestination();
        }
        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
    }

    async function togglePlayAll() {
        const btn = document.getElementById('btnPlay');
        if (isPlaying) {
            stopAudio();
            btn.innerText = "⚡ Play Project";
            btn.style.background = "linear-gradient(90deg, #ff007f, #b500ff)";
            isPlaying = false;
        } else {
            initAudioContext();
            btn.innerText = "⏹️ Stop Playback";
            btn.style.background = "#ff4757";
            isPlaying = true;

            const file1 = document.getElementById('audio1').files[0];
            if (file1) {
                try {
                    let start1 = parseFloat(document.getElementById('audio1Start').value) || 0;
                    let end1Input = document.getElementById('audio1End').value;
                    let buf1 = await file1.arrayBuffer().then(b => audioCtx.decodeAudioData(b));
                    
                    currentSource1 = audioCtx.createBufferSource();
                    currentSource1.buffer = buf1;
                    currentSource1.connect(audioCtx.destination);
                    currentSource1.connect(audioDestinationNode);
                    
                    let duration1 = end1Input ? Math.max(0.1, parseFloat(end1Input) - start1) : Math.max(0.1, buf1.duration - start1);
                    currentSource1.start(0, start1, duration1);
                } catch(err) { console.error("Audio 1 playback issue:", err); }
            }

            const file2 = document.getElementById('audio2').files[0];
            if (file2) {
                try {
                    let start2 = parseFloat(document.getElementById('audio2Start').value) || 0;
                    let end2Input = document.getElementById('audio2End').value;
                    let buf2 = await file2.arrayBuffer().then(b => audioCtx.decodeAudioData(b));
                    
                    currentSource2 = audioCtx.createBufferSource();
                    currentSource2.buffer = buf2;
                    currentSource2.connect(audioCtx.destination);
                    currentSource2.connect(audioDestinationNode);
                    
                    let duration2 = end2Input ? Math.max(0.1, parseFloat(end2Input) - start2) : Math.max(0.1, buf2.duration - start2);
                    currentSource2.start(0, start2, duration2);
                } catch(err) { console.error("Audio 2 playback issue:", err); }
            }
        }
    }

    function stopAudio() {
        if (currentSource1) { try { currentSource1.stop(); } catch(e){} currentSource1 = null; }
        if (currentSource2) { try { currentSource2.stop(); } catch(e){} currentSource2 = null; }
    }

    async function toggleRecordCanvasMP4() {
        const btn = document.getElementById('btnDownload');
        if (isRecording) {
            if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                mediaRecorder.stop();
            }
            stopAudio();
            isPlaying = false;
            document.getElementById('btnPlay').innerText = "⚡ Play Project";
            document.getElementById('btnPlay').style.background = "linear-gradient(90deg, #ff007f, #b500ff)";
            btn.innerHTML = '<i class="fa-solid fa-video"></i> 🎬 Record & Download MP4 (With Sound + FX)';
            btn.style.background = "linear-gradient(90deg, #00c853, #00e5ff)";
            isRecording = false;
        } else {
            initAudioContext();
            if (!isPlaying) {
                await togglePlayAll();
            }

            const canvasStream = canvas.captureStream(30);
            let streamTracks = [...canvasStream.getVideoTracks()];

            const hasAudio = document.getElementById('audio1').files[0] || document.getElementById('audio2').files[0];
            if (hasAudio && audioDestinationNode) {
                streamTracks.push(...audioDestinationNode.stream.getAudioTracks());
            }

            const combinedStream = new MediaStream(streamTracks);

            let options = {};
            let ext = 'webm';
            if (MediaRecorder.isTypeSupported('video/mp4;codecs=avc1')) {
                options = { mimeType: 'video/mp4;codecs=avc1' };
                ext = 'mp4';
            } else if (MediaRecorder.isTypeSupported('video/mp4')) {
                options = { mimeType: 'video/mp4' };
                ext = 'mp4';
            } else if (MediaRecorder.isTypeSupported('video/webm;codecs=vp9,opus')) {
                options = { mimeType: 'video/webm;codecs=vp9,opus' };
            } else if (MediaRecorder.isTypeSupported('video/webm')) {
                options = { mimeType: 'video/webm' };
            }

            try {
                mediaRecorder = new MediaRecorder(combinedStream, options);
            } catch (e) {
                mediaRecorder = new MediaRecorder(combinedStream);
            }

            let chunks = [];
            mediaRecorder.ondataavailable = (e) => {
                if (e.data && e.data.size > 0) chunks.push(e.data);
            };

            mediaRecorder.onstop = () => {
                const blob = new Blob(chunks, { type: mediaRecorder.mimeType || 'video/mp4' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `Rox_Studio_Video_${Date.now()}.${ext}`;
                document.body.appendChild(a);
                a.click();
                setTimeout(() => {
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);
                }, 100);
            };

            mediaRecorder.start(1000); // 1 सेकंड के चंक्स में स्ट्रीम कलेक्ट करेगा
            isRecording = true;
            btn.innerHTML = "🛑 Recording... Click to Stop & Save Video";
            btn.style.background = "#ff4757";
        }
    }

    function resetAll() {
        stopAudio();
        isPlaying = false;
        if (isRecording) toggleRecordCanvasMP4();
        rainActive = false;
        transparentWater = false;
        solidWater = false;
        drops = [];
        elements = [];
        customStickers = [];
        textElements = [];
        galleryItems = [];
        activeOverlays = [];
        bgImage = null;
        globalSpeedMultiplier = 1.0;
        document.getElementById('speedRange').value = 1.0;
        document.getElementById('speedVal').innerText = "1.0x";
        document.getElementById('bgPhotoInput').value = '';
        document.getElementById('stickerInput').value = '';
        document.getElementById('galleryInput').value = '';
        document.getElementById('galleryGrid').innerHTML = '';
        document.getElementById('txt').value = '';
        document.getElementById('audio1').value = '';
        document.getElementById('audio1Start').value = '0';
        document.getElementById('audio1End').value = '';
        document.getElementById('audio2').value = '';
        document.getElementById('audio2Start').value = '0';
        document.getElementById('audio2End').value = '';
    }
</script>
