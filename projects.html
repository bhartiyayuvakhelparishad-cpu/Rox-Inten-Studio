<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rox Advanced Projects</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Advanced Rox Theme Styles */
        .panel { background: #161625; border: 1px solid #333; border-radius: 15px; padding: 15px; margin-bottom: 15px; }
        .rox-input { background: #0f0f1a; border: 1px solid #444; color: white; padding: 10px; border-radius: 8px; width: 100%; margin-bottom: 5px; }
        .reel-board { width: 100%; height: 250px; background: #000; border: 2px solid #333; position: relative; overflow: hidden; }
        
        /* New Animations */
        .anim-orbit { animation: orbit 3s linear infinite; }
        .anim-bubble { animation: bubble 2s ease-in-out infinite; }
        .anim-shake-emoji { animation: shake 0.2s infinite; }
        @keyframes orbit { from { transform: rotate(0deg) translateX(50px) rotate(0deg); } to { transform: rotate(360deg) translateX(50px) rotate(-360deg); } }
        @keyframes bubble { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-20px) scale(1.1); } }
        @keyframes shake { 0% { transform: translate(1px, 1px); } 50% { transform: translate(-1px, -2px); } 100% { transform: translate(1px, 1px); } }
    </style>
</head>
<body>

<div class="mobile-frame">
    <div class="app-content">
        <h2>Rox Advanced Editor</h2>
        
        <!-- Audio Mixer Panel -->
        <div class="panel">
            <h4 style="color:#00e5ff;">🎵 Audio Mixer</h4>
            <input type="file" id="audio1" class="rox-input" accept="audio/*">
            <input type="number" id="start1" placeholder="Start Time (sec)" class="rox-input">
            <input type="file" id="audio2" class="rox-input" accept="audio/*">
            <input type="number" id="start2" placeholder="Start Time (sec)" class="rox-input">
            <button class="neon-btn" onclick="mixAudio()" style="width:100%">🎚️ Mix & Play</button>
        </div>

        <div id="reelBoard" class="reel-board"></div>

        <!-- Effect Panel -->
        <div class="panel">
            <input type="text" id="txt" placeholder="Lyrics here..." class="rox-input">
            <button class="dark-btn" onclick="addText()">➕ Add</button>
            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:5px; margin-top:10px;">
                <button class="dark-btn" onclick="setFX('anim-orbit')">🌀 Orbit</button>
                <button class="dark-btn" onclick="setFX('anim-bubble')">🫧 Bubble</button>
                <button class="dark-btn" onclick="setFX('anim-shake-emoji')">🤡 Emoji Shake</button>
                <button class="dark-btn" onclick="resetAll()" style="background:red">❌ Reset</button>
            </div>
        </div>
    </div>
</div>

<script>
    // Audio Mixing Logic
    function mixAudio() {
        const audioContext = new (window.AudioContext || window.webkitAudioContext)();
        
        async function playTrack(fileInput, startTime) {
            if(!fileInput.files[0]) return;
            const arrayBuffer = await fileInput.files[0].arrayBuffer();
            const audioBuffer = await audioContext.decodeAudioData(arrayBuffer);
            const source = audioContext.createBufferSource();
            source.buffer = audioBuffer;
            source.connect(audioContext.destination);
            source.start(0, startTime);
        }

        playTrack(document.getElementById('audio1'), document.getElementById('start1').value || 0);
        playTrack(document.getElementById('audio2'), document.getElementById('start2').value || 0);
    }

    // Add Text with Emoji option
    function addText() {
        let text = document.getElementById('txt').value;
        const board = document.getElementById('reelBoard');
        const el = document.createElement('div');
        el.className = 'draggable';
        el.style.position = 'absolute';
        el.style.color = 'white';
        el.style.fontSize = '20px';
        el.innerText = text;
        
        // Drag logic
        el.onpointerdown = (e) => {
            el.setPointerCapture(e.pointerId);
            el.onpointermove = (ev) => {
                el.style.left = ev.clientX - 50 + 'px';
                el.style.top = ev.clientY - 150 + 'px';
            };
        };
        board.appendChild(el);
    }

    // Apply Effects
    function setFX(fxClass) {
        document.querySelectorAll('.draggable').forEach(el => {
            el.className = 'draggable ' + fxClass;
            // Emoji Shake Special
            if(fxClass === 'anim-shake-emoji') {
                el.innerText = '🤡 ' + el.innerText + ' 🤡';
            }
        });
    }

    function resetAll() {
        document.getElementById('reelBoard').innerHTML = '';
        location.reload();
    }
</script>
</body>
</html>
