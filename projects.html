<!-- 🎬 Projects Tab Panel Start (Rox Theme) -->
<style>
    .rox-panel { background: #1c1c2e; border: 1px solid #333; border-radius: 12px; padding: 15px; margin-bottom: 20px; }
    .rox-panel h3 { color: #00e5ff; font-size: 16px; margin-bottom: 15px; display: flex; align-items: center; gap: 8px; }
    .btn-rox { background: linear-gradient(90deg, #7928ca, #ff007f); color: white; border: none; padding: 12px; border-radius: 8px; width: 100%; font-weight: bold; cursor: pointer; margin-top: 10px; }
    .rox-input { background: #121220; border: 1px solid #333; color: #fff; padding: 10px; border-radius: 6px; width: 100%; margin-bottom: 10px; display: block; }
    .reel-board { background: #000; border: 2px solid #333; border-radius: 10px; height: 300px; position: relative; overflow: hidden; margin-bottom: 10px; background-size: cover; background-position: center; }
    .cutout-item { position: absolute; cursor: move; touch-action: none; user-select: none; color: #fff; font-size: 20px; padding: 5px; }
    
    /* Animations */
    .shake { animation: shakeFx 0.5s infinite alternate; }
    .zoom { animation: zoomFx 1.5s infinite alternate; }
    .pulse { animation: pulseFx 0.6s infinite alternate; }
    @keyframes shakeFx { 0% { transform: translate(1px, 1px); } 100% { transform: translate(-2px, -2px); } }
    @keyframes zoomFx { 0% { transform: scale(1); } 100% { transform: scale(1.1); } }
    @keyframes pulseFx { 0% { transform: scale(0.9); } 100% { transform: scale(1.05); } }
</style>

<div id="projectsTab" class="page-content">

    <!-- 1. Music Panel -->
    <div class="rox-panel">
        <h3>🎵 Music & Settings</h3>
        <input type="file" id="projMusic" class="rox-input" accept="audio/*">
        <audio id="projAudio" loop></audio>
        <span id="musicName" style="color:#aaa; font-size:12px;">कोई गाना सेलेक्ट नहीं है</span>
    </div>

    <!-- 2. Preview Panel -->
    <div class="rox-panel">
        <h3>🎬 Reel Preview</h3>
        <div id="reelBoard" class="reel-board"></div>
        <div style="display:grid; grid-template-columns: 1fr 1fr; gap: 10px;">
            <button onclick="saveReelFrame()" class="btn-rox" style="background:#00c853;">➕ Frame सेव करें</button>
            <button onclick="playReelStatus()" id="btnPlayReel" class="btn-rox" style="background:#00e5ff; color:#000;">▶️ Play Reel</button>
        </div>
    </div>

    <!-- 3. Editor Panel -->
    <div class="rox-panel">
        <h3>✨ Lyrics & FX</h3>
        <input type="text" id="reelLyrics" class="rox-input" placeholder="यहाँ गाने के बोल लिखें...">
        <button onclick="addLyricsToReel()" class="btn-rox">➕ लिरिक्स जोड़ें</button>
        
        <div style="margin-top:15px; display:flex; flex-wrap:wrap; gap:5px;">
            <button onclick="applyReelFX('shake')" class="btn-rox" style="width:auto; padding:5px 10px;">🫨 Shake</button>
            <button onclick="applyReelFX('zoom')" class="btn-rox" style="width:auto; padding:5px 10px;">🔍 Zoom</button>
            <button onclick="applyReelFX('pulse')" class="btn-rox" style="width:auto; padding:5px 10px;">💓 Pulse</button>
            <button onclick="clearReelFX()" class="btn-rox" style="background:#ff1744; width:auto; padding:5px 10px;">❌ Reset FX</button>
        </div>
    </div>
</div>

<script>
    const projMusic = document.getElementById('projMusic');
    const projAudio = document.getElementById('projAudio');
    const reelBoard = document.getElementById('reelBoard');
    let reelFrames = [];
    let reelTimer = null;

    // गाना लोड
    projMusic.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (file) {
            projAudio.src = URL.createObjectURL(file);
            document.getElementById('musicName').innerText = "🎵 " + file.name;
        }
    });

    // लिरिक्स जोड़ना
    function addLyricsToReel() {
        const text = document.getElementById('reelLyrics').value;
        if (!text) return alert("पहले कुछ लिखें!");
        const div = document.createElement('div');
        div.className = 'cutout-item';
        div.innerText = text;
        div.style.left = '50px'; div.style.top = '100px';
        div.ondblclick = () => div.remove();
        reelBoard.appendChild(div);
        makeElementDraggable(div);
        document.getElementById('reelLyrics').value = '';
    }

    // FX अप्लाई
    function applyReelFX(cls) {
        reelBoard.querySelectorAll('.cutout-item').forEach(el => {
            el.className = 'cutout-item ' + cls;
        });
    }

    function clearReelFX() {
        reelBoard.querySelectorAll('.cutout-item').forEach(el => el.className = 'cutout-item');
    }

    // ड्रैग लॉजिक
    function makeElementDraggable(el) {
        let x = 0, y = 0;
        el.onmousedown = (e) => {
            let shiftX = e.clientX - el.getBoundingClientRect().left;
            let shiftY = e.clientY - el.getBoundingClientRect().top;
            document.onmousemove = (e) => {
                el.style.left = e.clientX - shiftX + 'px';
                el.style.top = e.clientY - shiftY + 'px';
            };
            document.onmouseup = () => document.onmousemove = null;
        };
    }

    // फ्रेम सेव
    function saveReelFrame() {
        const items = [];
        reelBoard.querySelectorAll('.cutout-item').forEach(item => {
            items.push({ text: item.innerText, left: item.style.left, top: item.style.top, cls: item.className });
        });
        if(items.length > 0) reelFrames.push(items);
        alert("Frame " + reelFrames.length + " Saved!");
    }

    // प्ले रील
    function playReelStatus() {
        if(reelFrames.length === 0) return alert("पहले Frame Save करें!");
        if(reelTimer) { clearInterval(reelTimer); reelTimer=null; projAudio.pause(); return; }
        
        projAudio.play();
        let idx = 0;
        reelTimer = setInterval(() => {
            reelBoard.innerHTML = '';
            reelFrames[idx].forEach(data => {
                const el = document.createElement('div');
                el.className = data.cls;
                el.innerText = data.text;
                el.style.left = data.left; el.style.top = data.top;
                reelBoard.appendChild(el);
            });
            idx = (idx + 1) % reelFrames.length;
        }, 500);
    }
</script>
<!-- 🎬 Projects Tab Panel End -->
