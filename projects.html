<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rox Photo Studio - Hand Touch Optimized</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; }
        body { background: #0f0f1a; color: #fff; display: flex; flex-direction: column; min-height: 100vh; touch-action: manipulation; }

        .navbar { background: #18182b; padding: 12px 20px; border-bottom: 2px solid #282845; display: flex; justify-content: space-between; align-items: center; }
        .navbar h1 { font-size: 18px; color: #00e5ff; }

        .app-container { display: flex; flex-direction: column; gap: 15px; padding: 15px; max-width: 1200px; margin: 0 auto; width: 100%; }
        .work-area { display: flex; flex-wrap: wrap; gap: 15px; justify-content: center; }
        
        .panel { background: #1a1a2e; border: 1px solid #2e2e50; border-radius: 10px; padding: 12px; flex: 1; min-width: 320px; max-width: 550px; }
        .panel h3 { font-size: 14px; color: #00e5ff; margin-bottom: 10px; border-bottom: 1px solid #333; padding-bottom: 5px; }

        /* टच स्क्रॉल रोकने के लिए touch-action: none */
        .editor-box { position: relative; width: 100%; aspect-ratio: 4/3; background: #000; border: 1px dashed #444; border-radius: 8px; overflow: auto; display: block; touch-action: none; }
        canvas { width: 100%; height: 100%; object-fit: contain; touch-action: none; transform-origin: top left; }

        .tools { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
        .zoom-tools { display: flex; align-items: center; gap: 5px; background: #121220; padding: 5px 10px; border-radius: 6px; border: 1px solid #282845; width: 100%; }
        button, label.btn-upload { background: #252545; color: #fff; border: 1px solid #3d3d66; padding: 10px 14px; border-radius: 6px; font-size: 13px; cursor: pointer; transition: 0.2s; -webkit-tap-highlight-color: transparent; }
        button:hover, label.btn-upload:hover { background: #00e5ff; color: #000; font-weight: bold; }
        button.active { background: #00e5ff; color: #000; font-weight: bold; }

        .drop-zone { position: relative; width: 100%; aspect-ratio: 4/3; background: #111122; border: 2px dashed #00e5ff; border-radius: 8px; overflow: hidden; touch-action: none; }

        .cutout-item { position: absolute; cursor: move; border: 1px dashed transparent; user-select: none; touch-action: none; }
        .cutout-item:hover { border-color: #00e5ff; }
        .cutout-item img { width: 100%; height: 100%; pointer-events: none; }

        .cutout-gallery { display: flex; gap: 10px; overflow-x: auto; padding: 8px; background: #121220; border-radius: 8px; margin-top: 10px; min-height: 80px; align-items: center; }
        .cutout-thumb { width: 60px; height: 60px; border: 1px solid #00e5ff; border-radius: 6px; cursor: pointer; object-fit: contain; background: #000; flex-shrink: 0; }

        .frame-strip { display: flex; gap: 8px; overflow-x: auto; padding: 6px; background: #090910; border-radius: 6px; margin-top: 8px; min-height: 60px; align-items: center; }
        .frame-thumb { width: 50px; height: 40px; background: #222; border: 1px solid #ff007f; border-radius: 4px; font-size: 10px; display: flex; align-items: center; justify-content: center; color: #fff; cursor: pointer; }

        #toastMsg { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #00e5ff; color: #000; padding: 8px 16px; border-radius: 20px; font-weight: bold; font-size: 12px; display: none; z-index: 1000; }
    </style>
</head>
<body>

    <div class="navbar">
        <h1>✂️ Rox Studio Pro - Touch & Finger Cutout</h1>
    </div>

    <div id="toastMsg"></div>

    <div class="app-container">
        <div class="work-area">
            
            <div class="panel">
                <h3>1. फोटो कटिंग टूल (उंगली से काटें)</h3>
                <div class="editor-box">
                    <canvas id="mainCanvas"></canvas>
                </div>

                <div class="tools">
                    <div class="zoom-tools">
                        <span style="font-size:11px; color:#00e5ff;">🔍 ज़ूम:</span>
                        <button onclick="setZoom(1)" class="btn-zoom active" id="z1">1x</button>
                        <button onclick="setZoom(1.5)" class="btn-zoom" id="z15">1.5x</button>
                        <button onclick="setZoom(2)" class="btn-zoom" id="z2">2x</button>
                        <button onclick="setZoom(3)" class="btn-zoom" id="z3">3x</button>
                    </div>

                    <label class="btn-upload">📁 अपलोड <input type="file" id="imgUpload" accept="image/*" style="display:none;"></label>
                    <button id="btnPencil" class="active" onclick="setMode('pencil')">✏️ पेंसिल कट</button>
                    <button id="btnMagic" onclick="setMode('magic')">🪄 मैजिक वैंड</button>
                    <button onclick="cutSelectedArea()" style="background:#00c853; color:#000; font-weight:bold;">✂️ कट करें</button>
                    <button onclick="resetCanvas()" style="background:#ff1744;">🔄 रीसेट</button>
                </div>
            </div>

            <div class="panel">
                <h3>2. एनीमेशन एवं ड्रैग-ड्रॉप बोर्ड</h3>
                <div class="drop-zone" id="dropZone"></div>

                <div class="frame-strip" id="frameStrip">
                    <span style="font-size:10px; color:#aaa;">फ्रेम टाइमलाइन: </span>
                </div>

                <div class="tools">
                    <button onclick="addAnimationFrame()" style="background:#ff007f; color:#fff; font-weight:bold;">➕ नया फ्रेम</button>
                    <button onclick="playGIFAnimation()" id="btnPlay" style="background:#00e5ff; color:#000; font-weight:bold;">▶️ एनीमेशन चलाएं</button>
                    <button onclick="clearCollage()" style="background:#333;">🗑️ साफ़ करें</button>
                </div>
            </div>

        </div>

        <div class="panel" style="max-width: 100%;">
            <h3>📦 कटे हुए टुकड़ों की गैलरी</h3>
            <div class="cutout-gallery" id="cutoutGallery">
                <span style="font-size:12px; color:#666;">अभी कोई कटआउट नहीं है।</span>
            </div>
        </div>
    </div>

    <script>
        const imgUpload = document.getElementById('imgUpload');
        const mainCanvas = document.getElementById('mainCanvas');
        const ctx = mainCanvas.getContext('2d');
        const dropZone = document.getElementById('dropZone');
        const cutoutGallery = document.getElementById('cutoutGallery');
        const frameStrip = document.getElementById('frameStrip');

        let currentImg = null;
        let mode = 'pencil';
        let points = [];
        let isDrawing = false;
        let animationFrames = [];
        let animTimer = null;
        let currentZoom = 1;

        function showToast(msg) {
            const toast = document.getElementById('toastMsg');
            toast.innerText = msg;
            toast.style.display = 'block';
            setTimeout(() => { toast.style.display = 'none'; }, 2000);
        }

        function setZoom(zoomValue) {
            currentZoom = zoomValue;
            mainCanvas.style.transform = `scale(${currentZoom})`;

            document.querySelectorAll('.btn-zoom').forEach(b => b.classList.remove('active'));
            if(zoomValue === 1) document.getElementById('z1').classList.add('active');
            if(zoomValue === 1.5) document.getElementById('z15').classList.add('active');
            if(zoomValue === 2) document.getElementById('z2').classList.add('active');
            if(zoomValue === 3) document.getElementById('z3').classList.add('active');
        }

        imgUpload.addEventListener('change', (e) => {
            if (e.target.files[0]) {
                const reader = new FileReader();
                reader.onload = (event) => {
                    currentImg = new Image();
                    currentImg.onload = () => {
                        mainCanvas.width = currentImg.width;
                        mainCanvas.height = currentImg.height;
                        setZoom(1);
                        resetCanvas();
                        showToast("फोटो अपलोड हो गई!");
                    };
                    currentImg.src = event.target.result;
                };
                reader.readAsDataURL(e.target.files[0]);
            }
        });

        function resetCanvas() {
            if (!currentImg) return;
            ctx.clearRect(0, 0, mainCanvas.width, mainCanvas.height);
            ctx.drawImage(currentImg, 0, 0);
            points = [];
        }

        function setMode(newMode) {
            mode = newMode;
            document.getElementById('btnPencil').classList.toggle('active', mode === 'pencil');
            document.getElementById('btnMagic').classList.toggle('active', mode === 'magic');
        }

        // --- उंगली (Hand/Touch) के लिए सटीक कोऑर्डिनेट्स ---
        function getCanvasCoords(e) {
            const rect = mainCanvas.getBoundingClientRect();
            let clientX = e.clientX;
            let clientY = e.clientY;

            // अगर हाथ/उंगली से टच किया गया है:
            if (e.touches && e.touches.length > 0) {
                clientX = e.touches[0].clientX;
                clientY = e.touches[0].clientY;
            } else if (e.changedTouches && e.changedTouches.length > 0) {
                clientX = e.changedTouches[0].clientX;
                clientY = e.changedTouches[0].clientY;
            }
            
            return {
                x: (clientX - rect.left) * (mainCanvas.width / rect.width),
                y: (clientY - rect.top) * (mainCanvas.height / rect.height)
            };
        }

        function startDrawing(e) {
            if (e.cancelable) e.preventDefault(); // उंगली लगाने पर पेज स्क्रॉल होने से रोकेगा
            if (!currentImg) return showToast("पहले फोटो अपलोड करें!");
            
            isDrawing = true;
            const coords = getCanvasCoords(e);
            
            if (mode === 'pencil') {
                points.push(coords);
                drawPath();
            } else if (mode === 'magic') {
                magicWandCut(Math.floor(coords.x), Math.floor(coords.y));
            }
        }

        function drawMove(e) {
            if (!isDrawing || mode !== 'pencil') return;
            if (e.cancelable) e.preventDefault(); // उंगली घुमाते समय स्क्रीन रुक कर केवल ड्रॉ होगी
            
            points.push(getCanvasCoords(e));
            drawPath();
        }

        function stopDrawing(e) { 
            isDrawing = false; 
        }

        // माउस इवेंट्स
        mainCanvas.addEventListener('mousedown', startDrawing);
        mainCanvas.addEventListener('mousemove', drawMove);
        window.addEventListener('mouseup', stopDrawing);

        // हाथ/उंगली (Touch) इवेंट्स
        mainCanvas.addEventListener('touchstart', startDrawing, { passive: false });
        mainCanvas.addEventListener('touchmove', drawMove, { passive: false });
        window.addEventListener('touchend', stopDrawing);

        function drawPath() {
            ctx.clearRect(0, 0, mainCanvas.width, mainCanvas.height);
            ctx.drawImage(currentImg, 0, 0);

            if (points.length < 2) return;
            ctx.beginPath();
            ctx.strokeStyle = '#00e5ff';
            ctx.lineWidth = Math.max(4, mainCanvas.width / 150); // उंगली से साफ़ दिखने के लिए थोड़ा मोटा स्ट्रोक
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            
            ctx.moveTo(points[0].x, points[0].y);
            for (let i = 1; i < points.length; i++) {
                ctx.lineTo(points[i].x, points[i].y);
            }
            ctx.stroke();
        }

        function cutSelectedArea() {
            if (!currentImg) return showToast("पहले फोटो अपलोड करें!");
            if (points.length < 3) return showToast("उंगली से एरिया मार्क करें!");

            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = mainCanvas.width;
            tempCanvas.height = mainCanvas.height;
            const tempCtx = tempCanvas.getContext('2d');

            tempCtx.beginPath();
            tempCtx.moveTo(points[0].x, points[0].y);
            for (let i = 1; i < points.length; i++) {
                tempCtx.lineTo(points[i].x, points[i].y);
            }
            tempCtx.closePath();
            tempCtx.clip();
            tempCtx.drawImage(currentImg, 0, 0);

            let minX = mainCanvas.width, minY = mainCanvas.height, maxX = 0, maxY = 0;
            points.forEach(p => {
                if (p.x < minX) minX = p.x;
                if (p.y < minY) minY = p.y;
                if (p.x > maxX) maxX = p.x;
                if (p.y > maxY) maxY = p.y;
            });

            const cropW = maxX - minX, cropH = maxY - minY;
            const finalCanvas = document.createElement('canvas');
            finalCanvas.width = cropW;
            finalCanvas.height = cropH;
            finalCanvas.getContext('2d').drawImage(tempCanvas, minX, minY, cropW, cropH, 0, 0, cropW, cropH);

            addCutoutToGallery(finalCanvas.toDataURL('image/png'));
            resetCanvas();
            showToast("कटआउट बन गया!");
        }

        function magicWandCut(startX, startY) {
            const imgData = ctx.getImageData(0, 0, mainCanvas.width, mainCanvas.height);
            const data = imgData.data;
            const targetPos = (startY * mainCanvas.width + startX) * 4;
            const targetR = data[targetPos], targetG = data[targetPos + 1], targetB = data[targetPos + 2];

            const tolerance = 40;
            const visited = new Uint8Array(mainCanvas.width * mainCanvas.height);
            const queue = [[startX, startY]];

            while (queue.length > 0) {
                const [x, y] = queue.pop();
                const idx = y * mainCanvas.width + x;
                if (visited[idx]) continue;
                visited[idx] = 1;

                const pos = idx * 4;
                if (Math.abs(data[pos] - targetR) < tolerance && Math.abs(data[pos+1] - targetG) < tolerance && Math.abs(data[pos+2] - targetB) < tolerance) {
                    data[pos + 3] = 0;
                    if (x > 0) queue.push([x - 1, y]);
                    if (x < mainCanvas.width - 1) queue.push([x + 1, y]);
                    if (y > 0) queue.push([x, y - 1]);
                    if (y < mainCanvas.height - 1) queue.push([x + 1, y]);
                }
            }

            ctx.putImageData(imgData, 0, 0);
            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = mainCanvas.width;
            tempCanvas.height = mainCanvas.height;
            tempCanvas.getContext('2d').putImageData(imgData, 0, 0);
            addCutoutToGallery(tempCanvas.toDataURL('image/png'));
        }

        function addCutoutToGallery(dataUrl) {
            if (cutoutGallery.querySelector('span')) cutoutGallery.innerHTML = '';
            const img = document.createElement('img');
            img.src = dataUrl;
            img.className = 'cutout-thumb';
            
            img.onclick = () => {
                createMovableCutout(dataUrl, 30, 30);
                showToast("बोर्ड पर जोड़ा गया!");
            };
            cutoutGallery.appendChild(img);
        }

        // --- हाथ/उंगली से Smooth Drag & Drop ---
        function createMovableCutout(src, x, y) {
            const container = document.createElement('div');
            container.className = 'cutout-item';
            container.style.left = `${x}px`;
            container.style.top = `${y}px`;
            container.style.width = '100px';

            const img = document.createElement('img');
            img.src = src;
            container.appendChild(img);
            dropZone.appendChild(container);

            let offset = { x: 0, y: 0 };

            function dragStart(e) {
                if (e.cancelable) e.preventDefault();
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                
                const itemRect = container.getBoundingClientRect();
                offset.x = clientX - itemRect.left;
                offset.y = clientY - itemRect.top;

                document.addEventListener('mousemove', dragMove);
                document.addEventListener('mouseup', dragEnd);
                document.addEventListener('touchmove', dragMove, { passive: false });
                document.addEventListener('touchend', dragEnd);
            }

            function dragMove(e) {
                if (e.cancelable) e.preventDefault();
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;

                const dropRect = dropZone.getBoundingClientRect();
                let newX = clientX - dropRect.left - offset.x;
                let newY = clientY - dropRect.top - offset.y;

                container.style.left = `${newX}px`;
                container.style.top = `${newY}px`;
            }

            function dragEnd() {
                document.removeEventListener('mousemove', dragMove);
                document.removeEventListener('mouseup', dragEnd);
                document.removeEventListener('touchmove', dragMove);
                document.removeEventListener('touchend', dragEnd);
            }

            container.addEventListener('mousedown', dragStart);
            container.addEventListener('touchstart', dragStart, { passive: false });
        }

        function addAnimationFrame() {
            const frameItems = [];
            const items = dropZone.querySelectorAll('.cutout-item');
            
            items.forEach(item => {
                frameItems.push({
                    src: item.querySelector('img').src,
                    left: item.style.left,
                    top: item.style.top
                });
            });

            if (frameItems.length === 0) return showToast("बोर्ड खाली है!");

            animationFrames.push(frameItems);

            const thumb = document.createElement('div');
            thumb.className = 'frame-thumb';
            thumb.innerText = `F-${animationFrames.length}`;
            frameStrip.appendChild(thumb);
            showToast(`फ्रेम ${animationFrames.length} सेव हुआ!`);
        }

        function playGIFAnimation() {
            if (animationFrames.length < 2) return showToast("कम से कम 2 फ्रेम बनाएं!");
            
            if (animTimer) {
                clearInterval(animTimer);
                animTimer = null;
                document.getElementById('btnPlay').innerText = "▶️ एनीमेशन चलाएं";
                return;
            }

            document.getElementById('btnPlay').innerText = "⏹️ एनीमेशन रोकें";
            let frameIdx = 0;

            animTimer = setInterval(() => {
                dropZone.innerHTML = '';
                const currentFrame = animationFrames[frameIdx];
                
                currentFrame.forEach(obj => {
                    createMovableCutout(obj.src, parseInt(obj.left), parseInt(obj.top));
                });

                frameIdx = (frameIdx + 1) % animationFrames.length;
            }, 300);
        }

        function clearCollage() {
            if (animTimer) {
                clearInterval(animTimer);
                animTimer = null;
                document.getElementById('btnPlay').innerText = "▶️ एनीमेशन चलाएं";
            }
            dropZone.innerHTML = '';
            animationFrames = [];
            frameStrip.innerHTML = '<span style="font-size:10px; color:#aaa;">फ्रेम टाइमलाइन: </span>';
            showToast("बोर्ड साफ़ कर दिया गया!");
        }
    </script>
</body>
</html>
