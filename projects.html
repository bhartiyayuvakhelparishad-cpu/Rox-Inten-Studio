<style>
/* CSS Animations & Touch Fixes */
.cutout-item { position: absolute; cursor: move; touch-action: none; user-select: none; }
.shake { animation: shakeFx 0.5s infinite alternate; }
.zoom { animation: zoomFx 1.5s infinite alternate; }
.pulse { animation: pulseFx 0.6s infinite alternate; }
.slide { animation: slideFx 1s infinite alternate; }
.fade { animation: fadeFx 1s infinite alternate; }
.rotate { animation: rotateFx 2s linear infinite; }

@keyframes shakeFx { 0% { transform: translate(1px, 1px) rotate(0deg); } 100% { transform: translate(-2px, -2px) rotate(2deg); } }
@keyframes zoomFx { 0% { transform: scale(1); } 100% { transform: scale(1.15); } }
@keyframes pulseFx { 0% { transform: scale(0.95); } 100% { transform: scale(1.08); } }
@keyframes slideFx { 0% { transform: translateX(-10px); } 100% { transform: translateX(10px); } }
@keyframes fadeFx { 0% { opacity: 0.3; } 100% { opacity: 1; } }
@keyframes rotateFx { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

/* Simple Toast */
#toastBox { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.8); color: #00e5ff; padding: 8px 16px; border-radius: 20px; font-size: 12px; z-index: 999; display: none; }
</style>

<div id="toastBox"></div>

<script>
    // Global Helper Functions (Fixes missing errors)
    function showToast(msg) {
        const box = document.getElementById('toastBox');
        box.innerText = msg;
        box.style.display = 'block';
        setTimeout(() => box.style.display = 'none', 2000);
    }

    // Mobile + Desktop Touch/Drag Function
    function makeElementDraggable(el) {
        let posX = 0, posY = 0, mouseX = 0, mouseY = 0;

        el.onmousedown = dragMouseDown;
        el.ontouchstart = dragTouchStart;

        function dragMouseDown(e) {
            e.preventDefault();
            mouseX = e.clientX;
            mouseY = e.clientY;
            document.onmouseup = closeDragElement;
            document.onmousemove = elementDrag;
        }

        function elementDrag(e) {
            e.preventDefault();
            posX = mouseX - e.clientX;
            posY = mouseY - e.clientY;
            mouseX = e.clientX;
            mouseY = e.clientY;
            el.style.top = (el.offsetTop - posY) + "px";
            el.style.left = (el.offsetLeft - posX) + "px";
        }

        function dragTouchStart(e) {
            const touch = e.touches[0];
            mouseX = touch.clientX;
            mouseY = touch.clientY;
            document.ontouchend = closeDragElement;
            document.ontouchmove = elementTouchDrag;
        }

        function elementTouchDrag(e) {
            const touch = e.touches[0];
            posX = mouseX - touch.clientX;
            posY = mouseY - touch.clientY;
            mouseX = touch.clientX;
            mouseY = touch.clientY;
            el.style.top = (el.offsetTop - posY) + "px";
            el.style.left = (el.offsetLeft - posX) + "px";
        }

        function closeDragElement() {
            document.onmouseup = null;
            document.onmousemove = null;
            document.ontouchend = null;
            document.ontouchmove = null;
        }
    }

    // Element Selector Reference
    const projMusic = document.getElementById('projMusic');
    const projBgImg = document.getElementById('projBgImg');
    const bgColorPicker = document.getElementById('bgColorPicker');
    const projAudio = document.getElementById('projAudio');
    const reelBoard = document.getElementById('reelBoard');
    const reelTimeline = document.getElementById('reelTimeline');
    
    let reelFrames = [];
    let reelTimer = null;
    let beatSpeed = 500;

    // 1. Music Load
    if(projMusic) {
        projMusic.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                projAudio.src = URL.createObjectURL(file);
                document.getElementById('musicName').innerText = "🎵 " + file.name;
                showToast("गाने का ऑडियो सिंक हो गया!");
            }
        });
    }

    // 2. BG Image Load
    if(projBgImg) {
        projBgImg.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const url = URL.createObjectURL(file);
                reelBoard.style.backgroundImage = `url('${url}')`;
                showToast("बैकग्राउंड इमेज सेट हुई!");
            }
        });
    }

    // 3. Solid Color BG
    if(bgColorPicker) {
        bgColorPicker.addEventListener('input', (e) => {
            reelBoard.style.backgroundImage = 'none';
            reelBoard.style.backgroundColor = e.target.value;
        });
    }

    // 4. Add Lyrics (Working Fix)
    function addLyricsToReel() {
        const text = document.getElementById('reelLyrics').value;
        const color = document.getElementById('textColorPicker').value;
        const size = document.getElementById('textSizeSelect').value;
        
        if (!text) return showToast("पहले बोल (Text) लिखें!");

        const div = document.createElement('div');
        div.className = 'lyrics-text cutout-item';
        div.innerText = text;
        div.style.left = '30px';
        div.style.top = '100px';
        div.style.color = color;
        div.style.fontSize = size;
        div.style.textShadow = '0 0 8px #000, 0 0 12px #00e5ff';

        div.ondblclick = () => { div.remove(); showToast("हट गया!"); };
        
        reelBoard.appendChild(div);
        makeElementDraggable(div);
        document.getElementById('reelLyrics').value = '';
        showToast("Lyrics जोड़ा गया!");
    }

    // 5. Motion FX Apply
    function applyReelFX(effectClass) {
        const items = reelBoard.querySelectorAll('.cutout-item');
        if(items.length === 0) return showToast("पहले बोर्ड पर टेक्स्ट लाएँ!");
        
        items.forEach(item => {
            item.classList.remove('shake', 'zoom', 'pulse', 'slide', 'fade', 'rotate');
            item.classList.add(effectClass);
        });
        showToast(effectClass + " FX लागू हुआ!");
    }

    function clearReelFX() {
        reelBoard.querySelectorAll('.cutout-item').forEach(item => {
            item.classList.remove('shake', 'zoom', 'pulse', 'slide', 'fade', 'rotate');
        });
        showToast("सब FX हटा दिए गए!");
    }

    function setBeatSpeed(ms) {
        beatSpeed = ms;
        showToast(`स्पीड ${ms/1000}s सेट हुई!`);
    }

    // 6. Save Timeline Frame
    function saveReelFrame() {
        const currentElements = [];
        reelBoard.querySelectorAll('.cutout-item').forEach(item => {
            const isText = item.classList.contains('lyrics-text');
            currentElements.push({
                type: isText ? 'text' : 'img',
                content: isText ? item.innerText : item.querySelector('img')?.src,
                left: item.style.left,
                top: item.style.top,
                color: item.style.color,
                fontSize: item.style.fontSize,
                classes: item.className
            });
        });

        if (currentElements.length === 0) return showToast("बोर्ड खाली है!");

        reelFrames.push({
            elements: currentElements,
            bgImg: reelBoard.style.backgroundImage,
            bgColor: reelBoard.style.backgroundColor
        });
        
        const thumb = document.createElement('div');
        thumb.className = 'frame-thumb';
        thumb.style.cssText = "padding:2px 6px; background:#00e5ff; color:#000; border-radius:4px; font-size:10px;";
        thumb.innerText = `Beat-${reelFrames.length}`;
        reelTimeline.appendChild(thumb);
        showToast(`Beat ${reelFrames.length} सेव हुई!`);
    }

    // 7. Play Reel
    function playReelStatus() {
        if (reelFrames.length === 0) return showToast("पहले Beat/Frame सेव करें!");

        if (reelTimer) {
            clearInterval(reelTimer);
            reelTimer = null;
            projAudio.pause();
            document.getElementById('btnPlayReel').innerText = "▶️ Play Reel + Song";
            return;
        }

        document.getElementById('btnPlayReel').innerText = "⏹️ Stop Reel";
        
        if (projAudio.src) {
            projAudio.currentTime = 0;
            projAudio.play();
        }

        let idx = 0;
        reelTimer = setInterval(() => {
            reelBoard.innerHTML = '';
            const activeFrame = reelFrames[idx];
            
            reelBoard.style.backgroundImage = activeFrame.bgImg;
            reelBoard.style.backgroundColor = activeFrame.bgColor;

            activeFrame.elements.forEach(obj => {
                const el = document.createElement('div');
                el.className = obj.classes;
                el.style.left = obj.left;
                el.style.top = obj.top;

                if (obj.type === 'text') {
                    el.innerText = obj.content;
                    el.style.color = obj.color;
                    el.style.fontSize = obj.fontSize;
                } else if(obj.content) {
                    const img = document.createElement('img');
                    img.src = obj.content;
                    el.appendChild(img);
                }

                el.ondblclick = () => el.remove();
                reelBoard.appendChild(el);
                makeElementDraggable(el);
            });

            idx = (idx + 1) % reelFrames.length;
        }, beatSpeed);
    }

    function clearReelBoard() {
        if (reelTimer) {
            clearInterval(reelTimer);
            reelTimer = null;
            document.getElementById('btnPlayReel').innerText = "▶️ Play Reel + Song";
        }
        projAudio.pause();
        reelBoard.innerHTML = '';
        reelBoard.style.backgroundImage = 'none';
        reelBoard.style.backgroundColor = '#05050a';
        reelFrames = [];
        reelTimeline.innerHTML = '<span style="font-size:10px; color:#aaa;">बीट/फ्रेम: </span>';
        showToast("बोर्ड रीसेट हुआ!");
    }
</script>
