<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rox Studio Pro</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        html, body { background-color: #0b0b14 !important; color: #fff !important; font-family: sans-serif !important; margin: 0 !important; padding: 10px !important; width: 100% !important; box-sizing: border-box !important; }
        .main-container { width: 100% !important; max-width: 500px !important; margin: 0 auto !important; }
        .nav-scroller { display: flex !important; gap: 8px !important; overflow-x: auto !important; padding-bottom: 12px !important; margin-bottom: 10px !important; }
        .nav-item { background: #161625; color: #00e5ff; padding: 8px 16px; border-radius: 8px; text-decoration: none; font-size: 13px; border: 1px solid #28283d; }
        .nav-item.active { background: #00e5ff; color: #000; font-weight: bold; }
        .proj-panel { background: #121220; border: 1px solid #232338; border-radius: 12px; padding: 14px; margin-bottom: 14px; }
        .panel-heading { color: #00e5ff; font-size: 14px; margin-bottom: 10px; }
        .rox-input { background: #0a0a12; border: 1px solid #2b2b40; color: #fff; padding: 10px; border-radius: 8px; width: 100%; box-sizing: border-box; margin-bottom: 8px; }
        .reel-board-container { width: 100%; height: 400px; position: relative; background: #000; border-radius: 10px; overflow: hidden; }
        #studioCanvas { width: 100%; height: 100%; }
        .btn-action { background: linear-gradient(90deg, #ff007f, #b500ff); color: #fff; border: none; padding: 12px; border-radius: 8px; width: 100%; font-weight: bold; margin-top: 5px; cursor: pointer; }
        .btn-record { background: linear-gradient(90deg, #00c853, #00e5ff); color: #000; border: none; padding: 12px; border-radius: 8px; width: 100%; font-weight: bold; margin-top: 8px; cursor: pointer; }
    </style>
</head>
<body>

<div class="main-container">
    <div class="nav-scroller">
        <a href="#" class="nav-item">Home</a>
        <a href="#" class="nav-item">Upload</a>
        <a href="#" class="nav-item active">Projects</a>
        <a href="#" class="nav-item"><i class="fa-solid fa-gear"></i></a>
    </div>

    <!-- 1. Background -->
    <div class="proj-panel">
        <div class="panel-heading"><i class="fa-solid fa-image"></i> 1. बैकग्राउंड चुनें</div>
        <input type="file" id="bgPhotoInput" class="rox-input" accept="image/*" onchange="loadBgPhoto(event)">
        
        <div class="reel-board-container">
            <canvas id="studioCanvas" width="400" height="700"></canvas>
        </div>
        <button class="btn-action" onclick="togglePlayAll()">⚡ Play Project</button>
        <button id="btnDownload" class="btn-record" onclick="toggleRecordCanvasMP4()">🎬 Record & Download MP4</button>
    </div>

    <!-- NEW: 2. Custom Sticker/Photo Panel -->
    <div class="proj-panel">
        <div class="panel-heading"><i class="fa-solid fa-file-image"></i> 2. अपना स्टिकर/फोटो जोड़ें</div>
        <input type="file" id="stickerInput" class="rox-input" accept="image/*">
        <button class="btn-action" style="background:#ff007f;" onclick="addCustomSticker()">➕ कैनवास पर जोड़ें (Add to Canvas)</button>
    </div>

    <!-- 3. FX & Text -->
    <div class="proj-panel">
        <div class="panel-heading"><i class="fa-solid fa-wand-magic-sparkles"></i> 3. इफेक्ट्स</div>
        <div style="display:flex; gap:5px;">
            <button class="nav-item" onclick="toggleRain()">🌧️ बारिश</button>
            <button class="nav-item" onclick="addBird()">🕊️ चिड़िया</button>
        </div>
        <input type="text" id="txt" class="rox-input" placeholder="लिरिक्स लिखें..." oninput="addText(this.value)" style="margin-top:10px;">
    </div>
</div>

<script>
    const canvas = document.getElementById('studioCanvas');
    const ctx = canvas.getContext('2d');
    let bgImage = null, rainActive = false, drops = [], elements = [], customStickers = [], lyricText = "";

    function loadBgPhoto(e) { 
        const file = e.target.files[0];
        const img = new Image();
        img.onload = () => bgImage = img;
        img.src = URL.createObjectURL(file);
    }

    // Add User Sticker
    function addCustomSticker() {
        const file = document.getElementById('stickerInput').files[0];
        if (file) {
            const img = new Image();
            img.onload = () => {
                customStickers.push({ img: img, x: 50, y: 50, w: 100, h: 100 });
            };
            img.src = URL.createObjectURL(file);
        }
    }

    function toggleRain() { rainActive = !rainActive; }
    function addBird() { elements.push({ type: 'bird', x: -50, y: Math.random()*200 }); }
    function addText(val) { lyricText = val; }

    function renderLoop() {
        ctx.clearRect(0,0, canvas.width, canvas.height);
        if(bgImage) ctx.drawImage(bgImage, 0,0, canvas.width, canvas.height);
        
        // Draw Custom Stickers
        customStickers.forEach(s => ctx.drawImage(s.img, s.x, s.y, s.w, s.h));

        // Draw Effects
        elements.forEach(el => { ctx.font="30px sans-serif"; ctx.fillText("🕊️", el.x, el.y); el.x+=2; });
        
        if(lyricText) { ctx.fillStyle="#fff"; ctx.font="24px Arial"; ctx.fillText(lyricText, 20, 650); }
        requestAnimationFrame(renderLoop);
    }
    renderLoop();

    // Audio/Recording logic same as before...
    // (Previous recording/audio functions remain active)
</script>
</body>
</html>
