<!-- Rox UI Style -->
<style>
    .rox-container { background: #0f0f1a; padding: 15px; border-radius: 15px; color: white; }
    .rox-preview { width: 100%; height: 250px; background: #000; border: 2px solid #333; border-radius: 12px; position: relative; overflow: hidden; margin-bottom: 15px; }
    .rox-btn { background: linear-gradient(90deg, #7928ca, #ff007f); border: none; color: white; padding: 10px; border-radius: 8px; font-weight: bold; width: 48%; margin: 5px 1%; }
    .draggable-obj { position: absolute; cursor: grab; padding: 10px; color: white; font-size: 20px; text-shadow: 0 0 5px #00e5ff; touch-action: none; user-select: none; }
    
    /* Animations */
    .anim-shake { animation: shake 0.5s infinite; }
    .anim-zoom { animation: zoom 1s infinite alternate; }
    @keyframes shake { 0%{transform: translate(1px, 1px);} 100%{transform: translate(-1px, -1px);} }
    @keyframes zoom { 0%{transform: scale(1);} 100%{transform: scale(1.2);} }
</style>

<div class="rox-container">
    <!-- Preview Area -->
    <div id="previewArea" class="rox-preview"></div>

    <!-- Controls -->
    <input type="text" id="objText" placeholder="अपना टेक्स्ट लिखें..." style="width:100%; padding:10px; background:#1c1c2e; color:white; border:1px solid #333; border-radius:8px; margin-bottom:10px;">
    
    <button class="rox-btn" onclick="addText()" style="width:98%">➕ टेक्स्ट जोड़ें</button>
    
    <div style="display:flex; flex-wrap:wrap;">
        <button class="rox-btn" onclick="applyAnim('anim-shake')">🫨 Shake</button>
        <button class="rox-btn" onclick="applyAnim('anim-zoom')">🔍 Zoom</button>
        <button class="rox-btn" onclick="playAnim()" style="background:#00c853">▶️ Play</button>
        <button class="rox-btn" onclick="clearAll()" style="background:#ff1744">❌ Clear</button>
    </div>
</div>

<script>
    // 1. टेक्स्ट जोड़ें
    function addText() {
        const text = document.getElementById('objText').value || "Rox";
        const area = document.getElementById('previewArea');
        const el = document.createElement('div');
        el.className = 'draggable-obj';
        el.innerText = text;
        el.style.left = '50px';
        el.style.top = '50px';
        
        // ड्रैग करने का लॉजिक (मोबाइल + डेस्कटॉप दोनों के लिए)
        enableDrag(el);
        area.appendChild(el);
    }

    // 2. ड्रैग करने वाला फंक्शन (मोबाइल टच फिक्स)
    function enableDrag(el) {
        let active = false;
        let currentX, currentY, initialX, initialY, xOffset = 0, yOffset = 0;

        el.addEventListener("pointerdown", dragStart);
        document.addEventListener("pointermove", drag);
        document.addEventListener("pointerup", dragEnd);

        function dragStart(e) {
            initialX = e.clientX - xOffset;
            initialY = e.clientY - yOffset;
            active = true;
        }

        function drag(e) {
            if (active) {
                e.preventDefault();
                currentX = e.clientX - initialX;
                currentY = e.clientY - initialY;
                xOffset = currentX;
                yOffset = currentY;
                el.style.transform = `translate(${currentX}px, ${currentY}px)`;
            }
        }

        function dragEnd() { active = false; }
    }

    // 3. एनीमेशन लगाना
    function applyAnim(className) {
        document.querySelectorAll('.draggable-obj').forEach(el => {
            el.className = 'draggable-obj ' + className;
        });
    }

    // 4. Play button (सबको एक साथ चलाने के लिए)
    function playAnim() {
        applyAnim('anim-shake');
        setTimeout(() => applyAnim('anim-zoom'), 1000);
    }

    // 5. क्लियर करना
    function clearAll() {
        document.getElementById('previewArea').innerHTML = '';
    }
</script>
