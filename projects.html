<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projects - Rox Inten Studio</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        html, body {
            background-color: #0b0b14 !important;
            color: #fff !important;
            font-family: 'Segoe UI', sans-serif !important;
            margin: 0 !important;
            padding: 10px !important;
            width: 100% !important;
            box-sizing: border-box !important;
            display: block !important;
        }

        .main-container {
            display: flex !important;
            flex-direction: column !important;
            width: 100% !important;
            max-width: 500px !important;
            margin: 0 auto !important;
        }

        .top-header {
            display: flex !important;
            justify-content: space-between !important;
            align-items: center !important;
            padding: 5px 0 10px 0 !important;
            width: 100% !important;
        }
        .brand-title {
            font-size: 20px !important;
            font-weight: bold !important;
            color: #00e5ff !important;
        }
        .brand-title span {
            color: #ff007f !important;
            font-size: 11px !important;
            margin-left: 5px !important;
        }
        .ai-status {
            color: #00e5ff !important;
            font-size: 11px !important;
        }

        .nav-scroller {
            display: flex !important;
            gap: 8px !important;
            overflow-x: auto !important;
            padding-bottom: 12px !important;
            margin-bottom: 10px !important;
            white-space: nowrap !important;
            width: 100% !important;
        }
        .nav-scroller::-webkit-scrollbar { display: none; }
        .nav-item {
            background: #161625 !important;
            color: #00e5ff !important;
            border: 1px solid #28283d !important;
            padding: 8px 16px !important;
            border-radius: 8px !important;
            text-decoration: none !important;
            font-size: 13px !important;
            font-weight: 500 !important;
            display: inline-block !important;
        }
        .nav-item.active {
            background: #00e5ff !important;
            color: #000 !important;
            font-weight: bold !important;
        }
        .nav-item.setting-btn {
            background: #ff007f !important;
            color: #fff !important;
        }

        .proj-panel {
            background: #121220 !important;
            border: 1px solid #232338 !important;
            border-radius: 12px !important;
            padding: 14px !important;
            margin-bottom: 14px !important;
            width: 100% !important;
            box-sizing: border-box !important;
            display: block !important;
        }
        .panel-heading {
            color: #00e5ff !important;
            font-size: 14px !important;
            margin: 0 0 12px 0 !important;
            display: flex !important;
            align-items: center !important;
            gap: 8px !important;
        }
        
        .rox-input {
            background: #0a0a12 !important;
            border: 1px solid #2b2b40 !important;
            color: #fff !important;
            padding: 10px !important;
            border-radius: 8px !important;
            width: 100% !important;
            box-sizing: border-box !important;
            font-size: 13px !important;
            margin-bottom: 8px !important;
            display: block !important;
        }
        .rox-input-half {
            width: 48% !important;
            display: inline-block !important;
        }

        .pink-btn {
            background: linear-gradient(90deg, #ff007f, #b500ff) !important;
            color: #fff !important;
            border: none !important;
            padding: 12px !important;
            border-radius: 8px !important;
            font-weight: bold !important;
            width: 100% !important;
            font-size: 13px !important;
            cursor: pointer !important;
            margin-top: 5px !important;
            display: block !important;
        }

        .download-btn {
            background: linear-gradient(90deg, #00c853, #00e5ff) !important;
            color: #000 !important;
            border: none !important;
            padding: 12px !important;
            border-radius: 8px !important;
            font-weight: bold !important;
            width: 100% !important;
            font-size: 13px !important;
            cursor: pointer !important;
            margin-top: 8px !important;
            display: block !important;
        }

        .action-grid {
            display: grid !important;
            grid-template-columns: repeat(2, 1fr) !important;
            gap: 8px !important;
            margin-top: 8px !important;
        }
        .dark-btn {
            background: #1a1a2e !important;
            color: #fff !important;
            border: 1px solid #32324e !important;
            padding: 10px !important;
            border-radius: 8px !important;
            font-size: 12px !important;
            cursor: pointer !important;
            width: 100% !important;
            box-sizing: border-box !important;
        }

        .reel-board {
            width: 100% !important;
            height: 420px !important;
            background: #000 !important;
            border: 1px solid #00e5ff !important;
            border-radius: 10px !important;
            position: relative !important;
            overflow: hidden !important;
            touch-action: none !important;
            margin-bottom: 10px !important;
            box-sizing: border-box !important;
        }

        .bg-display-img {
            width: 100% !important;
            height: 100% !important;
            object-fit: contain !important;
            display: none;
            position: absolute !important;
            top: 0 !important;
            left: 0 !important;
            z-index: 1 !important;
        }

        #rainCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
            display: none;
        }

        .draggable {
            position: absolute !important;
            cursor: move !important;
            color: #ffffff !important;
            font-size: 20px !important;
            font-weight: bold !important;
            text-shadow: 0 0 8px #000, 2px 2px 4px #000 !important;
            padding: 5px !important;
            user-select: none !important;
            touch-action: none !important;
            z-index: 10 !important;
        }

        .draggable img {
            max-width: 60px;
            max-height: 60px;
            pointer-events: none;
        }

        .emoji-grid {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding: 6px 0;
            margin-bottom: 8px;
        }
        .emoji-item {
            background: #1a1a2e;
            border: 1px solid #28283d;
            border-radius: 6px;
            padding: 6px 10px;
            font-size: 13px;
            cursor: pointer;
            white-space: nowrap;
        }

        .anim-flying-bird {
            animation: flyAcross 7s linear infinite, wingFlap 0.4s ease-in-out infinite alternate !important;
        }
        @keyframes flyAcross {
            0% { left: -10%; top: 20%; transform: scale(0.6); }
            50% { top: 10%; transform: scale(0.9); }
            100% { left: 110%; top: 30%; transform: scale(0.6); }
        }
        @keyframes wingFlap {
            0% { transform: translateY(0px) rotate(0deg); }
            100% { transform: translateY(-8px) rotate(-10deg); }
        }

        .anim-real-cloud {
            animation: floatCloud 15s linear infinite !important;
            opacity: 0.8;
            filter: drop-shadow(0px 5px 8px rgba(255,255,255,0.3));
        }
        @keyframes floatCloud {
            0% { left: -20%; }
            100% { left: 110%; }
        }

        .anim-falling-flower {
            animation: fallFlower 5s ease-in-out infinite !important;
        }
        @keyframes fallFlower {
            0% { top: -10%; transform: rotate(0deg) translateX(0); }
            50% { transform: rotate(180deg) translateX(25px); }
            100% { top: 105%; transform: rotate(360deg) translateX(-25px); }
        }

        .anim-twinkle-star {
            animation: starGlow 1.2s ease-in-out infinite alternate !important;
        }
        @keyframes starGlow {
            0% { opacity: 0.2; transform: scale(0.8); filter: drop-shadow(0 0 2px #fff); }
            100% { opacity: 1; transform: scale(1.3); filter: drop-shadow(0 0 10px #00e5ff); }
        }

        .anim-3d-clown {
            animation: clownBounce 2s cubic-bezier(0.68, -0.55, 0.265, 1.55) infinite alternate !important;
        }
        @keyframes clownBounce {
            0% { transform: scale(0.8) rotate(-10deg); }
            100% { transform: scale(1.2) rotate(10deg); }
        }

        .anim-orbit { animation: orbit var(--speed, 3s) linear infinite; }
        .anim-bubble { animation: bubble var(--speed, 2s) ease-in-out infinite; }
        .anim-shake-emoji { animation: shake var(--speed, 0.2s) infinite; }
        .anim-zoom { animation: zoomFx var(--speed, 1.5s) infinite alternate; }

        @keyframes orbit { from { transform: rotate(0deg) translateX(35px) rotate(0deg); } to { transform: rotate(360deg) translateX(35px) rotate(-360deg); } }
        @keyframes bubble { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-20px) scale(1.1); } }
        @keyframes shake { 0% { transform: translate(2px, 2px); } 50% { transform: translate(-2px, -2px); } 100% { transform: translate(2px, 2px); } }
        @keyframes zoomFx { 0% { transform: scale(1); } 100% { transform: scale(1.18); } }
    </style>
</head>
<body>

<div class="main-container">

    <div class="top-header">
        <div class="brand-title">Rox <span>INTEN STUDIO</span></div>
        <div class="ai-status"><i class="fa-solid fa-hourglass-half"></i> AI Engine: Active</div>
    </div>

    <div class="nav-scroller">
        <a href="index.html" class="nav-item">Home</a>
        <a href="upload.html" class="nav-item">Upload</a>
        <a href="ai-tools.html" class="nav-item">AI Magic</a>
        <a href="projects.html" class="nav-item active">Projects</a>
        <a href="#" class="nav-item setting-btn"><i class="fa-solid fa-gear"></i> Setting</a>
    </div>

    <!-- 1. Background Photo & GIF Panel -->
    <div class="proj-panel">
        <div class="panel-heading"><i class="fa-solid fa-image"></i> 1. बैकग्राउंड फोटो/GIF चुनें</div>
        <input type="file" id="bgPhotoInput" class="rox-input" accept="image/*,image/gif" onchange="loadBgPhoto(event)">
        
        <div id="reelBoard" class="reel-board">
            <img id="bgImg" class="bg-display-img" src="" alt="Background">
            <canvas id="rainCanvas"></canvas>
        </div>

        <button id="btnPlay" class="pink-btn" onclick="togglePlayAll()">⚡ Play Project (Audio + Animations)</button>
        <button id="btnDownload" class="download-btn" onclick="toggleRecordScreenMP4()"><i class="fa-solid fa-video"></i> 🎬 Record & Download MP4 (With All Effects + Audio)</button>
    </div>

    <!-- 2. Realistic Elements Panel -->
    <div class="proj-panel">
        <div class="panel-heading"><i class="fa-solid fa-wand-magic-sparkles"></i> 2. ओरिजिनल एलिमेंट्स और लिरिक्स</div>
        
        <div class="emoji-grid">
            <span class="emoji-item" style="border-color:#00e5ff;" onclick="toggleRealRain()">🌧️ असली बारिश</span>
            <span class="emoji-item" style="border-color:#ff007f;" onclick="addFlyingBird()">🕊️ उड़ती चिड़िया</span>
            <span class="emoji-item" onclick="addRealCloud()">☁️ बहते बादल</span>
            <span class="emoji-item" onclick="addFallingFlower()">🌸 गिरता फूल</span>
            <span class="emoji-item" onclick="addTwinkleStar()">✨ चमकता तारा</span>
            <span class="emoji-item" onclick="add3DClown()">🤡 3D जोकर</span>
        </div>

        <label style="color:#8a8a9e; font-size:11px; margin-top:4px; display:block;">मोबाइल से स्टिकर/PNG/GIF अपलोड करें:</label>
        <input type="file" id="stickerInput" class="rox-input" accept="image/*,image/gif" onchange="addMobileSticker(event)">

        <div style="display:flex; gap:6px; margin-top:8px;">
            <input type="text" id="txt" placeholder="यहाँ लिरिक्स लिखें..." class="rox-input" style="margin:0;">
            <button class="dark-btn" style="background:#00e5ff; color:#000; font-weight:bold; width: 30%;" onclick="addText()">➕ Add</button>
        </div>

        <label style="color:#8a8a9e; font-size:11px; margin-top:10px; display:block;">⚡ स्पीड कंट्रोल (Slow ↔ Fast):</label>
        <input type="range" id="animSpeed" min="0.2" max="3" step="0.2" value="1" style="width:100%; margin:5px 0 10px 0;" oninput="updateSpeed()">

        <div class="action-grid">
            <button class="dark-btn" onclick="setFX('anim-orbit')">🌀 Orbit (Round)</button>
            <button class="dark-btn" onclick="setFX('anim-bubble')">🫧 Bubble</button>
            <button class="dark-btn" onclick="setFX('anim-shake-emoji')">🤡 Emoji Shake</button>
            <button class="dark-btn" onclick="setFX('anim-zoom')">🔍 Zoom FX</button>
        </div>
    </div>

    <!-- 3. Audio Cut & Mixer Panel -->
    <div class="proj-panel">
        <div class="panel-heading"><i class="fa-solid fa-music"></i> 3. ऑडियो कट और मिक्सर</div>
        
        <label style="color:#8a8a9e; font-size:11px;">Track 1 (File / Cut Sec):</label>
        <input type="file" id="audio1" class="rox-input" accept="audio/*">
        <div style="display:flex; justify-content:space-between;">
            <input type="number" id="start1" placeholder="Start (sec)" class="rox-input rox-input-half">
            <input type="number" id="end1" placeholder="End (sec)" class="rox-input rox-input-half">
        </div>

        <label style="color:#8a8a9e; font-size:11px; margin-top:4px; display:block;">Track 2 (File / Cut Sec):</label>
        <input type="file" id="audio2" class="rox-input" accept="audio/*">
        <div style="display:flex; justify-content:space-between;">
            <input type="number" id="start2" placeholder="Start (sec)" class="rox-input rox-input-half">
            <input type="number" id="end2" placeholder="End (sec)" class="rox-input rox-input-half">
        </div>

        <button class="dark-btn" style="background:#ff4757; color:#fff; width:100%; margin-top:8px;" onclick="resetAll()">🗑️ Reset Everything</button>
    </div>

</div>

<script>
    function loadBgPhoto(event) {
        const file = event.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = document.getElementById('bgImg');
                img.src = e.target.result;
                img.style.display = 'block';
            };
            reader.readAsDataURL(file);
        }
    }

    function makeElementDraggable(el) {
        const board = document.getElementById('reelBoard');
        el.onpointerdown = (e) => {
            el.setPointerCapture(e.pointerId);
            let shiftX = e.clientX - el.getBoundingClientRect().left;
            let shiftY = e.clientY - el.getBoundingClientRect().top;

            el.onpointermove = (ev) => {
                const boardRect = board.getBoundingClientRect();
                el.style.left = (ev.clientX - boardRect.left - shiftX) + 'px';
                el.style.top = (ev.clientY - boardRect.top - shiftY) + 'px';
            };
            el.onpointerup = () => { el.onpointermove = null; };
        };
        el.ondblclick = () => el.remove();
    }

    function addText() {
        let text = document.getElementById('txt').value || "Rox Studio";
        const board = document.getElementById('reelBoard');
        const el = document.createElement('div');
        el.className = 'draggable';
        el.innerText = text;
        el.style.left = '30px';
        el.style.top = '30px';
        makeElementDraggable(el);
        board.appendChild(el);
        document.getElementById('txt').value = '';
    }

    function addFlyingBird() {
        const board = document.getElementById('reelBoard');
        const el = document.createElement('div');
        el.className = 'draggable anim-flying-bird';
        el.innerText = '🕊️';
        el.style.fontSize = '35px';
        makeElementDraggable(el);
        board.appendChild(el);
    }

    function addRealCloud() {
        const board = document.getElementById('reelBoard');
        const el = document.createElement('div');
        el.className = 'draggable anim-real-cloud';
        el.innerText = '☁️';
        el.style.fontSize = '45px';
        el.style.top = '15px';
        makeElementDraggable(el);
        board.appendChild(el);
    }

    function addFallingFlower() {
        const board = document.getElementById('reelBoard');
        const el = document.createElement('div');
        el.className = 'draggable anim-falling-flower';
        el.innerText = '🌸';
        el.style.fontSize = '30px';
        el.style.left = Math.random() * 80 + '%';
        makeElementDraggable(el);
        board.appendChild(el);
    }

    function addTwinkleStar() {
        const board = document.getElementById('reelBoard');
        const el = document.createElement('div');
        el.className = 'draggable anim-twinkle-star';
        el.innerText = '✨';
        el.style.fontSize = '28px';
        el.style.left = Math.random() * 80 + '%';
        el.style.top = Math.random() * 70 + '%';
        makeElementDraggable(el);
        board.appendChild(el);
    }

    function add3DClown() {
        const board = document.getElementById('reelBoard');
        const el = document.createElement('div');
        el.className = 'draggable anim-3d-clown';
        el.innerText = '🤡';
        el.style.fontSize = '38px';
        el.style.left = '40%';
        el.style.top = '30%';
        makeElementDraggable(el);
        board.appendChild(el);
    }

    let rainActive = false;
    let rainInterval = null;
    const canvas = document.getElementById('rainCanvas');
    const ctx = canvas.getContext('2d');
    let drops = [];

    function toggleRealRain() {
        rainActive = !rainActive;
        if (rainActive) {
            canvas.style.display = 'block';
            canvas.width = canvas.offsetWidth;
            canvas.height = canvas.offsetHeight;
            drops = [];
            for (let i = 0; i < 70; i++) {
                drops.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    length: Math.random() * 15 + 10,
                    speed: Math.random() * 8 + 6,
                    opacity: Math.random() * 0.5 + 0.3
                });
            }
            rainInterval = setInterval(drawRain, 25);
        } else {
            canvas.style.display = 'none';
            clearInterval(rainInterval);
        }
    }

    function drawRain() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.6)';
        ctx.lineWidth = 1.2;
        ctx.lineCap = 'round';

        drops.forEach(drop => {
            ctx.beginPath();
            ctx.moveTo(drop.x, drop.y);
            ctx.lineTo(drop.x - 1, drop.y + drop.length);
            ctx.stroke();

            drop.y += drop.speed;
            drop.x -= 0.5;

            if (drop.y > canvas.height) {
                drop.y = -10;
                drop.x = Math.random() * canvas.width;
            }
        });
    }

    function addMobileSticker(event) {
        const file = event.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                const board = document.getElementById('reelBoard');
                const el = document.createElement('div');
                el.className = 'draggable';
                el.style.left = '40px';
                el.style.top = '40px';

                const img = document.createElement('img');
                img.src = e.target.result;
                el.appendChild(img);

                makeElementDraggable(el);
                board.appendChild(el);
            };
            reader.readAsDataURL(file);
        }
    }

    function setFX(fxClass) {
        document.querySelectorAll('.draggable').forEach(el => {
            if(!el.className.includes('anim-real') && !el.className.includes('anim-flying') && !el.className.includes('anim-falling') && !el.className.includes('anim-twinkle') && !el.className.includes('anim-3d')) {
                el.classList.remove('anim-orbit', 'anim-bubble', 'anim-shake-emoji', 'anim-zoom');
                el.classList.add(fxClass);
            }
        });
        updateSpeed();
    }

    function updateSpeed() {
        const val = document.getElementById('animSpeed').value;
        const duration = (2 / val) + 's';
        document.querySelectorAll('.draggable').forEach(el => {
            el.style.setProperty('--speed', duration);
        });
    }

    // --- AUDIO & REALTIME DISPLAY RECORDING ENGINE ---
    let audioCtx = null;
    let audioDestinationNode = null;
    let currentSource1 = null;
    let currentSource2 = null;
    let isPlaying = false;
    let mediaRecorder = null;
    let isRecording = false;
    let screenStream = null;

    function initAudioContext() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            audioDestinationNode = audioCtx.createMediaStreamDestination();
        }
        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
    }

    async function togglePlayAll() {
        const btn = document.getElementById('btnPlay');

        if (isPlaying) {
            stopAudio();
            btn.innerText = "⚡ Play Project (Audio + Animations)";
            btn.style.background = "linear-gradient(90deg, #ff007f, #b500ff)";
            isPlaying = false;
        } else {
            initAudioContext();
            btn.innerText = "⏹️ Stop Playback";
            btn.style.background = "#ff4757";
            isPlaying = true;

            const file1 = document.getElementById('audio1').files[0];
            const file2 = document.getElementById('audio2').files[0];

            if (file1) {
                const buf1 = await file1.arrayBuffer().then(b => audioCtx.decodeAudioData(b));
                const s1 = parseFloat(document.getElementById('start1').value) || 0;
                const e1 = parseFloat(document.getElementById('end1').value) || buf1.duration;
                currentSource1 = audioCtx.createBufferSource();
                currentSource1.buffer = buf1;
                currentSource1.connect(audioCtx.destination);
                currentSource1.connect(audioDestinationNode);
                currentSource1.start(0, s1, Math.max(0, e1 - s1));
            }

            if (file2) {
                const buf2 = await file2.arrayBuffer().then(b => audioCtx.decodeAudioData(b));
                const s2 = parseFloat(document.getElementById('start2').value) || 0;
                const e2 = parseFloat(document.getElementById('end2').value) || buf2.duration;
                currentSource2 = audioCtx.createBufferSource();
                currentSource2.buffer = buf2;
                currentSource2.connect(audioCtx.destination);
                currentSource2.connect(audioDestinationNode);
                currentSource2.start(0, s2, Math.max(0, e2 - s2));
            }
        }
    }

    function stopAudio() {
        if (currentSource1) try { currentSource1.stop(); } catch(e){}
        if (currentSource2) try { currentSource2.stop(); } catch(e){}
    }

    // PERFECT MP4 RECORDING FIX USING DISPLAY MEDIA CAPTURE
    async function toggleRecordScreenMP4() {
        const btn = document.getElementById('btnDownload');

        if (isRecording) {
            if (mediaRecorder) mediaRecorder.stop();
            if (screenStream) screenStream.getTracks().forEach(track => track.stop());
            stopAudio();
            isPlaying = false;
            document.getElementById('btnPlay').innerText = "⚡ Play Project (Audio + Animations)";
            document.getElementById('btnPlay').style.background = "linear-gradient(90deg, #ff007f, #b500ff)";
            btn.innerHTML = '<i class="fa-solid fa-video"></i> 🎬 Record & Download MP4 (With All Effects + Audio)';
            btn.style.background = "linear-gradient(90deg, #00c853, #00e5ff)";
            isRecording = false;
        } else {
            try {
                screenStream = await navigator.mediaDevices.getDisplayMedia({
                    video: { mediaSource: "screen" },
                    audio: true
                });

                initAudioContext();
                if (!isPlaying) await togglePlayAll();

                // Combine Screen Stream Video with Audio Stream
                const tracks = [
                    ...screenStream.getVideoTracks(),
                    ...audioDestinationNode.stream.getAudioTracks()
                ];
                
                const finalStream = new MediaStream(tracks);

                let options = { mimeType: 'video/mp4' };
                if (!MediaRecorder.isTypeSupported('video/mp4')) {
                    options = { mimeType: 'video/webm;codecs=vp9' };
                }

                mediaRecorder = new MediaRecorder(finalStream, options);
                let chunks = [];

                mediaRecorder.ondataavailable = (e) => {
                    if (e.data.size > 0) chunks.push(e.data);
                };

                mediaRecorder.onstop = () => {
                    const blob = new Blob(chunks, { type: options.mimeType });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = 'Rox_Studio_Video_' + Date.now() + '.mp4';
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                };

                mediaRecorder.start();
                isRecording = true;
                btn.innerHTML = "🛑 Recording... Click to Stop & Save MP4";
                btn.style.background = "#ff4757";

                // Stop recording if screen sharing is manually stopped by user
                screenStream.getVideoTracks()[0].onended = () => {
                    if (isRecording) toggleRecordScreenMP4();
                };

            } catch (err) {
                alert("Screen Recording permission denied or not supported on this browser.");
            }
        }
    }

    function resetAll() {
        stopAudio();
        isPlaying = false;
        if (isRecording) toggleRecordScreenMP4();
        if (rainActive) toggleRealRain();

        document.getElementById('btnPlay').innerText = "⚡ Play Project (Audio + Animations)";
        document.getElementById('btnPlay').style.background = "linear-gradient(90deg, #ff007f, #b500ff)";
        
        const img = document.getElementById('bgImg');
        img.src = '';
        img.style.display = 'none';

        document.querySelectorAll('.draggable').forEach(e => e.remove());

        document.getElementById('bgPhotoInput').value = '';
        document.getElementById('stickerInput').value = '';
        document.getElementById('audio1').value = '';
        document.getElementById('audio2').value = '';
    }
</script>
</body>
