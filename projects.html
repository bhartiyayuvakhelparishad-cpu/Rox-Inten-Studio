<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rox Advanced Projects</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .panel { background: #161625; border: 1px solid #333; border-radius: 12px; padding: 12px; margin-bottom: 12px; }
        .rox-input { background: #0f0f1a; border: 1px solid #444; color: white; padding: 8px; border-radius: 8px; width: 100%; margin-bottom: 8px; box-sizing: border-box; font-size: 13px; }
        .rox-input-half { width: 48%; display: inline-block; }
        .reel-board { width: 100%; height: 260px; background: #000; border: 2px solid #00e5ff; border-radius: 12px; position: relative; overflow: hidden; background-size: cover; background-position: center; touch-action: none; margin-bottom: 10px; }
        .draggable { position: absolute; cursor: move; color: white; font-size: 20px; font-weight: bold; text-shadow: 0 0 8px #000, 2px 2px 4px #000; padding: 5px; user-select: none; touch-action: none; }
        
        /* Grid Buttons for Mobile */
        .fx-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-top: 8px; }
        .action-btn { background: #232338; color: #fff; border: 1px solid #00e5ff; padding: 10px; border-radius: 8px; font-weight: bold; font-size: 12px; cursor: pointer; }
        .play-btn { background: linear-gradient(90deg, #00c853, #00e5ff); color: #000; border: none; padding: 12px; border-radius: 8px; font-weight: bold; width: 100%; font-size: 14px; margin-top: 5px; cursor: pointer; }

        /* Animations */
        .anim-orbit { animation: orbit var(--speed, 3s) linear infinite; }
        .anim-bubble { animation: bubble var(--speed, 2s) ease-in-out infinite; }
        .anim-shake-emoji { animation: shake var(--speed, 0.2s) infinite; }
        .anim-zoom { animation: zoomFx var(--speed, 1.5s) infinite alternate; }

        @keyframes orbit { from { transform: rotate(0deg) translateX(40px) rotate(0deg); } to { transform: rotate(360deg) translateX(40px) rotate(-360deg); } }
        @keyframes bubble { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-25px) scale(1.1); } }
        @keyframes shake { 0% { transform: translate(2px, 2px); } 50% { transform: translate(-2px, -2px); } 100% { transform: translate(2px, 2px); } }
        @keyframes zoomFx { 0% { transform: scale(1); } 100% { transform: scale(1.2); } }
    </style>
</head>
<body>

<div class="mobile-frame">
    <div class="notch"></div>
    <div class="app-content">
        <div class="header">
            <div class="camera-icon-glow">
                <i class="fa-solid fa-camera-retro"></i>
            </div>
            <h1>Rox Studio</h1>
        </div>
        
        <!-- 1. Media & Board -->
        <div class="panel">
            <h4 style="color:#00e5ff; margin:0 0 8px 0;"><i class="fa-solid fa-image"></i> 1. Photo & Canvas</h4>
            <input type="file" id="bgPhotoInput" class="rox-input" accept="image/*" onchange="loadBgPhoto(this)">
            
            <div id="reelBoard" class="reel-board"></div>
            
            <button id="btnPlay" class="play-btn" onclick="togglePlayAll()">▶️ Play Everything (Audio + FX)</button>
        </div>

        <!-- 2. Text & Lyrics FX -->
        <div class="panel">
            <h4 style="color:#00e5ff; margin:0 0 8px 0;"><i class="fa-solid fa-wand-magic-sparkles"></i> 2. Text & Animation Effects</h4>
            <div style="display:flex; gap:5px;">
                <input type="text" id="txt" placeholder="लिरिक्स लिखें..." class="rox-input" style="margin:0;">
                <button class="action-btn" style="background:#00e5ff; color:#000;" onclick="addText()">➕ Add</button>
            </div>

            <label style="color:#aaa; font-size:11px; margin-top:8px; display:block;">⚡ Speed Control (Slow ↔ Fast):</label>
            <input type="range" id="animSpeed" min="0.2" max="3" step="0.2" value="1" style="width:100%; margin:4px 0;" oninput="updateSpeed()">

            <div class="fx-grid">
                <button class="action-btn" onclick="setFX('anim-orbit')">🌀 Orbit (Round)</button>
                <button class="action-btn" onclick="setFX('anim-bubble')">🫧 Bubble</button>
                <button class="action-btn" onclick="setFX('anim-shake-emoji')">🤡 Emoji Shake</button>
                <button class="action-btn" onclick="setFX('anim-zoom')">🔍 Zoom FX</button>
            </div>
        </div>

        <!-- 3. Audio Cut & Mixer Panel -->
        <div class="panel">
            <h4 style="color:#00e5ff; margin:0 0 8px 0;"><i class="fa-solid fa-music"></i> 3. Audio Cut & Mix Control</h4>
            
            <label style="color:#aaa; font-size:11px;">Track 1 (File / Cut Sec):</label>
            <input type="file" id="audio1" class="rox-input" accept="audio/*">
            <div>
                <input type="number" id="start1" placeholder="Start (sec)" class="rox-input rox-input-half">
                <input type="number" id="end1" placeholder="End (sec)" class="rox-input rox-input-half">
            </div>

            <label style="color:#aaa; font-size:11px;">Track 2 (File / Cut Sec):</label>
            <input type="file" id="audio2" class="rox-input" accept="audio/*">
            <div>
                <input type="number" id="start2" placeholder="Start (sec)" class="rox-input rox-input-half">
                <input type="number" id="end2" placeholder="End (sec)" class="rox-input rox-input-half">
            </div>

            <button class="action-btn" style="background:#ff4757; width:100%; margin-top:5px;" onclick="resetAll()">🗑️ Reset All</button>
        </div>
    </div>
</div>

<script>
    // Photo Engine
    function loadBgPhoto(input) {
        if (input.files && input.files[0]) {
            const reader = new FileReader();
            reader.onload = function(e) {
                document.getElementById('reelBoard').style.backgroundImage = `url('${e.target.result}')`;
            }
            reader.readAsDataURL(input.files[0]);
        }
    }

    // Draggable Text Engine
    function addText() {
        let text = document.getElementById('txt').value || "Rox Studio";
        const board = document.getElementById('reelBoard');
        const el = document.createElement('div');
        el.className = 'draggable';
        el.innerText = text;
        el.style.left = '40px';
        el.style.top = '40px';
        
        el.onpointerdown = (e) => {
            el.setPointerCapture(e.pointerId);
            let shiftX = e.clientX - el.getBoundingClientRect().left;
            let shiftY = e.clientY - el.getBoundingClientRect().top;

            el.onpointermove = (ev) => {
                const boardRect = board.getBoundingClientRect();
                el.style.left = (ev.clientX - boardRect.left - shiftX) + 'px';
                el.style.top = (ev.clientY - boardRect.top - shiftY) + 'px';
            };
            el.onpointerup = () => { el.onpointermove = null; };
        };

        el.ondblclick = () => el.remove();
        board.appendChild(el);
        document.getElementById('txt').value = '';
    }

    // Animation & Speed Engine
    function setFX(fxClass) {
        document.querySelectorAll('.draggable').forEach(el => {
            el.classList.remove('anim-orbit', 'anim-bubble', 'anim-shake-emoji', 'anim-zoom');
            el.classList.add(fxClass);
            
            if(fxClass === 'anim-shake-emoji' && !el.innerText.includes('🤡')) {
                el.innerText = '🤡 ' + el.innerText + ' 🤡';
            }
        });
        updateSpeed();
    }

    function updateSpeed() {
        const val = document.getElementById('animSpeed').value;
        const duration = (2 / val) + 's';
        document.querySelectorAll('.draggable').forEach(el => {
            el.style.setProperty('--speed', duration);
        });
    }

    // Audio Mixer & Master Play Control
    let audioCtx = null;
    let currentSource1 = null;
    let currentSource2 = null;
    let isPlaying = false;

    async function togglePlayAll() {
        const btn = document.getElementById('btnPlay');

        if (isPlaying) {
            stopAudio();
            btn.innerText = "▶️ Play Everything (Audio + FX)";
            btn.style.background = "linear-gradient(90deg, #00c853, #00e5ff)";
            isPlaying = false;
        } else {
            btn.innerText = "⏹️ Stop Playback";
            btn.style.background = "#ff4757";
            isPlaying = true;

            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') await audioCtx.resume();

            const file1 = document.getElementById('audio1').files[0];
            const file2 = document.getElementById('audio2').files[0];

            if (file1) {
                const buf1 = await file1.arrayBuffer().then(b => audioCtx.decodeAudioData(b));
                const s1 = parseFloat(document.getElementById('start1').value) || 0;
                const e1 = parseFloat(document.getElementById('end1').value) || buf1.duration;
                currentSource1 = audioCtx.createBufferSource();
                currentSource1.buffer = buf1;
                currentSource1.connect(audioCtx.destination);
                currentSource1.start(0, s1, Math.max(0, e1 - s1));
            }

            if (file2) {
                const buf2 = await file2.arrayBuffer().then(b => audioCtx.decodeAudioData(b));
                const s2 = parseFloat(document.getElementById('start2').value) || 0;
                const e2 = parseFloat(document.getElementById('end2').value) || buf2.duration;
                currentSource2 = audioCtx.createBufferSource();
                currentSource2.buffer = buf2;
                currentSource2.connect(audioCtx.destination);
                currentSource2.start(0, s2, Math.max(0, e2 - s2));
            }
        }
    }

    function stopAudio() {
        if (currentSource1) try { currentSource1.stop(); } catch(e){}
        if (currentSource2) try { currentSource2.stop(); } catch(e){}
    }

    function resetAll() {
        stopAudio();
        isPlaying = false;
        document.getElementById('btnPlay').innerText = "▶️ Play Everything (Audio + FX)";
        document.getElementById('btnPlay').style.background = "linear-gradient(90deg, #00c853, #00e5ff)";
        document.getElementById('reelBoard').innerHTML = '';
        document.getElementById('reelBoard').style.backgroundImage = 'none';
        document.getElementById('bgPhotoInput').value = '';
        document.getElementById('audio1').value = '';
        document.getElementById('audio2').value = '';
    }
</script>
</body>
</html>
