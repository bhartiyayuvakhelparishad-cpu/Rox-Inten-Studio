<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projects - Rox Inten Studio</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* CSS Fix to Override Flexbox Layout Collision */
        html, body {
            background-color: #0b0b14 !important;
            color: #fff !important;
            font-family: 'Segoe UI', sans-serif !important;
            margin: 0 !important;
            padding: 10px !important;
            width: 100% !important;
            box-sizing: border-box !important;
            display: block !important;
        }

        .main-container {
            display: flex !important;
            flex-direction: column !important;
            width: 100% !important;
            max-width: 500px !important;
            margin: 0 auto !important;
        }

        /* Top Bar Styling */
        .top-header {
            display: flex !important;
            justify-content: space-between !important;
            align-items: center !important;
            padding: 5px 0 10px 0 !important;
            width: 100% !important;
        }
        .brand-title {
            font-size: 20px !important;
            font-weight: bold !important;
            color: #00e5ff !important;
        }
        .brand-title span {
            color: #ff007f !important;
            font-size: 11px !important;
            margin-left: 5px !important;
        }
        .ai-status {
            color: #00e5ff !important;
            font-size: 11px !important;
        }

        /* Nav Scrollable Bar */
        .nav-scroller {
            display: flex !important;
            gap: 8px !important;
            overflow-x: auto !important;
            padding-bottom: 12px !important;
            margin-bottom: 10px !important;
            white-space: nowrap !important;
            width: 100% !important;
        }
        .nav-scroller::-webkit-scrollbar { display: none; }
        .nav-item {
            background: #161625 !important;
            color: #00e5ff !important;
            border: 1px solid #28283d !important;
            padding: 8px 16px !important;
            border-radius: 8px !important;
            text-decoration: none !important;
            font-size: 13px !important;
            font-weight: 500 !important;
            display: inline-block !important;
        }
        .nav-item.active {
            background: #00e5ff !important;
            color: #000 !important;
            font-weight: bold !important;
        }
        .nav-item.setting-btn {
            background: #ff007f !important;
            color: #fff !important;
        }

        /* Panel Block Normalization */
        .proj-panel {
            background: #121220 !important;
            border: 1px solid #232338 !important;
            border-radius: 12px !important;
            padding: 14px !important;
            margin-bottom: 14px !important;
            width: 100% !important;
            box-sizing: border-box !important;
            display: block !important;
            float: none !important;
            clear: both !important;
        }
        .panel-heading {
            color: #00e5ff !important;
            font-size: 14px !important;
            margin: 0 0 12px 0 !important;
            display: flex !important;
            align-items: center !important;
            gap: 8px !important;
        }
        
        .rox-input {
            background: #0a0a12 !important;
            border: 1px solid #2b2b40 !important;
            color: #fff !important;
            padding: 10px !important;
            border-radius: 8px !important;
            width: 100% !important;
            box-sizing: border-box !important;
            font-size: 13px !important;
            margin-bottom: 8px !important;
            display: block !important;
        }
        .rox-input-half {
            width: 48% !important;
            display: inline-block !important;
        }

        .pink-btn {
            background: linear-gradient(90deg, #ff007f, #b500ff) !important;
            color: #fff !important;
            border: none !important;
            padding: 12px !important;
            border-radius: 8px !important;
            font-weight: bold !important;
            width: 100% !important;
            font-size: 13px !important;
            cursor: pointer !important;
            margin-top: 5px !important;
            display: block !important;
        }
        .action-grid {
            display: grid !important;
            grid-template-columns: repeat(2, 1fr) !important;
            gap: 8px !important;
            margin-top: 8px !important;
        }
        .dark-btn {
            background: #1a1a2e !important;
            color: #fff !important;
            border: 1px solid #32324e !important;
            padding: 10px !important;
            border-radius: 8px !important;
            font-size: 12px !important;
            cursor: pointer !important;
            width: 100% !important;
            box-sizing: border-box !important;
        }

        /* Reel Board Canvas */
        .reel-board {
            width: 100% !important;
            height: 240px !important;
            background: #000 !important;
            border: 1px solid #00e5ff !important;
            border-radius: 10px !important;
            position: relative !important;
            overflow: hidden !important;
            touch-action: none !important;
            margin-bottom: 10px !important;
            box-sizing: border-box !important;
        }

        /* Background Image inside Canvas */
        .bg-display-img {
            width: 100% !important;
            height: 100% !important;
            object-fit: cover !important;
            display: none;
            position: absolute !important;
            top: 0 !important;
            left: 0 !important;
            z-index: 1 !important;
        }

        .draggable {
            position: absolute !important;
            cursor: move !important;
            color: #ffffff !important;
            font-size: 20px !important;
            font-weight: bold !important;
            text-shadow: 0 0 8px #000, 2px 2px 4px #000 !important;
            padding: 5px !important;
            user-select: none !important;
            touch-action: none !important;
            z-index: 10 !important;
        }

        /* FX Animations */
        .anim-orbit { animation: orbit var(--speed, 3s) linear infinite; }
        .anim-bubble { animation: bubble var(--speed, 2s) ease-in-out infinite; }
        .anim-shake-emoji { animation: shake var(--speed, 0.2s) infinite; }
        .anim-zoom { animation: zoomFx var(--speed, 1.5s) infinite alternate; }

        @keyframes orbit { from { transform: rotate(0deg) translateX(35px) rotate(0deg); } to { transform: rotate(360deg) translateX(35px) rotate(-360deg); } }
        @keyframes bubble { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-20px) scale(1.1); } }
        @keyframes shake { 0% { transform: translate(2px, 2px); } 50% { transform: translate(-2px, -2px); } 100% { transform: translate(2px, 2px); } }
        @keyframes zoomFx { 0% { transform: scale(1); } 100% { transform: scale(1.18); } }
    </style>
</head>
<body>

<div class="main-container">

    <!-- Header Section -->
    <div class="top-header">
        <div class="brand-title">Rox <span>INTEN STUDIO</span></div>
        <div class="ai-status"><i class="fa-solid fa-hourglass-half"></i> AI Engine: Active</div>
    </div>

    <!-- Navigation Bar -->
    <div class="nav-scroller">
        <a href="index.html" class="nav-item">Home</a>
        <a href="upload.html" class="nav-item">Upload</a>
        <a href="ai-tools.html" class="nav-item">AI Magic</a>
        <a href="projects.html" class="nav-item active">Projects</a>
        <a href="#" class="nav-item setting-btn"><i class="fa-solid fa-gear"></i> Setting</a>
    </div>

    <!-- 1. Background Photo Panel -->
    <div class="proj-panel">
        <div class="panel-heading"><i class="fa-solid fa-image"></i> 1. बैकग्राउंड फोटो चुनें</div>
        <input type="file" id="bgPhotoInput" class="rox-input" accept="image/*" onchange="loadBgPhoto(event)">
        
        <div id="reelBoard" class="reel-board">
            <img id="bgImg" class="bg-display-img" src="" alt="Background">
        </div>

        <button id="btnPlay" class="pink-btn" onclick="togglePlayAll()">⚡ Play Project (Audio + Animations)</button>
    </div>

    <!-- 2. Text & FX Panel -->
    <div class="proj-panel">
        <div class="panel-heading"><i class="fa-solid fa-wand-magic-sparkles"></i> 2. लिरिक्स टेक्स्ट और इफेक्ट्स</div>
        <div style="display:flex; gap:6px;">
            <input type="text" id="txt" placeholder="यहाँ लिरिक्स लिखें..." class="rox-input" style="margin:0;">
            <button class="dark-btn" style="background:#00e5ff; color:#000; font-weight:bold; width: 30%;" onclick="addText()">➕ Add</button>
        </div>

        <label style="color:#8a8a9e; font-size:11px; margin-top:10px; display:block;">⚡ स्पीड कंट्रोल (Slow ↔ Fast):</label>
        <input type="range" id="animSpeed" min="0.2" max="3" step="0.2" value="1" style="width:100%; margin:5px 0 10px 0;" oninput="updateSpeed()">

        <div class="action-grid">
            <button class="dark-btn" onclick="setFX('anim-orbit')">🌀 Orbit (Round)</button>
            <button class="dark-btn" onclick="setFX('anim-bubble')">🫧 Bubble</button>
            <button class="dark-btn" onclick="setFX('anim-shake-emoji')">🤡 Emoji Shake</button>
            <button class="dark-btn" onclick="setFX('anim-zoom')">🔍 Zoom FX</button>
        </div>
    </div>

    <!-- 3. Audio Cut & Mixer Panel -->
    <div class="proj-panel">
        <div class="panel-heading"><i class="fa-solid fa-music"></i> 3. ऑडियो कट और मिक्सर</div>
        
        <label style="color:#8a8a9e; font-size:11px;">Track 1 (File / Cut Sec):</label>
        <input type="file" id="audio1" class="rox-input" accept="audio/*">
        <div style="display:flex; justify-content:space-between;">
            <input type="number" id="start1" placeholder="Start (sec)" class="rox-input rox-input-half">
            <input type="number" id="end1" placeholder="End (sec)" class="rox-input rox-input-half">
        </div>

        <label style="color:#8a8a9e; font-size:11px; margin-top:4px; display:block;">Track 2 (File / Cut Sec):</label>
        <input type="file" id="audio2" class="rox-input" accept="audio/*">
        <div style="display:flex; justify-content:space-between;">
            <input type="number" id="start2" placeholder="Start (sec)" class="rox-input rox-input-half">
            <input type="number" id="end2" placeholder="End (sec)" class="rox-input rox-input-half">
        </div>

        <button class="dark-btn" style="background:#ff4757; color:#fff; width:100%; margin-top:8px;" onclick="resetAll()">🗑️ Reset Everything</button>
    </div>

</div>

<script>
    function loadBgPhoto(event) {
        const file = event.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = document.getElementById('bgImg');
                img.src = e.target.result;
                img.style.display = 'block';
            };
            reader.readAsDataURL(file);
        }
    }

    function addText() {
        let text = document.getElementById('txt').value || "Rox Studio";
        const board = document.getElementById('reelBoard');
        const el = document.createElement('div');
        el.className = 'draggable';
        el.innerText = text;
        el.style.left = '30px';
        el.style.top = '30px';
        
        el.onpointerdown = (e) => {
            el.setPointerCapture(e.pointerId);
            let shiftX = e.clientX - el.getBoundingClientRect().left;
            let shiftY = e.clientY - el.getBoundingClientRect().top;

            el.onpointermove = (ev) => {
                const boardRect = board.getBoundingClientRect();
                el.style.left = (ev.clientX - boardRect.left - shiftX) + 'px';
                el.style.top = (ev.clientY - boardRect.top - shiftY) + 'px';
            };
            el.onpointerup = () => { el.onpointermove = null; };
        };

        el.ondblclick = () => el.remove();
        board.appendChild(el);
        document.getElementById('txt').value = '';
    }

    function setFX(fxClass) {
        document.querySelectorAll('.draggable').forEach(el => {
            el.classList.remove('anim-orbit', 'anim-bubble', 'anim-shake-emoji', 'anim-zoom');
            el.classList.add(fxClass);
            
            if(fxClass === 'anim-shake-emoji' && !el.innerText.includes('🤡')) {
                el.innerText = '🤡 ' + el.innerText + ' 🤡';
            }
        });
        updateSpeed();
    }

    function updateSpeed() {
        const val = document.getElementById('animSpeed').value;
        const duration = (2 / val) + 's';
        document.querySelectorAll('.draggable').forEach(el => {
            el.style.setProperty('--speed', duration);
        });
    }

    let audioCtx = null;
    let currentSource1 = null;
    let currentSource2 = null;
    let isPlaying = false;

    async function togglePlayAll() {
        const btn = document.getElementById('btnPlay');

        if (isPlaying) {
            stopAudio();
            btn.innerText = "⚡ Play Project (Audio + Animations)";
            btn.style.background = "linear-gradient(90deg, #ff007f, #b500ff)";
            isPlaying = false;
        } else {
            btn.innerText = "⏹️ Stop Playback";
            btn.style.background = "#ff4757";
            isPlaying = true;

            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') await audioCtx.resume();

            const file1 = document.getElementById('audio1').files[0];
            const file2 = document.getElementById('audio2').files[0];

            if (file1) {
                const buf1 = await file1.arrayBuffer().then(b => audioCtx.decodeAudioData(b));
                const s1 = parseFloat(document.getElementById('start1').value) || 0;
                const e1 = parseFloat(document.getElementById('end1').value) || buf1.duration;
                currentSource1 = audioCtx.createBufferSource();
                currentSource1.buffer = buf1;
                currentSource1.connect(audioCtx.destination);
                currentSource1.start(0, s1, Math.max(0, e1 - s1));
            }

            if (file2) {
                const buf2 = await file2.arrayBuffer().then(b => audioCtx.decodeAudioData(b));
                const s2 = parseFloat(document.getElementById('start2').value) || 0;
                const e2 = parseFloat(document.getElementById('end2').value) || buf2.duration;
                currentSource2 = audioCtx.createBufferSource();
                currentSource2.buffer = buf2;
                currentSource2.connect(audioCtx.destination);
                currentSource2.start(0, s2, Math.max(0, e2 - s2));
            }
        }
    }

    function stopAudio() {
        if (currentSource1) try { currentSource1.stop(); } catch(e){}
        if (currentSource2) try { currentSource2.stop(); } catch(e){}
    }

    function resetAll() {
        stopAudio();
        isPlaying = false;
        document.getElementById('btnPlay').innerText = "⚡ Play Project (Audio + Animations)";
        document.getElementById('btnPlay').style.background = "linear-gradient(90deg, #ff007f, #b500ff)";
        
        // Hide image and reset src
        const img = document.getElementById('bgImg');
        img.src = '';
        img.style.display = 'none';

        // Remove created draggable text elements
        document.querySelectorAll('.draggable').forEach(e => e.remove());

        document.getElementById('bgPhotoInput').value = '';
        document.getElementById('audio1').value = '';
        document.getElementById('audio2').value = '';
    }
</script>
</body>
</html>
