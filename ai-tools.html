<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rox INTEN STUDIO - Pro Live Camera</title>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/selfie_segmentation.js" crossorigin="anonymous"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; }
        body { background: #0c0c14; color: #fff; min-height: 100vh; display: flex; flex-direction: column; }

        .top-navbar { background: #161625; padding: 10px 15px; border-bottom: 2px solid #28283d; display: flex; justify-content: space-between; align-items: center; }
        .logo-area h1 { color: #00e5ff; font-size: 20px; }

        .studio-body { display: flex; flex-direction: column; flex: 1; padding: 15px; align-items: center; }
        
        .camera-container { position: relative; width: 100%; max-width: 360px; aspect-ratio: 9/16; background: #000; border: 2px solid #00e5ff; border-radius: 10px; overflow: hidden; display: flex; align-items: center; justify-content: center; }
        canvas { width: 100%; height: 100%; object-fit: cover; }
        video.hidden-elem, img.hidden-elem { display: none; }

        .tools-panel { width: 100%; max-width: 360px; background: #1a1a2b; border: 1px solid #2e2e48; padding: 12px; border-radius: 8px; margin-top: 12px; }
        .tools-panel h3 { font-size: 12px; color: #00e5ff; margin-bottom: 8px; text-transform: uppercase; }

        label { font-size: 11px; color: #aaa; margin-top: 6px; display: flex; justify-content: space-between; align-items: center; }
        input, button, select { width: 100%; padding: 8px; margin-top: 4px; background: #25253b; color: #fff; border: 1px solid #3e3e5e; border-radius: 5px; cursor: pointer; font-size: 12px; }
        button:hover, select:hover { background: #00e5ff; color: #000; font-weight: bold; }
        
        .btn-green { background: #00c853; border: none; font-weight: bold; color: #000; }
        .btn-blue { background: #00e5ff; border: none; font-weight: bold; color: #000; }
        .btn-rec { background: #ff007f; border: none; font-weight: bold; }
        .btn-rec.recording { background: #ff1744; animation: pulse 1s infinite; }

        .audio-item { background: #12121c; padding: 6px; border-radius: 4px; margin-top: 6px; border: 1px solid #333; }
        .audio-controls { display: flex; gap: 5px; margin-top: 4px; }

        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }
        #statusText { position: absolute; top: 10px; left: 10px; font-size: 11px; background: rgba(0,0,0,0.85); padding: 4px 8px; border-radius: 4px; color: #00e5ff; z-index: 10; border: 1px solid #00e5ff; }
    </style>
</head>
<body>

    <div class="top-navbar">
        <div class="logo-area"><h1>Rox Studio HD</h1></div>
        <a href="index.html" style="color: #00e5ff; text-decoration: none; font-size: 13px;">🏠 Home</a>
    </div>

    <div class="studio-body">
        
        <div class="camera-container">
            <canvas id="outputCanvas"></canvas>
            <div id="statusText">कैमरा ऑन करें</div>
        </div>

        <video id="inputVideo" class="hidden-elem" playsinline muted></video>
        <video id="bgVideo" class="hidden-elem" playsinline loop></video>
        <img id="bgImage" class="hidden-elem" crossorigin="anonymous">

        <!-- Background Options -->
        <div class="tools-panel">
            <h3>🌄 1. बैकग्राउंड चुनें (HD Landscapes & GIF Link)</h3>
            <label>बैकग्राउंड मोड:</label>
            <select id="bgSelect" onchange="changeHDBackground()">
                <option value="https://images.unsplash.com/photo-1585320806297-9794b3e4eeae?w=720&q=80" selected>1. 🌺 बगीचा, सुंदर फूल एवं पक्षी (Garden)</option>
                <option value="https://images.unsplash.com/photo-1519692933481-e162a57d6721?w=720&q=80">2. 🌧️ मूसलाधार बारिश एवं बूंदें (Rain)</option>
                <option value="https://images.unsplash.com/photo-1506744038136-46273834b3fb?w=720&q=80">3. 🌅 Sunset Mountain & River (सूर्यास्त)</option>
                <option value="https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?w=720&q=80">4. 🏔️ Misty Mountains (पहाड़)</option>
                <option value="https://images.unsplash.com/photo-1433086966358-54859d0ed716?w=720&q=80">5. 🌊 Waterfall & Greenery (झरना)</option>
                <option value="custom_url">🌐 6. ऑनलाइन GIF / फोटो का URL लिंक डालें</option>
                <option value="custom_upload">📁 7. अपनी खुद की फोटो/GIF अपलोड करें</option>
                <option value="custom_video">🎬 8. अपना खुद का वीडियो अपलोड करें</option>
            </select>

            <div id="urlInputGroup" style="display:none; margin-top:6px;">
                <label>GIF / Photo URL का डायरेक्ट लिंक पेस्ट करें:</label>
                <div style="display:flex; gap:5px;">
                    <input type="text" id="bgUrlInput" placeholder="https://example.com/image.gif" style="flex:1;">
                    <button onclick="applyUrlBackground()" class="btn-blue" style="width: auto; padding: 0 10px;">अप्लाई</button>
                </div>
            </div>

            <div id="photoUploadGroup" style="display:none; margin-top:6px;">
                <label>कस्टम फोटो/GIF फ़ाइल अपलोड करें:</label>
                <input type="file" id="bgImageUpload" accept="image/*">
            </div>

            <div id="videoUploadGroup" style="display:none; margin-top:6px;">
                <label>कस्टम वीडियो अपलोड करें:</label>
                <input type="file" id="bgVideoUpload" accept="video/*">
            </div>
        </div>

        <!-- Camera Controls -->
        <div class="tools-panel">
            <h3>📹 2. कैमरा कंट्रोल (Front / Back Camera)</h3>
            <label>कैमरा चुनें:</label>
            <select id="cameraModeSelect">
                <option value="user">📱 फ्रंट कैमरा (Front Camera)</option>
                <option value="environment">📸 बैक कैमरा (Back / Rear Camera)</option>
            </select>

            <button onclick="startLiveCamera()" class="btn-green" style="margin-top:8px;">▶️ कैमरा ऑन / स्विच करें</button>
            <button onclick="capturePhoto()" style="margin-top:8px;">📸 HD फोटो खींचें</button>
            <button id="recBtn" onclick="toggleRecording()" class="btn-rec" style="margin-top:8px;">🎥 HD वीडियो रिकॉर्ड करें</button>
            <button onclick="stopLiveCamera()" style="background:#333; margin-top:8px;">⏹️ कैमरा बंद करें</button>
        </div>

        <!-- Layout Controls -->
        <div class="tools-panel">
            <h3>📐 3. लेआउट एवं थंबनेल</h3>
            <label>कैमरा लेआउट:</label>
            <select id="layoutModeSelect" onchange="updateLayoutMode()">
                <option value="full">1. Full Camera Cutout (पीछे बैकग्राउंड)</option>
                <option value="pip_top_right" selected>2. Thumbnail Mode (ऊपर दाएँ)</option>
                <option value="pip_bottom_right">3. Thumbnail Mode (नीचे दाएँ)</option>
            </select>

            <label>थंबनेल आकार:</label>
            <select id="pipSizeSelect" onchange="updateLayoutMode()">
                <option value="0.3">Small (छोटा)</option>
                <option value="0.4" selected>Medium (मध्यम)</option>
                <option value="0.5">Large (बड़ा)</option>
            </select>
        </div>

        <!-- Audio Mixer -->
        <div class="tools-panel">
            <h3>🎵 4. ऑडियो मिक्सर</h3>
            <label>ऑडियो ट्रैक अपलोड करें (MP3/WAV):</label>
            <input type="file" id="audioUpload" accept="audio/*" multiple onchange="handleAudioUpload(event)">
            <div id="audioList"></div>
        </div>

    </div>

    <script>
        const inputVideo = document.getElementById('inputVideo');
        const bgVideo = document.getElementById('bgVideo');
        const bgImage = document.getElementById('bgImage');
        const bgImageUpload = document.getElementById('bgImageUpload');
        const bgVideoUpload = document.getElementById('bgVideoUpload');
        const canvas = document.getElementById('outputCanvas');
        const ctx = canvas.getContext('2d');
        const statusText = document.getElementById('statusText');
        const recBtn = document.getElementById('recBtn');

        const bufferCanvas = document.createElement('canvas');
        const bufferCtx = bufferCanvas.getContext('2d');

        let selfieSegmentation, mediaRecorder, animFrameId;
        let recordedChunks = [], isRecording = false;
        let activeBgMode = 'image';
        let layoutMode = 'pip_top_right';
        let pipScale = 0.4;
        let micAudioStream = null;
        let currentFacingMode = 'user';

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const audioMixDestination = audioCtx.createMediaStreamDestination();
        let loadedAudios = [];

        function initAI() {
            selfieSegmentation = new SelfieSegmentation({
                locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/${file}`
            });
            selfieSegmentation.setOptions({ modelSelection: 1 });
            selfieSegmentation.onResults(onAIResults);
            
            bgImage.src = "https://images.unsplash.com/photo-1585320806297-9794b3e4eeae?w=720&q=80";
        }

        function changeHDBackground() {
            const val = document.getElementById('bgSelect').value;
            document.getElementById('urlInputGroup').style.display = (val === 'custom_url') ? 'block' : 'none';
            document.getElementById('photoUploadGroup').style.display = (val === 'custom_upload') ? 'block' : 'none';
            document.getElementById('videoUploadGroup').style.display = (val === 'custom_video') ? 'block' : 'none';

            if (val === 'custom_url' || val === 'custom_upload') {
                activeBgMode = 'image';
            } else if (val === 'custom_video') {
                activeBgMode = 'video';
            } else {
                activeBgMode = 'image';
                bgImage.src = val;
            }
        }

        function applyUrlBackground() {
            const url = document.getElementById('bgUrlInput').value.trim();
            if (url) {
                bgImage.src = url;
                activeBgMode = 'image';
                statusText.innerText = "✅ GIF/URL लिंक लोड हो गया!";
            } else {
                alert("कृपया एक वैध URL डालें!");
            }
        }

        function updateLayoutMode() {
            layoutMode = document.getElementById('layoutModeSelect').value;
            pipScale = parseFloat(document.getElementById('pipSizeSelect').value);
        }

        function renderBackground(targetCtx, w, h) {
            if (activeBgMode === 'image' && bgImage.complete && bgImage.src) {
                targetCtx.drawImage(bgImage, 0, 0, w, h);
            } else if (activeBgMode === 'video' && bgVideo.readyState >= 2) {
                targetCtx.drawImage(bgVideo, 0, 0, w, h);
            } else {
                targetCtx.fillStyle = '#0f172a';
                targetCtx.fillRect(0, 0, w, h);
            }
        }

        function onAIResults(results) {
            if (canvas.width !== results.image.width) {
                canvas.width = results.image.width;
                canvas.height = results.image.height;
                bufferCanvas.width = results.image.width;
                bufferCanvas.height = results.image.height;
            }

            const w = canvas.width;
            const h = canvas.height;

            bufferCtx.save();
            bufferCtx.clearRect(0, 0, w, h);
            
            // Mirror flip only for front camera
            if (currentFacingMode === 'user') {
                bufferCtx.translate(w, 0);
                bufferCtx.scale(-1, 1);
            }

            bufferCtx.filter = 'contrast(2000%) brightness(95%)';
            bufferCtx.drawImage(results.segmentationMask, 0, 0, w, h);
            
            bufferCtx.globalCompositeOperation = 'source-in';
            bufferCtx.filter = 'none';
            bufferCtx.drawImage(results.image, 0, 0, w, h);
            bufferCtx.restore();

            ctx.save();
            ctx.clearRect(0, 0, w, h);

            if (layoutMode === 'full') {
                renderBackground(ctx, w, h);
                ctx.drawImage(bufferCanvas, 0, 0, w, h);
            } else {
                renderBackground(ctx, w, h);

                let thumbW = w * pipScale;
                let thumbH = h * pipScale;
                let posX = w - thumbW - 20;
                let posY = (layoutMode === 'pip_bottom_right') ? (h - thumbH - 20) : 20;

                ctx.fillStyle = '#00e5ff';
                ctx.fillRect(posX - 3, posY - 3, thumbW + 6, thumbH + 6);

                ctx.save();
                ctx.beginPath();
                ctx.rect(posX, posY, thumbW, thumbH);
                ctx.clip();
                renderBackground(ctx, w, h);
                ctx.drawImage(bufferCanvas, posX, posY, thumbW, thumbH);
                ctx.restore();
            }

            ctx.restore();
        }

        async function startLiveCamera() {
            // Stop active camera stream
            if (inputVideo.srcObject) {
                inputVideo.srcObject.getTracks().forEach(track => track.stop());
            }
            if (animFrameId) cancelAnimationFrame(animFrameId);

            currentFacingMode = document.getElementById('cameraModeSelect').value;
            statusText.innerText = "⏳ कैमरा कनेक्ट हो रहा है...";

            try {
                if (!micAudioStream) {
                    micAudioStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    let micSource = audioCtx.createMediaStreamSource(micAudioStream);
                    micSource.connect(audioMixDestination);
                }
            } catch (err) {
                console.warn("माइक एक्सेस नहीं मिला:", err);
            }

            // Enhanced Constraints Logic for Back Camera Fix
            let videoConstraints = {
                width: { ideal: 1280 },
                height: { ideal: 720 }
            };

            if (currentFacingMode === 'environment') {
                videoConstraints.facingMode = { exact: "environment" };
            } else {
                videoConstraints.facingMode = "user";
            }

            try {
                let stream;
                try {
                    stream = await navigator.mediaDevices.getUserMedia({ video: videoConstraints, audio: false });
                } catch (firstErr) {
                    // Fallback attempt if exact environment fails on some mobile models
                    if (currentFacingMode === 'environment') {
                        stream = await navigator.mediaDevices.getUserMedia({ 
                            video: { facingMode: "environment", width: { ideal: 1280 }, height: { ideal: 720 } }, 
                            audio: false 
                        });
                    } else {
                        throw firstErr;
                    }
                }

                inputVideo.srcObject = stream;
                await inputVideo.play();

                async function renderFrame() {
                    if (!inputVideo.paused && !inputVideo.ended) {
                        await selfieSegmentation.send({ image: inputVideo });
                        animFrameId = requestAnimationFrame(renderFrame);
                    }
                }
                renderFrame();

                if (activeBgMode === 'video') bgVideo.play();
                statusText.innerText = currentFacingMode === 'user' ? "🔴 Front Camera Active" : "🔴 Back Camera Active";

            } catch (e) {
                alert("कैमरा एक्सेस त्रुटि: कृपया सुनिश्चित करें कि आपने ब्राउज़र में कैमरा Permission अलाउ (Allow) की है।");
                statusText.innerText = "कैमरा एरर!";
            }
        }

        function stopLiveCamera() {
            if (inputVideo.srcObject) {
                inputVideo.srcObject.getTracks().forEach(track => track.stop());
            }
            if (animFrameId) cancelAnimationFrame(animFrameId);
            if (bgVideo) bgVideo.pause();
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            statusText.innerText = "कैमरा बंद है";
        }

        function handleAudioUpload(e) {
            const files = e.target.files;
            const audioList = document.getElementById('audioList');
            
            Array.from(files).forEach((file) => {
                const audioEl = new Audio(URL.createObjectURL(file));
                const audioSource = audioCtx.createMediaElementSource(audioEl);
                const gainNode = audioCtx.createGain();
                
                audioSource.connect(gainNode);
                gainNode.connect(audioMixDestination);
                gainNode.connect(audioCtx.destination);

                loadedAudios.push({ audioEl, gainNode });

                const item = document.createElement('div');
                item.className = 'audio-item';
                item.innerHTML = `
                    <p style="font-size:10px; color:#00e5ff;">🎵 ${file.name}</p>
                    <div class="audio-controls">
                        <button onclick="playAudio(${loadedAudios.length - 1})" style="padding:4px;">▶️ प्ले</button>
                        <button onclick="pauseAudio(${loadedAudios.length - 1})" style="padding:4px;">⏸️ पॉज़</button>
                        <input type="range" min="0" max="1" step="0.1" value="0.8" oninput="setAudioVolume(${loadedAudios.length - 1}, this.value)">
                    </div>
                `;
                audioList.appendChild(item);
            });
        }

        function playAudio(index) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            loadedAudios[index].audioEl.play();
        }

        function pauseAudio(index) {
            loadedAudios[index].audioEl.pause();
        }

        function setAudioVolume(index, val) {
            loadedAudios[index].gainNode.gain.value = parseFloat(val);
        }

        bgImageUpload.addEventListener('change', (e) => {
            if (e.target.files[0]) {
                bgImage.src = URL.createObjectURL(e.target.files[0]);
                activeBgMode = 'image';
            }
        });

        bgVideoUpload.addEventListener('change', (e) => {
            if (e.target.files[0]) {
                bgVideo.src = URL.createObjectURL(e.target.files[0]);
                activeBgMode = 'video';
                bgVideo.play();
            }
        });

        function capturePhoto() {
            const link = document.createElement('a');
            link.download = "Rox_HD_Live_Photo.png";
            link.href = canvas.toDataURL("image/png");
            link.click();
            statusText.innerText = "📸 HD फोटो सेव हो गई!";
        }

        function toggleRecording() {
            if (!isRecording) {
                recordedChunks = [];
                const canvasStream = canvas.captureStream(30);
                const combinedStream = new MediaStream();

                canvasStream.getVideoTracks().forEach(track => combinedStream.addTrack(track));
                audioMixDestination.stream.getAudioTracks().forEach(track => combinedStream.addTrack(track));

                mediaRecorder = new MediaRecorder(combinedStream, { mimeType: 'video/webm' });
                mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) recordedChunks.push(e.data); };
                mediaRecorder.onstop = () => {
                    const blob = new Blob(recordedChunks, { type: 'video/webm' });
                    const a = document.createElement('a');
                    a.href = URL.createObjectURL(blob);
                    a.download = 'Rox_Studio_HD_Video.webm';
                    a.click();
                };
                
                mediaRecorder.start();
                isRecording = true;
                recBtn.innerText = "⏹️ रिकॉर्डिंग रोकें";
                recBtn.classList.add('recording');
            } else {
                mediaRecorder.stop();
                isRecording = false;
                recBtn.innerText = "🎥 HD वीडियो रिकॉर्ड करें";
                recBtn.classList.remove('recording');
                statusText.innerText = "✅ वीडियो डाउनलोड हो गया!";
            }
        }

        window.onload = initAI;
    </script>
</body>
</html>
